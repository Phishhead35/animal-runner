<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Cartoon Animal Runner</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:#bfe9ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap {
      height:100dvh; display:flex; align-items:center; justify-content:center;
      padding:4px 8px 80px 8px;
    }
    canvas {
      width:min(960px,100%);
      max-height:60dvh;
      height:auto; aspect-ratio:960/540;
      border:2px solid #232323; border-radius:12px; background:transparent; touch-action:none;
    }
    .hud {
      position:fixed; top:max(4px,env(safe-area-inset-top)); left:8px; right:8px;
      display:flex; gap:6px; align-items:center; justify-content:space-between;
      color:#232323; font-size:12px; pointer-events:none; flex-wrap:wrap;
    }
    .hud .left, .hud .right { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .pill { background:rgba(255,255,255,0.75); border:1px solid rgba(35,35,35,0.25); border-radius:999px; padding:4px 8px; }
    .controls {
      position:fixed; left:8px; right:8px;
      bottom:max(8px, env(safe-area-inset-bottom));
      display:flex; gap:8px; justify-content:space-between; align-items:flex-end; flex-wrap:wrap;
    }
    .cluster { display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; }
    button {
      appearance:none; border:2px solid #232323; background:rgba(255,255,255,0.85);
      border-radius:14px; padding:9px 11px; font-size:13px; font-weight:700;
      box-shadow:0 6px 0 rgba(35,35,35,0.12); cursor:pointer; line-height:1.2;
    }
    button:active { transform:translateY(2px); box-shadow:0 4px 0 rgba(35,35,35,0.12); }
    .btn-wide { padding:11px 14px; font-size:15px; }
    @media (max-height: 500px) {
      .hud .right .pill:last-child { display:none; }
      button { padding:7px 9px; font-size:12px; }
      .btn-wide { padding:9px 12px; font-size:13px; }
      .wrap { padding-bottom:64px; }
    }
    .btn-red    { background:rgba(255,220,220,0.9); }
    .btn-blue   { background:rgba(215,235,255,0.9); }
    .btn-purple { background:rgba(235,220,255,0.9); }
    .btn-green  { background:rgba(220,255,230,0.9); }
    .btn-dark   { background:rgba(35,35,35,0.88); color:white; }
    .small { font-size:12px; font-weight:600; opacity:0.9; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="left">
      <div class="pill" id="hudScore">Score: 0</div>
      <div class="pill" id="hudCoins">Coins: 0</div>
      <div class="pill" id="hudWallet">Wallet: 0</div>
      <div class="pill" id="hudPowers">Powers: none</div>
    </div>
    <div class="right">
      <div class="pill" id="hudChar">Frog</div>
      <div class="pill" id="hudAssist">Assist: ON</div>
      <div class="pill" id="hudAudio">Audio: Muted</div>
      <div class="pill small">Tap=jump • Hold=high jump • Hold ↓/S=duck • M audio • A assist</div>
    </div>
  </div>
  <div class="wrap">
    <canvas id="c" width="960" height="540"></canvas>
  </div>
  <div class="controls">
    <div class="cluster">
      <button class="btn-wide btn-dark" id="btnJump">JUMP</button>
      <button class="btn-wide btn-dark" id="btnDuck">DUCK ↓</button>
      <button class="btn-green" id="btnShop">SHOP (S)</button>
      <button class="btn-green" id="btnAssist">ASSIST: ON (A)</button>
      <button class="btn-dark"  id="btnAudio">AUDIO (M)</button>
      <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0"
        style="width:80px;accent-color:#232323;cursor:pointer;vertical-align:middle;margin-left:4px;" title="Music volume">
    </div>
    <div class="cluster">
      <button class="btn-blue"   id="btnShield">Shield (1)<div class="small">10 coins</div></button>
      <button class="btn-red"    id="btnMagnet">Magnet (2)<div class="small">12 coins</div></button>
      <button class="btn-purple" id="btnDouble">Double (3)<div class="small">12 coins</div></button>
    </div>
  </div>

    hippo:    { label:"Hippo 🦛",     emoji:"🦛", cost:70,
                skins:{ grey:      { label:"Grey",        cost:0,   body:"#8899aa", belly:"#e8d0c8", legendary:false },

    elephant: { label:"Elephant 🐘",  emoji:"🐘", cost:80,
                skins:{ grey:      { label:"Grey",        cost:0,   body:"#8888aa", belly:"#ccccdd", legendary:false },
                        brown:     { label:"Brown",       cost:30,  body:"#997755", belly:"#ddbb99", legendary:false },

                        storm:     { label:"⚡ Storm",    cost:90,  body:"#445566", belly:"#aabbcc", legendary:true  } } },
    puffin:   { label:"Puffin 🐦",    emoji:"🐦", cost:90,
                skins:{ classic:   { label:"Classic",     cost:0,   body:"#111111", belly:"#ffffff", legendary:false },
                        blue:      { label:"Blue",        cost:30,  body:"#334488", belly:"#aabbdd", legendary:false },
                        brown:     { label:"Brown",       cost:30,  body:"#553322", belly:"#ddbbaa", legendary:false },
                        rainbow:   { label:"Rainbow",     cost:50,  body:"#111111", belly:"#ffffff", legendary:false },
                        solar:     { label:"☀️ Solar",    cost:90,  body:"#bb6600", belly:"#ffdd44", legendary:true  } } },
    axolotl:  { label:"Axolotl 🫧",   emoji:"🫧", cost:100,
                skins:{ pink:      { label:"Pink",        cost:0,   body:"#f0a0b8", belly:"#ffd8e8", legendary:false },
                        leucistic:  { label:"Leucistic",  cost:30,  body:"#f8eedd", belly:"#ffffff", legendary:false },
                        golden:    { label:"Golden",      cost:30,  body:"#f0c840", belly:"#fff0a0", legendary:false },
                        wild:      { label:"Wild Type",   cost:50,  body:"#556644", belly:"#aabb88", legendary:false },
                        void:      { label:"🌌 Void",     cost:100, body:"#110022", belly:"#6600aa", legendary:true  } } },
    pig:      { label:"Pig 🐷",       emoji:"🐷", cost:110,
                skins:{ pink:      { label:"Pink",        cost:0,   body:"#f0a0b0", belly:"#ffd0dc", legendary:false },
                        peach:     { label:"Peach",       cost:30,  body:"#e8b890", belly:"#f8dcc0", legendary:false },
                        spotted:   { label:"Spotted",     cost:30,  body:"#e88898", belly:"#ffc8d0", legendary:false },
                        black:     { label:"Black",       cost:50,  body:"#333344", belly:"#665566", legendary:false },
                        candy:     { label:"🍬 Candy",    cost:100, body:"#ff44aa", belly:"#ffaadd", legendary:true  } } },
    moose:    { label:"Moose 🫎",     emoji:"🫎", cost:120,
                skins:{ brown:     { label:"Brown",       cost:0,   body:"#7a5030", belly:"#c09060", legendary:false },
                        dark:      { label:"Dark",        cost:30,  body:"#3a2010", belly:"#7a5030", legendary:false },
                        tan:       { label:"Tan",         cost:30,  body:"#b08050", belly:"#e0c090", legendary:false },
                        white:     { label:"White",       cost:50,  body:"#e8e0d0", belly:"#ffffff", legendary:false },
                        spectral:  { label:"👻 Spectral", cost:100, body:"#ccddee", belly:"#eef8ff", legendary:true  } } },
    bear:     { label:"Bear 🐻",      emoji:"🐻", cost:130,
                skins:{ brown:     { label:"Brown",       cost:0,   body:"#8b5e3c", belly:"#d4a878", legendary:false },
                        black:     { label:"Black",       cost:30,  body:"#222222", belly:"#554444", legendary:false },
                        grizzly:   { label:"Grizzly",     cost:30,  body:"#b07840", belly:"#e0b870", legendary:false },
                        polar:     { label:"Polar",       cost:50,  body:"#f0f0ee", belly:"#ffffff", legendary:false },
                        obsidian:  { label:"🖤 Obsidian", cost:100, body:"#111111", belly:"#332233", legendary:true  } } },
  };
  const CHAR_KEYS = Object.keys(CHARACTERS);

  // ── Persistence ───────────────────────────────────────────────────────────────
  const SAVE_KEY = "cartoon_animal_runner_v2";
  function loadSave() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      s.wallet       ??= 0;
      s.best         ??= 0;
      s.character    ??= "frog";
      s.charSkin     ??= {};
      s.ownedChars   ??= ["frog"];
      s.ownedSkins   ??= {};
      s.assist       ??= ASSIST_ON;
      if (!CHARACTERS[s.character]) s.character = "frog";
      if (!s.ownedChars.includes("frog")) s.ownedChars.push("frog");
      for (const ck of CHAR_KEYS) {
        s.ownedSkins[ck] ??= [Object.keys(CHARACTERS[ck].skins)[0]];
      }
      return s;
    } catch {
      const os = {};
      for (const ck of CHAR_KEYS) os[ck] = [Object.keys(CHARACTERS[ck].skins)[0]];
      return { wallet:0, best:0, character:"frog", charSkin:{}, ownedChars:["frog"], ownedSkins:os, assist:ASSIST_ON };
    }
  }
  function persist() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  let save = loadSave();

  function activeSkinKey(ck) {
    const k = save.charSkin[ck];
    return (k && CHARACTERS[ck].skins[k]) ? k : Object.keys(CHARACTERS[ck].skins)[0];
  }
  function activeSkin(ck) { return CHARACTERS[ck].skins[activeSkinKey(ck)]; }

  // ── Legendary particle system ─────────────────────────────────────────────────
  let particles = [];
  function spawnLegendaryParticles(px, py, pw, ph, color) {
    if (Math.random() > 0.3) return;
    particles.push({
      x: px + Math.random() * pw,
      y: py + Math.random() * ph,
      vx: (Math.random() - 0.5) * 60,
      vy: -30 - Math.random() * 60,
      r: 2 + Math.random() * 3,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 0.6 + Math.random() * 0.4,
      color
    });
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 60 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.save(); ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // ── Audio ─────────────────────────────────────────────────────────────────────
  let audioCtx = null, muted = true;
  let musicGain = null, musicNodes = [], musicTrack = null, musicVolume = 0.35;

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = muted ? 0 : musicVolume * 0.5;
    musicGain.connect(audioCtx.destination);
  }
  function unlockAudio() { if (audioCtx && audioCtx.state==="suspended") audioCtx.resume(); }
  function beep(freq=440, dur=0.06, gain=0.05) {
    if (muted||!audioCtx) return; unlockAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="square"; o.frequency.value=freq; g.gain.value=gain;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }
  const midiHz = n => 440 * Math.pow(2,(n-69)/12);
  function schedNote(type,freq,startT,dur,peakGain,bus) {
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,startT);
    g.gain.linearRampToValueAtTime(peakGain,startT+0.01);
    g.gain.setValueAtTime(peakGain,startT+dur*0.7);
    g.gain.linearRampToValueAtTime(0,startT+dur);
    o.connect(g); g.connect(bus);
    o.start(startT); o.stop(startT+dur+0.02);
    musicNodes.push(o,g);
  }
  function stopMusic() {
    for (const n of musicNodes) { try{if(n.stop)n.stop();}catch(_){} try{n.disconnect();}catch(_){} }
    musicNodes=[]; musicTrack=null;
  }

  // Three music tracks
  const RUN_MELODY = [72,72,74,76,79,76,74,72,74,74,76,79,81,79,76,74,76,79,81,83,84,83,81,79,79,76,74,72,71,72,74,72].map(n=>({n,dur:0.125}));
  const RUN_BASS   = [60,60,67,60,60,60,67,60,62,62,69,62,62,62,69,62,64,64,71,64,64,64,71,64,62,62,69,62,60,60,67,60].map(n=>({n,dur:0.125}));

  // Medium phase — slightly faster, minor feel
  const MED_MELODY = [69,72,76,79,81,79,76,72,71,74,77,81,83,81,77,74,72,76,79,83,84,83,79,76,74,77,81,84,86,84,81,77].map(n=>({n,dur:0.11}));
  const MED_BASS   = [57,57,64,57,57,57,64,57,59,59,66,59,59,59,66,59,60,60,67,60,60,60,67,60,59,59,66,59,57,57,64,57].map(n=>({n,dur:0.11}));

  // Hard phase — fast, intense
  const HARD_MELODY = [76,79,81,84,86,84,81,79,77,81,84,86,88,86,84,81,79,83,86,88,89,88,86,83,81,84,86,88,91,88,86,84].map(n=>({n,dur:0.095}));
  const HARD_BASS   = [64,64,71,64,64,64,71,64,65,65,72,65,65,65,72,65,67,67,74,67,67,67,74,67,65,65,72,65,64,64,71,64].map(n=>({n,dur:0.095}));

  const TITLE_MELODY = [69,72,76,81,79,76,72,69,67,71,74,79,77,74,71,67,65,69,72,77,76,72,69,65,67,71,74,79,81,79,76,72].map(n=>({n,dur:0.22}));
  const TITLE_BASS   = [57,57,64,57,57,57,64,57,55,55,62,55,55,55,62,55,53,53,60,53,53,53,60,53,55,55,62,55,57,57,64,57].map(n=>({n,dur:0.22}));

  function schedSequence(notes,type,gainPeak,bus,startT) {
    let t=startT;
    for (const note of notes) { schedNote(type,midiHz(note.n),t,note.dur*0.85,gainPeak,bus); t+=note.dur; }
    return t-startT;
  }
  function startLooper(melNotes,bassNotes,lookahead=0.1) {
    if (!audioCtx||muted) return;
    const melBus=audioCtx.createGain(); melBus.gain.value=1.0; melBus.connect(musicGain);
    const bassBus=audioCtx.createGain(); bassBus.gain.value=0.55; bassBus.connect(musicGain);
    musicNodes.push(melBus,bassBus);
    function loop(startT) {
      const melDur=schedSequence(melNotes,"square",0.22,melBus,startT);
      const bassDur=schedSequence(bassNotes,"triangle",0.30,bassBus,startT);
      const barDur=Math.max(melDur,bassDur);
      const schedDelay=(startT+barDur-lookahead-audioCtx.currentTime)*1000;
      setTimeout(()=>{ if(!muted&&musicNodes.includes(melBus)) loop(startT+barDur); },Math.max(0,schedDelay));
    }
    loop(audioCtx.currentTime+0.05);
  }
  function playMusic(track) {
    if (musicTrack===track) return;
    stopMusic(); if (!audioCtx||muted) return; musicTrack=track;
    if (track==="play")   startLooper(RUN_MELODY,RUN_BASS);
    if (track==="medium") startLooper(MED_MELODY,MED_BASS);
    if (track==="hard")   startLooper(HARD_MELODY,HARD_BASS);
    if (track==="start")  startLooper(TITLE_MELODY,TITLE_BASS);
  }
  function applyMusicVolume() { if (musicGain) musicGain.gain.value = muted?0:musicVolume*0.5; }
  function setMuted(v) {
    muted=v;
    if (!muted) {
      ensureAudio();
      audioCtx.resume().then(()=>{ applyMusicVolume(); musicTrack=null; const t=getMusicTrack(); playMusic(t); beep(330,0.05,0.05); setTimeout(()=>beep(440,0.05,0.05),60); });
    } else { applyMusicVolume(); stopMusic(); }
    hudAudio.textContent=`Audio: ${muted?"Muted":"On"}`; updateVolSlider();
  }
  function getMusicTrack() {
    if (state!=="play") return "start";
    if (runTime < PHASE1_END) return "play";
    if (runTime < PHASE2_END) return "medium";
    return "hard";
  }
  function setMusicVolume(v) { musicVolume=Math.max(0,Math.min(1,v)); applyMusicVolume(); updateVolSlider(); }
  function updateVolSlider() { const sl=document.getElementById("volSlider"); if(sl) sl.value=muted?0:musicVolume; }

  // ── Assist ────────────────────────────────────────────────────────────────────
  let assist=!!save.assist, assistShieldGiven=false;
  function setAssist(v) { assist=!!v; save.assist=assist; persist(); refreshAssistUI(); }
  function refreshAssistUI() { btnAssist.textContent=`ASSIST: ${assist?"ON":"OFF"} (A)`; hudAssist.textContent=`Assist: ${assist?"ON":"OFF"}`; }
  refreshAssistUI();

  // ── Game state ────────────────────────────────────────────────────────────────
  let state="start";
  let runTime=0, dist=0, score=0, coinsRun=0, speed=SPEED_P1, nextSpawn=W+200;
  let obstacles=[], coinList=[], orbList=[];
  let lastMusicTrack = "start";

  const player = {
    x:160, y:0, w:56, h:72,
    vy:0, on:true, tt:0,
    shieldT:0, magnetT:0, doubleT:0, doubleUsed:false,
    coyoteT:0, chargeT:0, charging:false, jumpHeld:false, ducking:false,
  };
  let duckHeld=false;

  const clouds=Array.from({length:8},()=>randomCloud(true));
  function randomCloud(init=false) {
    return {x:init?Math.random()*W:W+40+Math.random()*160, y:40+Math.random()*170, s:0.7+Math.random()*1.0, v:16+Math.random()*22};
  }

  // Shop state
  let shopTab="chars";
  let shopCharIdx=CHAR_KEYS.indexOf(save.character);
  let shopSkinIdx=0;
  let shopCharScrollOffset=0;
  function currentShopChar()  { return CHAR_KEYS[shopCharIdx]; }
  function currentShopSkins() { return Object.keys(CHARACTERS[currentShopChar()].skins); }

  function resetRun() {
    runTime=0; dist=0; score=0; coinsRun=0; speed=SPEED_P1; nextSpawn=W+200;
    obstacles=[]; coinList=[]; orbList=[]; particles=[];
    player.y=GROUND_Y-player.h; player.vy=0; player.on=true; player.tt=0;
    player.shieldT=0; player.magnetT=0; player.doubleT=0;
    player.doubleUsed=false; player.coyoteT=0;
    player.chargeT=0; player.charging=false; player.jumpHeld=false; player.ducking=false;
    assistShieldGiven=false; duckHeld=false; lastMusicTrack="play";
    playMusic("play");
  }

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rint=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
  const rects=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

  function speedForTime(rt) {
    const cap=assist?SPEED_CAP_ASS:SPEED_CAP_NORM;
    if (rt<PHASE1_END) return SPEED_P1;
    if (rt<PHASE2_END) return SPEED_P1+(rt-PHASE1_END)*((SPEED_P2-SPEED_P1)/(PHASE2_END-PHASE1_END));
    if (rt<PHASE3_END) return SPEED_P2+(rt-PHASE2_END)*((SPEED_P3-SPEED_P2)/(PHASE3_END-PHASE2_END));
    return Math.min(cap, SPEED_P3+(rt-PHASE3_END)*0.5);
  }
  function rateIndex(rt) { return rt<PHASE1_END?0:rt<PHASE2_END?1:rt<PHASE3_END?2:3; }
  function gapRange(s) {
    const bonus=Math.floor(Math.max(0,(s-SPEED_P1)*GAP_FACTOR));
    return {min:GAP_MIN_BASE+bonus, max:GAP_MAX_BASE+bonus};
  }

  // ── Spawning ──────────────────────────────────────────────────────────────────
  function spawnPack() {
    const ri=rateIndex(runTime);
    const isAir=Math.random()<BIRD_RATES[ri];
    let kind, x=nextSpawn, y, w, h;
    if (isAir) {
      const airRoll=Math.random();
      if (ri>=2&&airRoll<0.3) kind="bat";
      else if (ri>=1&&airRoll<0.5) kind="eagle";
      else kind="bird";
      w=rint(58,90); h=rint(34,52);
      y = kind==="bat" ? BIRD_FLY_Y-20 : BIRD_FLY_Y;
    } else {
      const groundRoll=Math.random();
      if (ri>=2&&groundRoll<0.25) kind="log";
      else if (ri>=1&&groundRoll<0.50) kind="rock";
      else if (ri>=1&&groundRoll<0.75) kind="cactus";
      else kind="snake";
      w=rint(50,82); h=rint(34,54);
      y=GROUND_Y-h;
    }
    obstacles.push({x,y,w,h,kind,phase:Math.random()*Math.PI*2});

    if (Math.random()<COIN_CHANCE) {
      const cy=isAir
        ? clamp(BIRD_GAP_BOTTOM-rint(20,50),200,GROUND_Y-40)
        : clamp(y-rint(30,90),100,GROUND_Y-40);
      coinList.push({x:x+w/2+rint(-24,24), y:cy, r:12, got:false, popT:0});
    }
    if (Math.random()<ORB_RATES[ri]) {
      const orbKind=["shield","magnet","double"][rint(0,2)];
      orbList.push({x:x+w/2, y:clamp(y-rint(60,130),100,GROUND_Y-70), r:14, kind:orbKind, got:false});
    }
    const gr=gapRange(speed);
    nextSpawn=x+rint(gr.min,gr.max)+rint(0,GAP_TAIL_EXTRA);
  }

  // ── Jump/Duck ─────────────────────────────────────────────────────────────────
  let lastTapTime=0;
  const DOUBLE_TAP_MS=300;
  function jumpPressed() {
    if (state!=="play") return;
    const now=performance.now();
    const isDoubleTap=(now-lastTapTime)<DOUBLE_TAP_MS; lastTapTime=now;
    player.jumpHeld=true;
    if (isDoubleTap&&(player.on||player.coyoteT>0)) {
      player.charging=false; player.chargeT=0;
      const jumpV=assist?JUMP_V_ASS:JUMP_V_NORM;
      player.vy=-Math.floor(jumpV*0.78); player.on=false; player.coyoteT=0;
      beep(520,0.05,0.05); return;
    }
    if (player.on||player.coyoteT>0) { player.charging=true; player.chargeT=0; }
    else if (player.doubleT>0&&!player.doubleUsed) {
      player.doubleUsed=true;
      player.vy=-Math.floor((assist?JUMP_V_ASS:JUMP_V_NORM)*0.92);
      beep(620,0.05,0.05);
    }
  }
  function jumpReleased() {
    player.jumpHeld=false;
    if (player.charging) {
      player.charging=false;
      const jumpV=assist?JUMP_V_ASS:JUMP_V_NORM;
      const ratio=clamp(player.chargeT/CHARGE_TIME,0,1);
      player.vy=-Math.floor(jumpV*(JUMP_MIN_RATIO+(JUMP_MAX_RATIO-JUMP_MIN_RATIO)*ratio));
      player.on=false; player.coyoteT=0; player.chargeT=0;
      beep(380+ratio*260,0.06,0.05);
    }
  }

  // ── Powers ────────────────────────────────────────────────────────────────────
  function buyPower(kind) {
    if (state!=="play") return;
    if (save.wallet<POWER_COST[kind]) { beep(180,0.08,0.06); return; }
    save.wallet-=POWER_COST[kind]; persist();
    if (kind==="shield") player.shieldT=POWER_DUR.shield;
    if (kind==="magnet") player.magnetT=POWER_DUR.magnet;
    if (kind==="double") player.doubleT=POWER_DUR.double;
    beep(880,0.05,0.05); beep(1040,0.05,0.05);
  }
  function buyOrEquipChar(ck) {
    const ch=CHARACTERS[ck]; if(!ch) return;
    if (save.ownedChars.includes(ck)) { save.character=ck; shopCharIdx=CHAR_KEYS.indexOf(ck); shopSkinIdx=0; persist(); beep(440,0.05,0.04); }
    else if (save.wallet>=ch.cost) { save.wallet-=ch.cost; save.ownedChars.push(ck); save.character=ck; shopCharIdx=CHAR_KEYS.indexOf(ck); shopSkinIdx=0; persist(); beep(660,0.05,0.05); beep(880,0.05,0.05); }
    else beep(180,0.08,0.06);
  }
  function buyOrEquipSkin(ck,sk) {
    const skins=CHARACTERS[ck]?.skins; if(!skins||!skins[sk]) return;
    save.ownedSkins[ck]??=[];
    if (save.ownedSkins[ck].includes(sk)) { save.charSkin[ck]=sk; persist(); beep(440,0.05,0.04); }
    else if (save.wallet>=skins[sk].cost) { save.wallet-=skins[sk].cost; save.ownedSkins[ck].push(sk); save.charSkin[ck]=sk; persist(); beep(660,0.05,0.05); beep(880,0.05,0.05); }
    else beep(180,0.08,0.06);
  }

  // ── Input ─────────────────────────────────────────────────────────────────────
  window.addEventListener("keydown",e=>{
    ensureAudio(); unlockAudio();
    const code=e.code;
    if (code==="Space"||code==="ArrowUp") { if(state==="start"||state==="over"){state="play";resetRun();} if(!e.repeat)jumpPressed(); e.preventDefault(); }
    if (code==="KeyR"&&state!=="play") { state="play"; resetRun(); }
    if (code==="KeyM") setMuted(!muted);
    if (code==="KeyS"&&state!=="play") { state=(state==="shop")?"start":"shop"; if(state==="start"||state==="shop")playMusic("start"); }
    if (code==="KeyS"&&state==="play") { player.ducking=true; duckHeld=true; e.preventDefault(); }
    if (code==="ArrowDown"&&state==="play") { player.ducking=true; duckHeld=true; e.preventDefault(); }
    if (code==="KeyA") setAssist(!assist);
    if (code==="Digit1") buyPower("shield");
    if (code==="Digit2") buyPower("magnet");
    if (code==="Digit3") buyPower("double");
    if (state==="shop") {
      const VISIBLE_ROWS=5;
      const skinKeys=currentShopSkins();
      if (code==="Tab") { shopTab=shopTab==="chars"?"skins":"chars"; shopSkinIdx=0; e.preventDefault(); }
      if (shopTab==="chars") {
        if (code==="ArrowDown"||code==="ArrowUp") {
          if(code==="ArrowDown") shopCharIdx=(shopCharIdx+1)%CHAR_KEYS.length;
          else shopCharIdx=(shopCharIdx-1+CHAR_KEYS.length)%CHAR_KEYS.length;
          if(shopCharIdx<shopCharScrollOffset) shopCharScrollOffset=shopCharIdx;
          if(shopCharIdx>=shopCharScrollOffset+VISIBLE_ROWS) shopCharScrollOffset=shopCharIdx-VISIBLE_ROWS+1;
          e.preventDefault();
        }
        if (code==="Enter") buyOrEquipChar(CHAR_KEYS[shopCharIdx]);
      } else {
        if(code==="ArrowDown"){shopSkinIdx=(shopSkinIdx+1)%skinKeys.length;e.preventDefault();}
        if(code==="ArrowUp"){shopSkinIdx=(shopSkinIdx-1+skinKeys.length)%skinKeys.length;e.preventDefault();}
        if(code==="Enter") buyOrEquipSkin(currentShopChar(),skinKeys[shopSkinIdx]);
      }
      if(code==="Escape") state="start";
    }
  });
  window.addEventListener("keyup",e=>{
    if(e.code==="Space"||e.code==="ArrowUp") jumpReleased();
    if(e.code==="ArrowDown"||e.code==="KeyS"){player.ducking=false;duckHeld=false;}
  });

  const activePointers=new Set();
  function onPointerDown(e) {
    ensureAudio(); unlockAudio();
    if(state==="shop") return;
    if(state==="start"||state==="over"){state="play";resetRun();}
    if(!activePointers.has(e.pointerId)){activePointers.add(e.pointerId);jumpPressed();}
    e.preventDefault?.();
  }
  function onPointerUp(e){if(activePointers.delete(e.pointerId))jumpReleased();}
  canvas.addEventListener("pointerdown",onPointerDown);
  canvas.addEventListener("pointerup",onPointerUp);
  canvas.addEventListener("pointercancel",onPointerUp);

  document.getElementById("btnJump").addEventListener("pointerdown",e=>{
    ensureAudio(); unlockAudio();
    if(state==="start"||state==="over"){state="play";resetRun();}
    if(!activePointers.has("btn")){activePointers.add("btn");jumpPressed();}
    e.preventDefault();
  });
  document.getElementById("btnJump").addEventListener("pointerup",()=>{activePointers.delete("btn");jumpReleased();});
  document.getElementById("btnJump").addEventListener("pointercancel",()=>{activePointers.delete("btn");jumpReleased();});

  const btnDuck=document.getElementById("btnDuck");
  btnDuck.addEventListener("pointerdown",e=>{player.ducking=true;duckHeld=true;e.preventDefault();});
  btnDuck.addEventListener("pointerup",()=>{player.ducking=false;duckHeld=false;});
  btnDuck.addEventListener("pointercancel",()=>{player.ducking=false;duckHeld=false;});
  btnDuck.addEventListener("mouseleave",()=>{player.ducking=false;duckHeld=false;});

  document.getElementById("btnShop").addEventListener("click",()=>{state=(state==="shop"?"start":"shop");playMusic("start");});
  btnAssist.addEventListener("click",()=>setAssist(!assist));
  btnAudio.addEventListener("click",()=>setMuted(!muted));
  const volSlider=document.getElementById("volSlider");
  volSlider.addEventListener("input",e=>{
    const v=parseFloat(e.target.value);
    if(v===0){if(!muted)setMuted(true);}
    else{if(muted)setMuted(false);else setMusicVolume(v);}
  });
  document.getElementById("btnShield").addEventListener("click",()=>buyPower("shield"));
  document.getElementById("btnMagnet").addEventListener("click",()=>buyPower("magnet"));
  document.getElementById("btnDouble").addEventListener("click",()=>buyPower("double"));

  // Shop scroll
  canvas.addEventListener("wheel",e=>{
    if(state!=="shop") return; e.preventDefault();
    const VISIBLE_ROWS=5;
    if(shopTab==="chars"){
      if(e.deltaY>0) shopCharIdx=Math.min(shopCharIdx+1,CHAR_KEYS.length-1);
      else shopCharIdx=Math.max(shopCharIdx-1,0);
      if(shopCharIdx<shopCharScrollOffset) shopCharScrollOffset=shopCharIdx;
      if(shopCharIdx>=shopCharScrollOffset+VISIBLE_ROWS) shopCharScrollOffset=shopCharIdx-VISIBLE_ROWS+1;
    } else {
      const sk=currentShopSkins();
      if(e.deltaY>0) shopSkinIdx=Math.min(shopSkinIdx+1,sk.length-1);
      else shopSkinIdx=Math.max(shopSkinIdx-1,0);
    }
  },{passive:false});

  let shopTouchStartY=0;
  canvas.addEventListener("touchstart",e=>{if(state==="shop")shopTouchStartY=e.touches[0].clientY;},{passive:true});
  canvas.addEventListener("touchend",e=>{
    if(state!=="shop") return;
    const dy=shopTouchStartY-e.changedTouches[0].clientY;
    if(Math.abs(dy)<20) return;
    const VISIBLE_ROWS=5, steps=Math.round(dy/50);
    if(shopTab==="chars"){
      shopCharIdx=Math.max(0,Math.min(CHAR_KEYS.length-1,shopCharIdx+steps));
      if(shopCharIdx<shopCharScrollOffset) shopCharScrollOffset=shopCharIdx;
      if(shopCharIdx>=shopCharScrollOffset+VISIBLE_ROWS) shopCharScrollOffset=shopCharIdx-VISIBLE_ROWS+1;
    } else { const sk=currentShopSkins(); shopSkinIdx=Math.max(0,Math.min(sk.length-1,shopSkinIdx+steps)); }
  },{passive:true});

  canvas.addEventListener("click",e=>{
    if(state!=="shop") return;
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width), my=(e.clientY-rect.top)*(H/rect.height);
    if(my>=155&&my<=195){
      if(mx>=80&&mx<=340) shopTab="chars";
      if(mx>=360&&mx<=620){shopTab="skins";shopSkinIdx=0;}
    }
    const rowH=54, startY=218, VISIBLE_ROWS=5, arrowX=W-58;
    if(mx>=arrowX-16&&mx<=arrowX+16){
      if(my>=startY-50&&my<=startY-6){shopCharIdx=Math.max(0,shopCharIdx-1);if(shopCharIdx<shopCharScrollOffset)shopCharScrollOffset=shopCharIdx;}
      if(my>=startY+VISIBLE_ROWS*rowH+6&&my<=startY+VISIBLE_ROWS*rowH+34){shopCharIdx=Math.min(CHAR_KEYS.length-1,shopCharIdx+1);if(shopCharIdx>=shopCharScrollOffset+VISIBLE_ROWS)shopCharScrollOffset=shopCharIdx-VISIBLE_ROWS+1;}
    }
    if(shopTab==="chars"){
      CHAR_KEYS.forEach((ck,i)=>{
        const y=startY+(i-shopCharScrollOffset)*rowH;
        if(mx>=80&&mx<=W-80&&my>=y-8&&my<=y+rowH-10&&i>=shopCharScrollOffset&&i<shopCharScrollOffset+VISIBLE_ROWS){shopCharIdx=i;buyOrEquipChar(ck);}
      });
    } else {
      currentShopSkins().forEach((sk,i)=>{
        const y=startY+i*rowH;
        if(mx>=80&&mx<=W-80&&my>=y-8&&my<=y+rowH-10){shopSkinIdx=i;buyOrEquipSkin(currentShopChar(),sk);}
      });
    }
  });

  // ── Drawing helpers ───────────────────────────────────────────────────────────
  function drawRoundRect(x,y,w,h,r) {
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawSky(now) {
    // Subtle sky gradient that shifts slightly with phase
    const phase = state==="play" ? Math.min(1, (runTime-PHASE1_END)/(PHASE3_END-PHASE1_END)) : 0;
    const r1=Math.round(170-phase*30), g1=Math.round(225-phase*30), b1=255;
    const r2=Math.round(140-phase*20), g2=Math.round(200-phase*25), b2=Math.round(255-phase*15);
    for (let i=0;i<12;i++) {
      const u=i/11;
      ctx.fillStyle=`rgb(${Math.round(r1+(r2-r1)*u)},${Math.round(g1+(g2-g1)*u)},${Math.round(b1+(b2-b1)*u)})`;
      ctx.fillRect(0,i*(H/12),W,H/12+1);
    }
  }

  function drawCloud(cl) {
    ctx.save(); ctx.globalAlpha=0.88; ctx.fillStyle="white";
    const {x,y,s}=cl;
    for (const [ox,oy,rx,ry] of [[60,55,60,30],[120,40,70,35],[180,58,55,28]]) {
      ctx.beginPath(); ctx.ellipse(x+ox*s,y+oy*s,rx*s,ry*s,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawEye(cx,cy,r,irisCol="#1a1a1a") {
    ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=irisCol; ctx.beginPath(); ctx.arc(cx+r*0.15,cy,r*0.55,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(cx+r*0.38,cy-r*0.30,r*0.22,0,Math.PI*2); ctx.fill();
  }

  // ── Legendary glow effect ─────────────────────────────────────────────────────
  function drawLegendaryGlow(px, py, pw, ph, color, now) {
    const pulse = 0.5 + 0.5*Math.sin(now/400);
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.10*pulse;
    const grad = ctx.createRadialGradient(px+pw/2,py+ph/2,pw*0.2,px+pw/2,py+ph/2,pw*0.9);
    grad.addColorStop(0, color);
    grad.addColorStop(1, "transparent");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.ellipse(px+pw/2,py+ph/2,pw*0.9,ph*0.9,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ── Mini character preview ────────────────────────────────────────────────────
  function drawMiniChar(ck,skinKey,cx,cy,sc) {
    const skin=CHARACTERS[ck].skins[skinKey];
    const b=skin.body, v=skin.belly;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(sc,sc);
    ctx.strokeStyle=INK; ctx.lineWidth=2/sc;
    if (ck==="frog") {
      ctx.fillStyle=b; drawRoundRect(-13,-16,26,30,8); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,6,7,5,0,0,Math.PI*2); ctx.fill();
      for (const ex of [-1,1]) { ctx.fillStyle=b; ctx.beginPath(); ctx.arc(ex*8,-20,7,0,Math.PI*2); ctx.fill(); ctx.stroke(); drawEye(ex*8,-20,4); }
    } else if (ck==="dog") {
      ctx.fillStyle=b; drawRoundRect(-12,-12,24,28,6); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,8,6,5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(0,-18,11,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=b;
      ctx.beginPath(); ctx.ellipse(-13,-16,5,9,-0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(13,-16,5,9,0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
      drawEye(-5,-19,4); drawEye(5,-19,4);
      ctx.fillStyle="#cc6644"; ctx.beginPath(); ctx.ellipse(0,-9,4,3,0,0,Math.PI*2); ctx.fill();
    } else if (ck==="cat") {
      ctx.fillStyle=b; drawRoundRect(-12,-12,24,28,6); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,8,6,5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(0,-18,11,0,Math.PI*2); ctx.fill(); ctx.stroke();
      for (const ex of [-1,1]) { ctx.fillStyle=b; ctx.beginPath(); ctx.moveTo(ex*3,-26); ctx.lineTo(ex*14,-40); ctx.lineTo(ex*14,-22); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      drawEye(-5,-19,4,"#1a6600"); drawEye(5,-19,4,"#1a6600");
    } else if (ck==="monkey") {
      ctx.fillStyle=b; drawRoundRect(-12,-12,24,28,6); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,8,7,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(0,-18,12,0,Math.PI*2); ctx.fill(); ctx.stroke();
      for (const ex of [-1,1]) { ctx.fillStyle=b; ctx.beginPath(); ctx.arc(ex*14,-18,6,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=v; ctx.beginPath(); ctx.arc(ex*14,-18,3.5,0,Math.PI*2); ctx.fill(); }
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,-11,7,4.5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      drawEye(-5,-20,4); drawEye(5,-20,4);

  // ── Shop drawing ──────────────────────────────────────────────────────────────
  function drawShop() {
    drawSky(0); clouds.forEach(drawCloud);
    ctx.fillStyle="rgba(255,255,255,0.93)"; drawRoundRect(36,44,W-72,H-88,20); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=3; drawRoundRect(36,44,W-72,H-88,20); ctx.stroke();
    ctx.fillStyle=INK; ctx.font="bold 48px system-ui";
    ctx.fillText("SHOP",(W-ctx.measureText("SHOP").width)/2,104);
    ctx.font="17px system-ui";
    ctx.fillText(`💰 ${save.wallet} coins   🏆 Best: ${save.best}   Assist: ${assist?"ON":"OFF"} (A key)`,90,136);

    const tabDefs=[["chars","🐾 Characters"],["skins","🎨 Skins"]];
    tabDefs.forEach(([tab,label],ti)=>{
      const tx=80+ti*290, tw=270, ty=155, th=38;
      ctx.fillStyle=shopTab===tab?INK:"rgba(0,0,0,0.06)";
      drawRoundRect(tx,ty,tw,th,10); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=2; drawRoundRect(tx,ty,tw,th,10); ctx.stroke();
      ctx.fillStyle=shopTab===tab?"white":INK; ctx.font="bold 17px system-ui";
      ctx.fillText(label,tx+(tw-ctx.measureText(label).width)/2,ty+25);
    });

    ctx.font="14px system-ui"; ctx.fillStyle="rgba(35,35,35,0.45)";
    ctx.fillText("Tab=switch  •  ↑/↓ navigate  •  Enter select  •  Esc close  •  click rows",90,208);
    ctx.fillText("✨ = Legendary skin with special effects",90,224);

    const rowH=52, startY=232, VISIBLE_ROWS=5;

    if (shopTab==="chars") {
      ctx.save(); ctx.beginPath(); ctx.rect(60,startY-10,W-120,VISIBLE_ROWS*rowH+10); ctx.clip();
      CHAR_KEYS.forEach((ck,i)=>{
        const ch=CHARACTERS[ck], owned=save.ownedChars.includes(ck), equipped=save.character===ck, isSel=i===shopCharIdx;
        const y=startY+(i-shopCharScrollOffset)*rowH;
        ctx.fillStyle=equipped?"rgba(50,210,90,0.13)":isSel?"rgba(35,35,35,0.07)":"rgba(0,0,0,0.02)";
        drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.fill();
        if (isSel||equipped) { ctx.strokeStyle=equipped?"#30b060":INK; ctx.lineWidth=2; drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.stroke(); }
        const sk=activeSkinKey(ck);
        drawMiniChar(ck,sk,128,y+rowH/2-8,0.70);
        ctx.fillStyle=INK; ctx.font="bold 19px system-ui";
        const arrow=isSel?"▶ ":"   ";
        let badge=equipped?" ✓ PLAYING":owned?" (owned)":` — ${ch.cost} coins`;
        ctx.fillText(arrow+ch.label+badge,168,y+16);
        const skinData=CHARACTERS[ck].skins[sk];
        const isLeg=skinData.legendary;
        ctx.font="13px system-ui"; ctx.fillStyle=isLeg?"#9944ff":"rgba(35,35,35,0.5)";
        ctx.fillText(`Skin: ${skinData.label}${isLeg?" ✨":""}`,172,y+34);
      });
      ctx.restore();

      if (CHAR_KEYS.length>VISIBLE_ROWS) {
        const scrollH=VISIBLE_ROWS*rowH, thumbH=Math.max(30,scrollH*VISIBLE_ROWS/CHAR_KEYS.length);
        const thumbY=startY-6+(shopCharScrollOffset/(CHAR_KEYS.length-VISIBLE_ROWS))*(scrollH-thumbH);
        ctx.fillStyle="rgba(0,0,0,0.10)"; drawRoundRect(W-68,startY-6,8,scrollH,4); ctx.fill();
        ctx.fillStyle="rgba(0,0,0,0.32)"; drawRoundRect(W-68,thumbY,8,thumbH,4); ctx.fill();
        const arrowX=W-58, upY=startY-34, dnY=startY+scrollH+6;
        ctx.fillStyle=shopCharScrollOffset>0?"rgba(35,35,35,0.85)":"rgba(35,35,35,0.2)";
        drawRoundRect(arrowX-16,upY-16,32,28,8); ctx.fill();
        ctx.fillStyle="white"; ctx.font="bold 16px system-ui"; ctx.fillText("▲",arrowX-(ctx.measureText("▲").width/2),upY+5);
        ctx.fillStyle=shopCharScrollOffset<CHAR_KEYS.length-VISIBLE_ROWS?"rgba(35,35,35,0.85)":"rgba(35,35,35,0.2)";
        drawRoundRect(arrowX-16,dnY,32,28,8); ctx.fill();
        ctx.fillStyle="white"; ctx.fillText("▼",arrowX-(ctx.measureText("▼").width/2),dnY+18);
        ctx.fillStyle="rgba(35,35,35,0.4)"; ctx.font="12px system-ui"; ctx.fillText("scroll or swipe",arrowX-40,dnY+40);
      }
    } else {
      const ck=currentShopChar(), ch=CHARACTERS[ck], charOwned=save.ownedChars.includes(ck);
      ctx.fillStyle=INK; ctx.font="bold 18px system-ui";
      ctx.fillText(`Skins for: ${ch.label}`,90,220);
      if (!charOwned) { ctx.fillStyle="#cc3333"; ctx.font="15px system-ui"; ctx.fillText(`⚠ Unlock ${ch.label} first (${ch.cost} coins)`,90,238); }
      const sy=charOwned?startY:startY+20;
      currentShopSkins().forEach((sk,i)=>{
        const skin=ch.skins[sk], ownedSk=(save.ownedSkins[ck]??[]).includes(sk);
        const equipped=activeSkinKey(ck)===sk&&save.character===ck, isSel=i===shopSkinIdx;
        const y=sy+i*rowH, isLeg=skin.legendary;
        if (isLeg) {
          ctx.save(); ctx.globalAlpha=0.12;
          const grad=ctx.createLinearGradient(80,y,W-80,y+rowH);
          grad.addColorStop(0,skin.body); grad.addColorStop(1,skin.belly);
          ctx.fillStyle=grad; drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.fill(); ctx.restore();
        } else {
          ctx.fillStyle=equipped?"rgba(50,210,90,0.13)":isSel?"rgba(35,35,35,0.07)":"rgba(0,0,0,0.02)";
          drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.fill();
        }
        if (isSel||equipped) { ctx.strokeStyle=equipped?"#30b060":isLeg?"#9944ff":INK; ctx.lineWidth=2; drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.stroke(); }
        drawMiniChar(ck,sk,128,y+rowH/2-10,0.78);
        ctx.fillStyle=isLeg?"#7722cc":INK; ctx.font=`bold ${isLeg?22:20}px system-ui`;
        const arrow=isSel?"▶ ":"   ";
        let badge=equipped?" ✓ EQUIPPED":ownedSk?" (owned — click to equip)":` — ${skin.cost} coins`;
        ctx.fillText(arrow+skin.label+(isLeg?" ✨":"")+badge,168,y+26);
      });
    }
    ctx.font="15px system-ui"; ctx.fillStyle="rgba(35,35,35,0.4)";
    ctx.fillText("Power-ups: 1=Shield • 2=Magnet • 3=Double Jump — during a run",90,H-52);
  }

  // ── Character draw functions ──────────────────────────────────────────────────
  function drawFrog(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;

    const bodyGrad=ctx.createLinearGradient(px,py,px+pw,py+ph);
    bodyGrad.addColorStop(0,lighten(body,20)); bodyGrad.addColorStop(1,body);
    ctx.fillStyle=bodyGrad; drawRoundRect(px,py,pw,ph,16); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.70,pw*0.32,ph*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.lineWidth=2;
    if (!ducking) {
      for (const ex of [-1,1]) {
        const ox=cx+ex*pw*0.22, oy=py-ph*0.07;
        ctx.fillStyle="#78eb91"; ctx.beginPath(); ctx.arc(ox,oy,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
        drawEye(ox,oy,6);
      }
    } else {
      for (const ex of [-1,1]) {

        ctx.fillStyle="#78eb91"; ctx.beginPath(); ctx.arc(ox,oy,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
        drawEye(ox,oy,4);

    ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx,py+ph*0.58,pw*0.18,0.1,Math.PI-0.1); ctx.stroke();
  }

    ctx.fillStyle=lighten(body,8); ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(hcx,hcy,pw*0.28,ph*0.13,0.15,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.22,hcy+ph*0.04,pw*0.16,ph*0.09,0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#8b6040"; ctx.beginPath(); ctx.arc(hcx+pw*0.28,hcy+ph*0.02,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(hcx+pw*0.28,hcy+ph*0.07,3,0,Math.PI*2); ctx.fill();
    for (const ex of [-1,1]) { ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(hcx+ex*pw*0.24,hcy-ph*0.10,pw*0.09,ph*0.10,ex*0.3,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=belly; ctx.beginPath(); ctx.ellipse(hcx+ex*pw*0.24,hcy-ph*0.10,pw*0.05,ph*0.06,ex*0.3,0,Math.PI*2); ctx.fill(); }
    drawEye(hcx+pw*0.08,hcy-ph*0.03,5);
    const aw=Math.sin(tt*3)*0.04;
    ctx.strokeStyle=body; ctx.lineWidth=7;
    for (const ex of [-1,1]) {
      const ax=hcx+ex*pw*0.16, ay=hcy-ph*0.12;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+ex*pw*0.14,ay-ph*0.32+aw*ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax+ex*pw*0.06,ay-ph*0.14); ctx.lineTo(ax+ex*pw*0.20,ay-ph*0.18); ctx.stroke();
      const palmX=ax+ex*pw*0.14, palmY=ay-ph*0.32;
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.18,palmY+ph*0.04); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.16,palmY-ph*0.12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX+ex*pw*0.10,palmY-ph*0.06); ctx.lineTo(palmX+ex*pw*0.22,palmY-ph*0.10); ctx.stroke();
    }
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    for (const ex of [-1,1]) {
      const ax=hcx+ex*pw*0.16, ay=hcy-ph*0.12;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+ex*pw*0.14,ay-ph*0.32+aw*ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax+ex*pw*0.06,ay-ph*0.14); ctx.lineTo(ax+ex*pw*0.20,ay-ph*0.18); ctx.stroke();
      const palmX=ax+ex*pw*0.14, palmY=ay-ph*0.32;
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.18,palmY+ph*0.04); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.16,palmY-ph*0.12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX+ex*pw*0.10,palmY-ph*0.06); ctx.lineTo(palmX+ex*pw*0.22,palmY-ph*0.10); ctx.stroke();
    }
    ctx.fillStyle=belly; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.10,hcy+ph*0.12,pw*0.06,ph*0.08,0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="white"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(px+pw*0.92,py+ph*0.38,pw*0.06,ph*0.06,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  function drawBear(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    const bg=ctx.createRadialGradient(cx,py+ph*0.6,pw*0.1,cx,py+ph*0.6,pw*0.6); bg.addColorStop(0,lighten(body,15)); bg.addColorStop(1,body);
    ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(cx,py+ph*0.65,pw*0.50,ph*0.36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.70,pw*0.30,ph*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    const hcx=cx-pw*0.04, hcy=py+ph*0.18;
    ctx.fillStyle=lighten(body,12); ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.38,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.12,hcy+ph*0.10,pw*0.20,ph*0.13,0.1,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#331111";
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.16,hcy+ph*0.07,pw*0.08,ph*0.05,0,0,Math.PI*2); ctx.fill();
    for (const ex of [-1,1]) { ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(hcx+ex*pw*0.32,hcy-ph*0.22,pw*0.13,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=belly; ctx.beginPath(); ctx.arc(hcx+ex*pw*0.32,hcy-ph*0.22,pw*0.07,0,Math.PI*2); ctx.fill(); }
    drawEye(hcx-pw*0.14,hcy-ph*0.04,6); drawEye(hcx+pw*0.10,hcy-ph*0.04,6);
    const armSwing=Math.sin(tt*7)*0.25;
    ctx.strokeStyle=body; ctx.lineWidth=12;
    ctx.beginPath(); ctx.moveTo(px+pw*0.15,py+ph*0.55); ctx.lineTo(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw*0.15,py+ph*0.55); ctx.lineTo(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15); ctx.stroke();
    ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15,pw*0.10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    for (let c=-1;c<=1;c++) { ctx.beginPath(); ctx.moveTo(px-pw*0.12+c*pw*0.06,py+ph*0.72+armSwing*ph*0.15+pw*0.08); ctx.lineTo(px-pw*0.12+c*pw*0.08,py+ph*0.72+armSwing*ph*0.15+pw*0.14); ctx.stroke(); }
    ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px+pw*0.90,py+ph*0.46,pw*0.07,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  // ── Color helper ──────────────────────────────────────────────────────────────
  function lighten(hex, amt) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
  }

  const CHAR_DRAW={frog:drawFrog,dog:drawDog,cat:drawCat,monkey:drawMonkey,capybara:drawCapybara,hippo:drawHippo,elephant:drawElephant,puffin:drawPuffin,axolotl:drawAxolotl,pig:drawPig,moose:drawMoose,bear:drawBear};

  // ── Player draw ───────────────────────────────────────────────────────────────
  function drawPlayer(now) {
    const ck=save.character, skin=activeSkin(ck);
    const isLeg=skin.legendary;
    const stretch=player.ducking?0:clamp(Math.abs(player.vy)/1200,0,1);
    let sx,sy;
    if (player.ducking) { sx=1.30; sy=DUCK_H_RATIO; }
    else if (!player.on) { sx=1-0.10*stretch; sy=1+0.20*stretch; }
    else { const bob=Math.sin(player.tt*18)*0.02; sx=1+bob; sy=1-bob; }

    const pw=player.w*sx, ph=player.h*sy;
    const px=player.x+(player.w-pw)/2;
    const py=(player.y+player.h)-ph;

    if (isLeg) {
      drawLegendaryGlow(px,py,pw,ph,skin.body,now);
      spawnLegendaryParticles(px,py,pw,ph,skin.belly);
    }

    if (player.shieldT>0) {
      ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle="#78beff";
      ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+player.h/2,player.w*0.82,player.h*0.82,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.strokeStyle="#3c78dc"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+player.h/2,player.w*0.82,player.h*0.82,0,0,Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle="rgba(0,0,0,0.12)";
    ctx.beginPath(); ctx.ellipse(player.x+player.w/2,GROUND_Y+14,player.w*0.70,7,0,0,Math.PI*2); ctx.fill();

    CHAR_DRAW[ck]?.(px,py,pw,ph,skin.body,skin.belly,player.tt,player.ducking,now);

    if (player.magnetT>0) {
      ctx.fillStyle="#ff5a5a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(px+pw*0.18,py+ph*0.10,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    if (player.charging&&player.chargeT>0) {
      const ratio=clamp(player.chargeT/CHARGE_TIME,0,1);
      const bx=px-4, by=py-18, bw=pw+8, bh=8;
      ctx.fillStyle="rgba(0,0,0,0.18)"; drawRoundRect(bx,by,bw,bh,4); ctx.fill();
      ctx.fillStyle=`hsl(${Math.round(110-ratio*80)},90%,48%)`; drawRoundRect(bx,by,bw*ratio,bh,4); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=1.5; drawRoundRect(bx,by,bw,bh,4); ctx.stroke();
    }
  }

  // ── Obstacle draw ─────────────────────────────────────────────────────────────
  function drawObstacle(o, now) {
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    const {x,y,w,h,kind,phase}=o;

    if (kind==="snake") {
      const t=now/1000, cx=x+w*0.5;
      const scaleBody="#3cb83c", scaleBelly="#c8f0a8", scalePattern="#2a9a2a";
      ctx.save();
      ctx.fillStyle=scaleBody; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(cx-w*0.06,y+h-h*0.28,w*0.42,h*0.28,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=scaleBelly;
      ctx.beginPath(); ctx.ellipse(cx-w*0.06,y+h-h*0.22,w*0.24,h*0.14,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=scalePattern;
      for (let si=0;si<3;si++) { const sx=cx-w*0.28+si*w*0.22, sy=y+h-h*0.30; ctx.beginPath(); ctx.moveTo(sx,sy-h*0.08); ctx.lineTo(sx+w*0.08,sy); ctx.lineTo(sx,sy+h*0.08); ctx.lineTo(sx-w*0.08,sy); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle=scaleBody; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(cx+w*0.08,y+h-h*0.60,w*0.28,h*0.20,0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=scaleBelly; ctx.beginPath(); ctx.ellipse(cx+w*0.08,y+h-h*0.56,w*0.14,h*0.10,0.2,0,Math.PI*2); ctx.fill();
      const headAngle=-0.55, headBaseX=cx+w*0.28, headBaseY=y+h-h*0.72;
      ctx.save(); ctx.translate(headBaseX,headBaseY); ctx.rotate(headAngle);
      ctx.fillStyle=scaleBody; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(w*0.10,0,w*0.20,h*0.14,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=scaleBody; ctx.beginPath(); ctx.moveTo(w*0.26,-h*0.06); ctx.lineTo(w*0.34,0); ctx.lineTo(w*0.26,h*0.06); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle=scalePattern; ctx.beginPath(); ctx.ellipse(w*0.10,-h*0.06,w*0.10,h*0.04,0,0,Math.PI*2); ctx.fill();
      const ex=w*0.18, ey=-h*0.04;
      ctx.fillStyle="#ffee00"; ctx.beginPath(); ctx.arc(ex,ey,h*0.055,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#111"; ctx.beginPath(); ctx.ellipse(ex,ey,h*0.018,h*0.048,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(ex,ey,h*0.055,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle="#1a5a1a"; ctx.beginPath(); ctx.arc(w*0.28,-h*0.03,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w*0.28,h*0.03,2,0,Math.PI*2); ctx.fill();
      if (Math.sin(t*9+phase)>0) { ctx.strokeStyle="#ff1144"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(w*0.32,0); ctx.lineTo(w*0.46,0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w*0.46,0); ctx.lineTo(w*0.54,-h*0.06); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w*0.46,0); ctx.lineTo(w*0.54,h*0.06); ctx.stroke(); }
      ctx.restore(); ctx.restore();

    } else if (kind==="cactus") {
      const cx2=x+w/2, baseY=y+h;
      ctx.fillStyle="#2d8a3e"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      // Main trunk
      drawRoundRect(cx2-w*0.18,y,w*0.36,h,8); ctx.fill(); ctx.stroke();
      // Left arm
      drawRoundRect(cx2-w*0.50,y+h*0.20,w*0.36,h*0.28,6); ctx.fill(); ctx.stroke();
      drawRoundRect(cx2-w*0.50,y+h*0.10,w*0.14,h*0.22,5); ctx.fill(); ctx.stroke();
      // Right arm
      drawRoundRect(cx2+w*0.14,y+h*0.30,w*0.36,h*0.28,6); ctx.fill(); ctx.stroke();
      drawRoundRect(cx2+w*0.36,y+h*0.18,w*0.14,h*0.22,5); ctx.fill(); ctx.stroke();
      // Highlight stripe
      ctx.fillStyle="#3dab52"; ctx.beginPath(); ctx.ellipse(cx2,y+h*0.5,w*0.06,h*0.38,0,0,Math.PI*2); ctx.fill();
      // Spines
      ctx.strokeStyle=INK; ctx.lineWidth=1.5;
      for (const [sx,sy] of [[cx2-w*0.22,y+h*0.25],[cx2+w*0.22,y+h*0.35],[cx2,y+h*0.12],[cx2-w*0.46,y+h*0.15],[cx2+w*0.46,y+h*0.22]]) {
        ctx.beginPath(); ctx.moveTo(sx-5,sy); ctx.lineTo(sx-10,sy-4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx-5,sy); ctx.lineTo(sx-10,sy+4); ctx.stroke();
      }

    } else if (kind==="rock") {
      const cx2=x+w/2;
      // Shadow
      ctx.fillStyle="rgba(0,0,0,0.15)"; ctx.beginPath(); ctx.ellipse(cx2,y+h+6,w*0.55,6,0,0,Math.PI*2); ctx.fill();
      // Main rock body
      const rockGrad=ctx.createRadialGradient(cx2-w*0.1,y+h*0.35,w*0.05,cx2,y+h*0.55,w*0.55);
      rockGrad.addColorStop(0,"#c0b8a8"); rockGrad.addColorStop(0.6,"#9a9080"); rockGrad.addColorStop(1,"#6a6258");
      ctx.fillStyle=rockGrad; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(cx2-w*0.35,y+h); ctx.lineTo(cx2-w*0.48,y+h*0.60); ctx.quadraticCurveTo(cx2-w*0.44,y+h*0.12,cx2,y); ctx.quadraticCurveTo(cx2+w*0.38,y+h*0.10,cx2+w*0.50,y+h*0.55); ctx.lineTo(cx2+w*0.38,y+h); ctx.closePath(); ctx.fill(); ctx.stroke();
      // Rock cracks
      ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(cx2-w*0.10,y+h*0.30); ctx.lineTo(cx2+w*0.08,y+h*0.55); ctx.lineTo(cx2+w*0.20,y+h*0.50); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx2-w*0.20,y+h*0.60); ctx.lineTo(cx2-w*0.08,y+h*0.75); ctx.stroke();
      // Highlight
      ctx.fillStyle="rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.ellipse(cx2-w*0.10,y+h*0.32,w*0.14,h*0.14,0,0,Math.PI*2); ctx.fill();

    } else if (kind==="log") {
      const cx2=x+w/2;
      // Log shadow
      ctx.fillStyle="rgba(0,0,0,0.15)"; ctx.beginPath(); ctx.ellipse(cx2,y+h+6,w*0.55,6,0,0,Math.PI*2); ctx.fill();
      // Log body
      const logGrad=ctx.createLinearGradient(x,y,x+w,y+h);
      logGrad.addColorStop(0,"#c8924a"); logGrad.addColorStop(0.5,"#a06830"); logGrad.addColorStop(1,"#7a4e20");
      ctx.fillStyle=logGrad; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      drawRoundRect(x,y+h*0.20,w,h*0.65,h*0.28); ctx.fill(); ctx.stroke();
      // End caps
      ctx.fillStyle="#c8924a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(x+w*0.08,y+h*0.52,w*0.09,h*0.28,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x+w*0.92,y+h*0.52,w*0.09,h*0.28,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // Tree rings on left cap
      for (let r=1;r<=3;r++) { ctx.strokeStyle=`rgba(100,60,20,${0.3-r*0.05})`; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(x+w*0.08,y+h*0.52,w*0.03*r,h*0.10*r,0,0,Math.PI*2); ctx.stroke(); }
      // Bark lines
      ctx.strokeStyle="rgba(0,0,0,0.20)"; ctx.lineWidth=1.5;
      for (let i=1;i<=3;i++) { ctx.beginPath(); ctx.moveTo(x+w*0.22+i*w*0.14,y+h*0.22); ctx.quadraticCurveTo(x+w*0.22+i*w*0.14+8,y+h*0.52,x+w*0.22+i*w*0.14,y+h*0.82); ctx.stroke(); }
      // Mossy top
      ctx.fillStyle="rgba(80,160,60,0.35)"; ctx.beginPath(); ctx.ellipse(cx2,y+h*0.24,w*0.42,h*0.12,0,0,Math.PI*2); ctx.fill();

    } else if (kind==="bird") {
      const wb=Math.sin((now/1000)*7+phase)*18;
      const cx2=x+w/2, cy2=y+h/2, ws=w*0.75;
      ctx.save(); ctx.setLineDash([10,8]);
      ctx.strokeStyle="rgba(80,180,255,0.45)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-10,BIRD_GAP_BOTTOM); ctx.lineTo(x+w+10,BIRD_GAP_BOTTOM); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      ctx.fillStyle="#ffbe46"; ctx.strokeStyle=INK; ctx.lineWidth=3;
      for (const ex of [-1,1]) {
        ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.quadraticCurveTo(cx2+ex*ws*0.6,cy2-28+wb,cx2+ex*ws,cy2+wb); ctx.quadraticCurveTo(cx2+ex*ws*0.5,cy2+10+wb*0.3,cx2,cy2); ctx.fill(); ctx.stroke();
      }
      const bg=ctx.createRadialGradient(cx2,cy2,w*0.05,cx2,cy2,w*0.35); bg.addColorStop(0,"#ff9955"); bg.addColorStop(1,"#ff7a3c");
      ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(cx2,cy2,w*0.32,h*0.44,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="#ffd5a0"; ctx.beginPath(); ctx.ellipse(cx2,cy2+h*0.10,w*0.18,h*0.26,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ffbe46"; ctx.beginPath(); ctx.moveTo(cx2+w*0.28,cy2-4); ctx.lineTo(cx2+w*0.44,cy2); ctx.lineTo(cx2+w*0.28,cy2+6); ctx.closePath(); ctx.fill(); ctx.stroke();
      drawEye(cx2+w*0.14,cy2-h*0.12,6);
      ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      for (const fx of [cx2-w*0.10,cx2+w*0.10]) { ctx.beginPath(); ctx.moveTo(fx,cy2+h*0.44); ctx.lineTo(fx,cy2+h*0.44+14); ctx.stroke(); for (const dx of [-8,0,8]) { ctx.beginPath(); ctx.moveTo(fx,cy2+h*0.44+14); ctx.lineTo(fx+dx,cy2+h*0.44+22); ctx.stroke(); } }

    } else if (kind==="eagle") {
      // Large brown eagle, soars with wide wings
      const soar=Math.sin((now/1000)*5+phase)*12;
      const cx2=x+w/2, cy2=y+h/2, ws=w*0.90;
      ctx.save(); ctx.setLineDash([10,8]);
      ctx.strokeStyle="rgba(80,180,255,0.35)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-10,BIRD_GAP_BOTTOM); ctx.lineTo(x+w+10,BIRD_GAP_BOTTOM); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      // Wide wings — flat soaring shape
      ctx.fillStyle="#8b5e2a"; ctx.strokeStyle=INK; ctx.lineWidth=3;
      for (const ex of [-1,1]) {
        ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.quadraticCurveTo(cx2+ex*ws*0.5,cy2-20+soar,cx2+ex*ws,cy2-6+soar); ctx.quadraticCurveTo(cx2+ex*ws*0.4,cy2+14,cx2,cy2+8); ctx.fill(); ctx.stroke();
        // Wing feather tip details
        ctx.strokeStyle="#5a3a10"; ctx.lineWidth=1.5;
        for (let f=0;f<3;f++) { const fx=cx2+ex*ws*(0.65+f*0.10), fy=cy2-4+soar+f*3; ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+ex*8,fy+8); ctx.stroke(); }
        ctx.strokeStyle=INK; ctx.lineWidth=3;
      }
      // Body
      const bg2=ctx.createRadialGradient(cx2,cy2,w*0.05,cx2,cy2,w*0.30); bg2.addColorStop(0,"#c09050"); bg2.addColorStop(1,"#6a3a10");
      ctx.fillStyle=bg2; ctx.beginPath(); ctx.ellipse(cx2,cy2,w*0.28,h*0.42,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // White head (bald eagle style)
      ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(cx2+w*0.02,cy2-h*0.30,h*0.22,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // Yellow hooked beak
      ctx.fillStyle="#ffcc00"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx2+w*0.20,cy2-h*0.34); ctx.lineTo(cx2+w*0.38,cy2-h*0.26); ctx.lineTo(cx2+w*0.16,cy2-h*0.20); ctx.closePath(); ctx.fill(); ctx.stroke();
      drawEye(cx2+w*0.14,cy2-h*0.34,5,"#553300");
      // Tail feathers
      ctx.fillStyle="#6a3a10"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx2-w*0.18,cy2+h*0.28); ctx.lineTo(cx2-w*0.38,cy2+h*0.50); ctx.lineTo(cx2+w*0.08,cy2+h*0.38); ctx.closePath(); ctx.fill(); ctx.stroke();

    } else if (kind==="bat") {
      // Dark bat, flaps fast, slightly different height
      const flap=Math.sin((now/1000)*14+phase)*22;
      const cx2=x+w/2, cy2=y+h/2, ws=w*0.85;
      ctx.save(); ctx.setLineDash([10,8]);
      ctx.strokeStyle="rgba(80,80,255,0.35)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-10,BIRD_GAP_BOTTOM); ctx.lineTo(x+w+10,BIRD_GAP_BOTTOM); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      // Leathery wings
      ctx.fillStyle="#331155"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      for (const ex of [-1,1]) {
        ctx.beginPath();
        ctx.moveTo(cx2,cy2+4);
        ctx.quadraticCurveTo(cx2+ex*ws*0.4,cy2-20+flap,cx2+ex*ws,cy2-8+flap);
        ctx.quadraticCurveTo(cx2+ex*ws*0.7,cy2+10,cx2+ex*ws*0.4,cy2+h*0.30);
        ctx.quadraticCurveTo(cx2+ex*ws*0.2,cy2+h*0.18,cx2,cy2+4);
        ctx.fill(); ctx.stroke();
        // Wing membrane veins
        ctx.strokeStyle="rgba(100,60,180,0.5)"; ctx.lineWidth=1;
        for (let v=1;v<=2;v++) { ctx.beginPath(); ctx.moveTo(cx2+ex*w*0.08,cy2+4); ctx.quadraticCurveTo(cx2+ex*ws*(0.25*v),cy2-10+flap*0.6,cx2+ex*ws*(0.35*v),cy2-4+flap); ctx.stroke(); }
        ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      }
      // Round dark body
      ctx.fillStyle="#221133"; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.ellipse(cx2,cy2,w*0.22,h*0.36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // Ears
      ctx.fillStyle="#442266"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      for (const ex of [-1,1]) {
        ctx.beginPath(); ctx.moveTo(cx2+ex*w*0.10,cy2-h*0.28); ctx.lineTo(cx2+ex*w*0.20,cy2-h*0.55); ctx.lineTo(cx2+ex*w*0.05,cy2-h*0.30); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      // Glowing red eyes
      ctx.fillStyle="#ff2200"; ctx.shadowColor="#ff0000"; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(cx2-w*0.09,cy2-h*0.10,4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx2+w*0.09,cy2-h*0.10,4,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      // Fangs
      ctx.fillStyle="white"; ctx.strokeStyle=INK; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cx2-w*0.06,cy2+h*0.06); ctx.lineTo(cx2-w*0.03,cy2+h*0.16); ctx.lineTo(cx2,cy2+h*0.06); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx2+w*0.01,cy2+h*0.06); ctx.lineTo(cx2+w*0.05,cy2+h*0.16); ctx.lineTo(cx2+w*0.09,cy2+h*0.06); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // ── Main draw ─────────────────────────────────────────────────────────────────
  function draw(now) {
    if (state==="shop") { drawShop(); return; }

    drawSky(now); clouds.forEach(drawCloud);

    ctx.fillStyle=GROUND_COL; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    ctx.fillStyle=GROUND_DARK; ctx.fillRect(0,GROUND_Y,W,8);
    // Ground dots
    const dotOff=(dist*0.6)%40;
    ctx.fillStyle="#5acb66";
    for (let xd=-40;xd<W+40;xd+=40) { ctx.beginPath(); ctx.arc(xd-dotOff,GROUND_Y+40,4,0,Math.PI*2); ctx.fill(); }

    // Coins
    for (const c of coinList) {
      const alpha=c.got?Math.max(0,1-c.popT/COIN_POP_DUR):1;
      if (alpha<=0) continue;
      const scale=c.got?1+c.popT/COIN_POP_DUR*0.6:1;
      const spin=0.35+0.65*Math.abs(Math.sin((now/1000)*8+c.x*0.01));
      ctx.save(); ctx.globalAlpha=alpha; ctx.translate(c.x,c.y); ctx.scale(scale,scale);
      const cg=ctx.createRadialGradient(0,-c.r*0.3,1,0,0,c.r*spin);
      cg.addColorStop(0,"#fff5aa"); cg.addColorStop(0.5,"#ffdc5a"); cg.addColorStop(1,"#cc9900");
      ctx.fillStyle=cg; ctx.strokeStyle=INK; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(0,0,c.r*spin,c.r,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-c.r+4); ctx.lineTo(0,c.r-4); ctx.stroke();
      ctx.restore();
    }

    // Power orbs
    const orbColors={shield:"#78beff",magnet:"#ff5a5a",double:"#af78ff"};
    for (const o of orbList) {
      if (o.got) continue;
      const c=orbColors[o.kind];
      const pulse=0.8+0.2*Math.sin(now/300+o.x);
      ctx.save(); ctx.globalAlpha=0.30*pulse; ctx.fillStyle=c; ctx.beginPath(); ctx.arc(o.x,o.y,o.r*2.2,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.fillStyle=c; ctx.strokeStyle=INK; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="white";
      if (o.kind==="shield") { ctx.beginPath(); ctx.arc(o.x,o.y,6,0,Math.PI*2); ctx.fill(); }
      else if (o.kind==="magnet") { drawRoundRect(o.x-6,o.y-6,12,12,3); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(o.x-6,o.y+5); ctx.lineTo(o.x,o.y-7); ctx.lineTo(o.x+6,o.y+5); ctx.closePath(); ctx.fill(); }
    }

    for (const o of obstacles) drawObstacle(o, now);
    drawParticles();
    drawPlayer(now);

    // Phase indicator (subtle)
    if (state==="play") {
      const phaseLabel=runTime<PHASE1_END?"Easy":runTime<PHASE2_END?"Medium":runTime<PHASE3_END?"Hard":"Max";
      const phaseColor=runTime<PHASE1_END?"#44aa44":runTime<PHASE2_END?"#aaaa22":runTime<PHASE3_END?"#cc7722":"#cc2222";
      ctx.fillStyle=phaseColor; ctx.font="bold 13px system-ui"; ctx.globalAlpha=0.7;
      ctx.fillText(phaseLabel,W-70,H-10); ctx.globalAlpha=1;
    }

    if (state==="start") {
      ctx.fillStyle="rgba(255,255,255,0.86)"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=INK; ctx.font="58px system-ui";
      ctx.fillText(`${CHARACTERS[save.character].label} Runner`,(W-ctx.measureText(`${CHARACTERS[save.character].label} Runner`).width)/2,218);
      ctx.font="22px system-ui"; ctx.fillText("Hold Space/↑ = charge jump  •  Hold ↓/S = duck",(W-ctx.measureText("Hold Space/↑ = charge jump  •  Hold ↓/S = duck").width)/2,264);
      ctx.font="18px system-ui"; ctx.fillText("Jump over snakes/rocks/cacti/logs  •  Duck under birds/eagles/bats",(W-ctx.measureText("Jump over snakes/rocks/cacti/logs  •  Duck under birds/eagles/bats").width)/2,298);
      ctx.fillText("S = Shop  •  Earn coins to unlock characters & legendary skins ✨",(W-ctx.measureText("S = Shop  •  Earn coins to unlock characters & legendary skins ✨").width)/2,326);
    }
    if (state==="over") {
      ctx.fillStyle="rgba(255,255,255,0.86)"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=INK; ctx.font="58px system-ui"; ctx.fillText("GAME OVER",(W-ctx.measureText("GAME OVER").width)/2,218);
      ctx.font="26px system-ui"; ctx.fillText(`Score: ${score}  •  Best: ${save.best}  •  Coins earned: ${coinsRun}`,(W-ctx.measureText(`Score: ${score}  •  Best: ${save.best}  •  Coins earned: ${coinsRun}`).width)/2,274);
      ctx.font="20px system-ui"; ctx.fillText("Space/R to restart  •  S = Shop",(W-ctx.measureText("Space/R to restart  •  S = Shop").width)/2,310);
    }
  }

  // ── Update loop ───────────────────────────────────────────────────────────────
  let last=performance.now();
  function loop(now) {
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    for (const cl of clouds) { cl.x-=cl.v*dt; if(cl.x<-260) Object.assign(cl,randomCloud()); }

    if (state==="play") {
      runTime+=dt; player.tt+=dt;
      player.shieldT=Math.max(0,player.shieldT-dt);
      player.magnetT=Math.max(0,player.magnetT-dt);
      player.doubleT=Math.max(0,player.doubleT-dt);
      if(player.doubleT===0) player.doubleUsed=false;
      player.coyoteT=Math.max(0,player.coyoteT-dt);

      if(player.charging&&player.on) player.chargeT=Math.min(CHARGE_TIME,player.chargeT+dt);
      if(player.charging&&!player.on&&player.coyoteT<=0) jumpReleased();

      speed=speedForTime(runTime); dist+=speed*dt; score=Math.floor(dist/12);

      // Switch music track based on phase
      const track=getMusicTrack();
      if (!muted&&track!==lastMusicTrack) { lastMusicTrack=track; musicTrack=null; playMusic(track); }

      const baseG=assist?GRAVITY_ASS:GRAVITY_NORM;
      const gm=(player.jumpHeld&&!player.charging&&player.vy<0)?JUMP_HOLD_GRAV_MULT:1.0;
      player.vy+=baseG*gm*dt; player.y+=player.vy*dt;

      if(player.y+player.h>=GROUND_Y){player.y=GROUND_Y-player.h;player.vy=0;player.on=true;}
      else player.on=false;
      if(player.on){player.coyoteT=COYOTE_TIME;player.doubleUsed=false;}
      if(!player.on) player.ducking=false;
      if(player.on&&!duckHeld) player.ducking=false;

      if(assist&&!assistShieldGiven&&runTime>=ASSIST_SHIELD_TIME&&player.shieldT<=0) {
        orbList.push({x:W+260,y:Math.max(120,GROUND_Y-150),r:14,kind:"shield",got:false});
        assistShieldGiven=true;
      }

      if(nextSpawn<W+60) spawnPack();
      nextSpawn-=speed*dt;
      for(const o of obstacles) o.x-=speed*dt;
      for(const c of coinList) c.x-=speed*dt;
      for(const o of orbList) o.x-=speed*dt;
      for(const c of coinList) if(c.got) c.popT+=dt;
      obstacles=obstacles.filter(o=>o.x+o.w>-20);
      coinList=coinList.filter(c=>c.x+c.r>-20&&(!c.got||c.popT<COIN_POP_DUR));
      orbList=orbList.filter(o=>o.x+o.r>-20&&!o.got);

      updateParticles(dt);

      if(player.magnetT>0) {
        const mx=player.x+player.w/2, my=player.y+player.h/2;
        for(const c of coinList){if(c.got)continue;const dx=mx-c.x,dy=my-c.y;if(Math.hypot(dx,dy)<170){c.x+=dx*dt*3.3;c.y+=dy*dt*3.3;}}
      }

      const pr={x:player.x,y:player.ducking?player.y+player.h*(1-DUCK_H_RATIO):player.y,w:player.w,h:player.ducking?player.h*DUCK_H_RATIO:player.h};

      for(const c of coinList){if(c.got)continue;if(rects(pr,{x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2})){c.got=true;coinsRun++;save.wallet++;persist();beep(880,0.05,0.05);}}
      for(const o of orbList){if(o.got)continue;if(rects(pr,{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})){o.got=true;if(o.kind==="shield")player.shieldT=POWER_DUR.shield;if(o.kind==="magnet")player.magnetT=POWER_DUR.magnet;if(o.kind==="double")player.doubleT=POWER_DUR.double;beep(660,0.05,0.05);beep(880,0.05,0.05);}}

      let dead=false;
      for(const o of obstacles){
        if(!rects(pr,o)) continue;
        if(player.shieldT>0){player.shieldT=0;o.x-=player.w+20;beep(220,0.05,0.06);beep(440,0.05,0.04);break;}
        dead=true; beep(120,0.12,0.08); break;
      }
      if(dead){save.best=Math.max(save.best,score);persist();state="over";stopMusic();playMusic("start");}
    }

    hudScore.textContent=`Score: ${score}`;
    hudCoins.textContent=`Coins: ${coinsRun}`;
    hudWallet.textContent=`Wallet: ${save.wallet}`;
    hudChar.textContent=`${CHARACTERS[save.character].label} · ${activeSkin(save.character).label}`;
    const powers=[];
    if(player.shieldT>0) powers.push(`Shield ${player.shieldT.toFixed(1)}s`);
    if(player.magnetT>0) powers.push(`Magnet ${player.magnetT.toFixed(1)}s`);
    if(player.doubleT>0) powers.push(`Double ${player.doubleT.toFixed(1)}s`);
    hudPowers.textContent=`Powers: ${powers.length?powers.join(" • "):"none"}`;

    draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
