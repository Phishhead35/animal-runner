      ctx.fillStyle=belly; ctx.beginPath(); ctx.arc(hcx+ex*pw*0.32,hcy-ph*0.22,pw*0.07,0,Math.PI*2); ctx.fill();
    }
    drawEye(hcx-pw*0.14,hcy-ph*0.04,6);
    drawEye(hcx+pw*0.10,hcy-ph*0.04,6);
    // Lumbering arm forward while running
    const armSwing=Math.sin(tt*7)*0.25;
    ctx.strokeStyle=body; ctx.lineWidth=12;
    ctx.beginPath(); ctx.moveTo(px+pw*0.15,py+ph*0.55); ctx.lineTo(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw*0.15,py+ph*0.55); ctx.lineTo(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15); ctx.stroke();
    // Paw
    ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15,pw*0.10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Claws
    ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    for (let c=-1;c<=1;c++) {
      ctx.beginPath(); ctx.moveTo(px-pw*0.12+c*pw*0.06,py+ph*0.72+armSwing*ph*0.15+pw*0.08);
      ctx.lineTo(px-pw*0.12+c*pw*0.08,py+ph*0.72+armSwing*ph*0.15+pw*0.14); ctx.stroke();
    }
    // Stubby tail
    ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px+pw*0.90,py+ph*0.46,pw*0.07,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  const CHAR_DRAW = { frog:drawFrog, dog:drawDog, cat:drawCat, monkey:drawMonkey, capybara:drawCapybara, hippo:drawHippo, elephant:drawElephant, puffin:drawPuffin, axolotl:drawAxolotl, pig:drawPig, moose:drawMoose, bear:drawBear };

  // ── Player draw ───────────────────────────────────────────────────────────────
  function drawPlayer(now) {
    const ck=save.character, skin=activeSkin(ck);
    const stretch=player.ducking?0:clamp(Math.abs(player.vy)/1200,0,1);
    let sx,sy;
    if (player.ducking)  { sx=1.30; sy=DUCK_H_RATIO; }
    else if (!player.on) { sx=1-0.10*stretch; sy=1+0.20*stretch; }
    else { const bob=Math.sin(player.tt*18)*0.02; sx=1+bob; sy=1-bob; }

    const pw=player.w*sx, ph=player.h*sy;
    const px=player.x+(player.w-pw)/2;
    const py=(player.y+player.h)-ph;

    // Shield bubble
    if (player.shieldT>0) {
      ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle="#78beff";
      ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+player.h/2,player.w*0.82,player.h*0.82,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.strokeStyle="#3c78dc"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+player.h/2,player.w*0.82,player.h*0.82,0,0,Math.PI*2); ctx.stroke();
    }
    // Shadow
    ctx.fillStyle="rgba(0,0,0,0.12)";
    ctx.beginPath(); ctx.ellipse(player.x+player.w/2,GROUND_Y+14,player.w*0.70,7,0,0,Math.PI*2); ctx.fill();

    CHAR_DRAW[ck]?.(px,py,pw,ph,skin.body,skin.belly,player.tt,player.ducking,now);

    // Magnet pip
    if (player.magnetT>0) {
      ctx.fillStyle="#ff5a5a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(px+pw*0.18,py+ph*0.10,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    // Charge bar
    if (player.charging&&player.chargeT>0) {
      const ratio=clamp(player.chargeT/CHARGE_TIME,0,1);
      const bx=px-4, by=py-18, bw=pw+8, bh=8;
      ctx.fillStyle="rgba(0,0,0,0.18)"; drawRoundRect(bx,by,bw,bh,4); ctx.fill();
      ctx.fillStyle=`hsl(${Math.round(110-ratio*80)},90%,48%)`; drawRoundRect(bx,by,bw*ratio,bh,4); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=1.5; drawRoundRect(bx,by,bw,bh,4); ctx.stroke();
    }
  }

  // ── Main draw ─────────────────────────────────────────────────────────────────
  function draw(now) {
    if (state==="shop") { drawShop(); return; }

    drawSky(); clouds.forEach(drawCloud);

    ctx.fillStyle=GROUND_COL; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    ctx.fillStyle=GROUND_DARK; ctx.fillRect(0,GROUND_Y,W,8);
    const dotOff=(dist*0.6)%40;
    ctx.fillStyle="#5acb66";
    for (let x=-40;x<W+40;x+=40) { ctx.beginPath(); ctx.arc(x-dotOff,GROUND_Y+40,4,0,Math.PI*2); ctx.fill(); }

    // Coins
    for (const c of coinList) {
      const alpha=c.got?Math.max(0,1-c.popT/COIN_POP_DUR):1;
      if (alpha<=0) continue;
      const scale=c.got?1+c.popT/COIN_POP_DUR*0.6:1;
      const spin=0.35+0.65*Math.abs(Math.sin((now/1000)*8+c.x*0.01));
      ctx.save(); ctx.globalAlpha=alpha; ctx.translate(c.x,c.y); ctx.scale(scale,scale);
      ctx.fillStyle="#ffdc5a"; ctx.strokeStyle=INK; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(0,0,c.r*spin,c.r,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-c.r+4); ctx.lineTo(0,c.r-4); ctx.stroke();
      ctx.restore();
    }

    // Power orbs
    const orbColors={shield:"#78beff",magnet:"#ff5a5a",double:"#af78ff"};
    for (const o of orbList) {
      if (o.got) continue;
      const c=orbColors[o.kind];
      ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle=c; ctx.beginPath(); ctx.arc(o.x,o.y,o.r*2,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.fillStyle=c; ctx.strokeStyle=INK; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="white";
      if (o.kind==="shield")      { ctx.beginPath(); ctx.arc(o.x,o.y,6,0,Math.PI*2); ctx.fill(); }
      else if (o.kind==="magnet") { drawRoundRect(o.x-6,o.y-6,12,12,3); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(o.x-6,o.y+5); ctx.lineTo(o.x,o.y-7); ctx.lineTo(o.x+6,o.y+5); ctx.closePath(); ctx.fill(); }
    }

    // Obstacles
    for (const o of obstacles) {
      ctx.strokeStyle=INK; ctx.lineWidth=3;
      if (o.kind==="snake") {
        // Draw a proper coiled snake with sinuous body, raised head, scales, tongue
        const t = now / 1000;
        const bx = o.x, by = o.y + o.h, bw = o.w, bh = o.h;
        const cx = bx + bw * 0.5;
        const scaleBody = "#3cb83c", scaleLight = "#55dd55", scaleBelly = "#c8f0a8", scalePattern = "#2a9a2a";

        // --- Coiled body: two overlapping sine-wave ovals sitting on the ground ---
        ctx.save();
        // Bottom coil (bigger)
        ctx.fillStyle = scaleBody; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx - bw*0.06, by - bh*0.28, bw*0.42, bh*0.28, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        // Belly highlight on bottom coil
        ctx.fillStyle = scaleBelly;
        ctx.beginPath();
        ctx.ellipse(cx - bw*0.06, by - bh*0.22, bw*0.24, bh*0.14, 0, 0, Math.PI*2);
        ctx.fill();
        // Scale pattern diamonds on body
        ctx.fillStyle = scalePattern;
        for (let si = 0; si < 3; si++) {
          const sx = cx - bw*0.28 + si*bw*0.22, sy = by - bh*0.30;
          ctx.beginPath();
          ctx.moveTo(sx, sy - bh*0.08); ctx.lineTo(sx + bw*0.08, sy);
          ctx.lineTo(sx, sy + bh*0.08); ctx.lineTo(sx - bw*0.08, sy);
          ctx.closePath(); ctx.fill();
        }
        // Top coil (smaller, sits on top of bottom)
        ctx.fillStyle = scaleBody; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx + bw*0.08, by - bh*0.60, bw*0.28, bh*0.20, 0.2, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = scaleBelly;
        ctx.beginPath();
        ctx.ellipse(cx + bw*0.08, by - bh*0.56, bw*0.14, bh*0.10, 0.2, 0, Math.PI*2);
        ctx.fill();

        // --- Raised head, angled up and to the right ---
        const headAngle = -0.55; // radians — head tilted up
        const headBaseX = cx + bw*0.28, headBaseY = by - bh*0.72;
        ctx.save();
        ctx.translate(headBaseX, headBaseY);
        ctx.rotate(headAngle);
        // Head shape: slightly flattened triangle-ish ellipse (viper style)
        ctx.fillStyle = scaleBody; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(bw*0.10, 0, bw*0.20, bh*0.14, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        // Snout tip slightly pointed
        ctx.fillStyle = scaleBody;
        ctx.beginPath();
        ctx.moveTo(bw*0.26, -bh*0.06); ctx.lineTo(bw*0.34, 0); ctx.lineTo(bw*0.26, bh*0.06);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Top-of-head scale ridge
        ctx.fillStyle = scalePattern;
        ctx.beginPath();
        ctx.ellipse(bw*0.10, -bh*0.06, bw*0.10, bh*0.04, 0, 0, Math.PI*2);
        ctx.fill();
        // Eye — slit pupil for menace
        const ex = bw*0.18, ey = -bh*0.04;
        ctx.fillStyle = "#ffee00"; ctx.beginPath(); ctx.arc(ex, ey, bh*0.055, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#111"; ctx.beginPath();
        ctx.ellipse(ex, ey, bh*0.018, bh*0.048, 0, 0, Math.PI*2); ctx.fill();
        // Eye outline
        ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(ex, ey, bh*0.055, 0, Math.PI*2); ctx.stroke();
        // Nostril dots
        ctx.fillStyle = "#1a5a1a";
        ctx.beginPath(); ctx.arc(bw*0.28, -bh*0.03, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(bw*0.28,  bh*0.03, 2, 0, Math.PI*2); ctx.fill();
        // Forked tongue — flickers via sine wave
        const tongueFlick = Math.sin(t * 9 + o.phase) > 0;
        if (tongueFlick) {
          ctx.strokeStyle = "#ff1144"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(bw*0.32, 0); ctx.lineTo(bw*0.46, 0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(bw*0.46, 0); ctx.lineTo(bw*0.54, -bh*0.06); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(bw*0.46, 0); ctx.lineTo(bw*0.54,  bh*0.06); ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
      } else {
        const wb=Math.sin((now/1000)*7+o.phase)*18;
        const cx=o.x+o.w/2, cy=o.y+o.h/2, ws=o.w*0.75;
        ctx.save(); ctx.setLineDash([10,8]);
        ctx.strokeStyle="rgba(80,180,255,0.45)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(o.x-10,BIRD_GAP_BOTTOM); ctx.lineTo(o.x+o.w+10,BIRD_GAP_BOTTOM); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
        ctx.fillStyle="#ffbe46"; ctx.strokeStyle=INK; ctx.lineWidth=3;
        for (const ex of [-1,1]) {
          ctx.beginPath(); ctx.moveTo(cx,cy);
          ctx.quadraticCurveTo(cx+ex*ws*0.6,cy-28+wb,cx+ex*ws,cy+wb);
          ctx.quadraticCurveTo(cx+ex*ws*0.5,cy+10+wb*0.3,cx,cy);
          ctx.fill(); ctx.stroke();
        }
        ctx.fillStyle="#ff7a3c"; ctx.beginPath(); ctx.ellipse(cx,cy,o.w*0.32,o.h*0.44,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle="#ffd5a0"; ctx.beginPath(); ctx.ellipse(cx,cy+o.h*0.10,o.w*0.18,o.h*0.26,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#ffbe46"; ctx.beginPath(); ctx.moveTo(cx+o.w*0.28,cy-4); ctx.lineTo(cx+o.w*0.44,cy); ctx.lineTo(cx+o.w*0.28,cy+6); ctx.closePath(); ctx.fill(); ctx.stroke();
        drawEye(cx+o.w*0.14,cy-o.h*0.12,6);
        ctx.strokeStyle=INK; ctx.lineWidth=2.5;
        for (const fx of [cx-o.w*0.10,cx+o.w*0.10]) {
          ctx.beginPath(); ctx.moveTo(fx,cy+o.h*0.44); ctx.lineTo(fx,cy+o.h*0.44+14); ctx.stroke();
          for (const dx of [-8,0,8]) { ctx.beginPath(); ctx.moveTo(fx,cy+o.h*0.44+14); ctx.lineTo(fx+dx,cy+o.h*0.44+22); ctx.stroke(); }
        }
      }
    }

    drawPlayer(now);

    if (state==="start") {
      drawCenteredPanel(`${CHARACTERS[save.character].label} Runner`,
        "Hold Space/↑ = charge jump  •  Hold ↓/S = duck",
        "Jump over snakes  •  Duck under birds  •  S = Shop");
    }
    if (state==="over") {
      drawCenteredPanel("GAME OVER",
        `Score: ${score}  •  Best: ${save.best}  •  Coins: ${coinsRun}`,
        "Space/R to restart  •  S = Shop");
    }
  }

  // ── Update loop ───────────────────────────────────────────────────────────────
  let last=performance.now();
  function loop(now) {
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    for (const cl of clouds) { cl.x-=cl.v*dt; if (cl.x<-260) Object.assign(cl,randomCloud()); }

    if (state==="play") {
      runTime+=dt; player.tt+=dt;
      player.shieldT=Math.max(0,player.shieldT-dt);
      player.magnetT=Math.max(0,player.magnetT-dt);
      player.doubleT=Math.max(0,player.doubleT-dt);
      if (player.doubleT===0) player.doubleUsed=false;
      player.coyoteT=Math.max(0,player.coyoteT-dt);

      if (player.charging&&player.on) player.chargeT=Math.min(CHARGE_TIME,player.chargeT+dt);
      if (player.charging&&!player.on&&player.coyoteT<=0) jumpReleased();

      speed=speedForTime(runTime); dist+=speed*dt; score=Math.floor(dist/12);

      const baseG=assist?GRAVITY_ASS:GRAVITY_NORM;
      const gm=(player.jumpHeld&&!player.charging&&player.vy<0)?JUMP_HOLD_GRAV_MULT:1.0;
      player.vy+=baseG*gm*dt; player.y+=player.vy*dt;

      if (player.y+player.h>=GROUND_Y) { player.y=GROUND_Y-player.h; player.vy=0; player.on=true; }
      else player.on=false;
      if (player.on) { player.coyoteT=COYOTE_TIME; player.doubleUsed=false; }
      if (!player.on) player.ducking=false;
      // Fix duck-stuck: if duck key is no longer held, always clear ducking on ground
      if (player.on && !duckHeld) player.ducking=false;

      if (assist&&!assistShieldGiven&&runTime>=ASSIST_SHIELD_TIME&&player.shieldT<=0) {
        orbList.push({x:W+260,y:Math.max(120,GROUND_Y-150),r:14,kind:"shield",got:false});
        assistShieldGiven=true;
      }

      if (nextSpawn<W+60) spawnPack();
      nextSpawn-=speed*dt;
      for (const o of obstacles) o.x-=speed*dt;
      for (const c of coinList)  c.x-=speed*dt;
      for (const o of orbList)   o.x-=speed*dt;
      for (const c of coinList) if (c.got) c.popT+=dt;
      obstacles=obstacles.filter(o=>o.x+o.w>-20);
      coinList =coinList.filter(c=>c.x+c.r>-20&&(!c.got||c.popT<COIN_POP_DUR));
      orbList  =orbList.filter(o=>o.x+o.r>-20&&!o.got);

      if (player.magnetT>0) {
        const mx=player.x+player.w/2, my=player.y+player.h/2;
        for (const c of coinList) {
          if (c.got) continue;
          const dx=mx-c.x, dy=my-c.y;
          if (Math.hypot(dx,dy)<170) { c.x+=dx*dt*3.3; c.y+=dy*dt*3.3; }
        }
      }

      const pr={
        x:player.x,
        y:player.ducking?player.y+player.h*(1-DUCK_H_RATIO):player.y,
        w:player.w,
        h:player.ducking?player.h*DUCK_H_RATIO:player.h,
      };

      for (const c of coinList) {
        if (c.got) continue;
        if (rects(pr,{x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2})) {
          c.got=true; coinsRun++; save.wallet++; persist(); beep(880,0.05,0.05);
        }
      }
      for (const o of orbList) {
        if (o.got) continue;
        if (rects(pr,{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})) {
          o.got=true;
          if (o.kind==="shield") player.shieldT=POWER_DUR.shield;
          if (o.kind==="magnet") player.magnetT=POWER_DUR.magnet;
          if (o.kind==="double") player.doubleT=POWER_DUR.double;
          beep(660,0.05,0.05); beep(880,0.05,0.05);
        }
      }

      let dead=false;
      for (const o of obstacles) {
        if (!rects(pr,o)) continue;
        if (player.shieldT > 0) {
          // Shield absorbs the hit — knock obstacle back so it can't immediately re-collide
          player.shieldT = 0;
          o.x -= player.w + 20; // push past the player
          beep(220, 0.05, 0.06); beep(440, 0.05, 0.04);
          break;
        }
        dead = true; beep(120, 0.12, 0.08); break;
      }
      if (dead) { save.best=Math.max(save.best,score); persist(); state="over"; stopMusic(); playMusic("start"); }
    }

    // HUD
    hudScore.textContent  = `Score: ${score}`;
    hudCoins.textContent  = `Coins: ${coinsRun}`;
    hudWallet.textContent = `Wallet: ${save.wallet}`;
    hudChar.textContent   = `${CHARACTERS[save.character].label} · ${activeSkin(save.character).label}`;
    const powers=[];
    if (player.shieldT>0) powers.push(`Shield ${player.shieldT.toFixed(1)}s`);
    if (player.magnetT>0) powers.push(`Magnet ${player.magnetT.toFixed(1)}s`);
    if (player.doubleT>0) powers.push(`Double ${player.doubleT.toFixed(1)}s`);
    hudPowers.textContent=`Powers: ${powers.length?powers.join(" • "):"none"}`;

    draw(now);
    requestAnimationFrame(loop);
  }
  // Kick off the loop
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
