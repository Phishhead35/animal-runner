<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cartoon Animal Runner</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:#bfe9ff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      /* iOS safe-area support */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap {
      /* In landscape on small screens the canvas should shrink to fit without the controls overlapping */
      height:100dvh; display:flex; align-items:center; justify-content:center;
      padding:4px 8px 80px 8px; /* leave room for controls at bottom */
    }
    canvas {
      width:min(960px,100%);
      /* In landscape phones height is the constraint — limit to 60dvh so controls stay visible */
      max-height:60dvh;
      height:auto; aspect-ratio:960/540;
      border:2px solid #232323; border-radius:12px; background:transparent; touch-action:none;
    }
    .hud {
      position:fixed; top:max(4px,env(safe-area-inset-top)); left:8px; right:8px;
      display:flex; gap:6px; align-items:center; justify-content:space-between;
      color:#232323; font-size:12px; pointer-events:none; flex-wrap:wrap;
    }
    .hud .left, .hud .right { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .pill { background:rgba(255,255,255,0.75); border:1px solid rgba(35,35,35,0.25); border-radius:999px; padding:4px 8px; }
    .controls {
      position:fixed; left:8px; right:8px;
      bottom:max(8px, env(safe-area-inset-bottom));
      display:flex; gap:8px; justify-content:space-between; align-items:flex-end; flex-wrap:wrap;
    }
    .cluster { display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; }
    button {
      appearance:none; border:2px solid #232323; background:rgba(255,255,255,0.85);
      border-radius:14px; padding:9px 11px; font-size:13px; font-weight:700;
      box-shadow:0 6px 0 rgba(35,35,35,0.12); cursor:pointer; line-height:1.2;
    }
    button:active { transform:translateY(2px); box-shadow:0 4px 0 rgba(35,35,35,0.12); }
    .btn-wide { padding:11px 14px; font-size:15px; }
    @media (max-height: 500px) {
      /* Landscape phone — hide hint text, shrink buttons further */
      .hud .right .pill:last-child { display:none; }
      button { padding:7px 9px; font-size:12px; }
      .btn-wide { padding:9px 12px; font-size:13px; }
      .wrap { padding-bottom:64px; }
    }
    .btn-red    { background:rgba(255,220,220,0.9); }
    .btn-blue   { background:rgba(215,235,255,0.9); }
    .btn-purple { background:rgba(235,220,255,0.9); }
    .btn-green  { background:rgba(220,255,230,0.9); }
    .btn-dark   { background:rgba(35,35,35,0.88); color:white; }
    .small { font-size:12px; font-weight:600; opacity:0.9; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="left">
      <div class="pill" id="hudScore">Score: 0</div>
      <div class="pill" id="hudCoins">Coins: 0</div>
      <div class="pill" id="hudWallet">Wallet: 0</div>
      <div class="pill" id="hudPowers">Powers: none</div>
    </div>
    <div class="right">
      <div class="pill" id="hudChar">Frog</div>
      <div class="pill" id="hudAssist">Assist: ON</div>
      <div class="pill" id="hudAudio">Audio: Muted</div>
      <div class="pill small">Tap=jump • Double-tap=quick jump • Hold=high jump • Hold ↓/S=duck • M audio • A assist</div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="c" width="960" height="540"></canvas>
  </div>

  <div class="controls">
    <div class="cluster">
      <button class="btn-wide btn-dark" id="btnJump">JUMP</button>
      <button class="btn-wide btn-dark" id="btnDuck">DUCK ↓</button>
      <button class="btn-green" id="btnShop">SHOP (S)</button>
      <button class="btn-green" id="btnLeaderboard">🏆 SCORES (L)</button>
      <button class="btn-green" id="btnAssist">ASSIST: ON (A)</button>
      <button class="btn-dark"  id="btnAudio">AUDIO (M)</button>
      <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0"
        style="width:80px;accent-color:#232323;cursor:pointer;vertical-align:middle;margin-left:4px;"
        title="Music volume">
    </div>
    <div class="cluster">
      <button class="btn-blue"   id="btnShield">Shield (1)<div class="small">10 coins</div></button>
      <button class="btn-red"    id="btnMagnet">Magnet (2)<div class="small">12 coins</div></button>
      <button class="btn-purple" id="btnDouble">Double (3)<div class="small">12 coins</div></button>
    </div>
  </div>

(() => {

    monkey:   { label:"Monkey 🐒",    emoji:"🐒", cost:30,
                skins:{ brown:  { label:"Brown (default)", cost:0,  body:"#8b5e3c", belly:"#d4aa80" },
                        tan:    { label:"Tan",             cost:20, body:"#c8884a", belly:"#f0d0a0" },

                        dark:   { label:"Dark",            cost:35, body:"#4a3020", belly:"#7a5a3a" } } },
    capybara: { label:"Capybara 🐾",  emoji:"🐾", cost:50,
                skins:{ brown:  { label:"Brown (default)", cost:0,  body:"#b5854a", belly:"#e8c888" },
                        sandy:  { label:"Sandy",           cost:25, body:"#d4aa6a", belly:"#f5e0b0" },

    hippo:    { label:"Hippo 🦛",     emoji:"🦛", cost:60,
                skins:{ grey:   { label:"Grey (default)",  cost:0,  body:"#8899aa", belly:"#e8d0c8" },
                        purple: { label:"Purple",          cost:25, body:"#9977bb", belly:"#ddc8ee" },
                        blue:   { label:"Blue",            cost:25, body:"#5588bb", belly:"#c0d8f0" },
                        pink:   { label:"Pink",            cost:40, body:"#cc7799", belly:"#f0c8d8" } } },
    elephant: { label:"Elephant 🐘",  emoji:"🐘", cost:70,
                skins:{ grey:   { label:"Grey (default)",  cost:0,  body:"#8888aa", belly:"#ccccdd" },
                        brown:  { label:"Brown",           cost:25, body:"#997755", belly:"#ddbb99" },
                        pink:   { label:"Pink",            cost:25, body:"#dd99aa", belly:"#f5dde5" },
                        ivory:  { label:"Ivory",           cost:40, body:"#ddd5bb", belly:"#f5f0e0" } } },
    puffin:   { label:"Puffin 🐦",    emoji:"🐦", cost:80,
                skins:{ classic:{ label:"Classic (default)",cost:0, body:"#111111", belly:"#ffffff" },
                        blue:   { label:"Blue",            cost:25, body:"#334488", belly:"#aabbdd" },
                        brown:  { label:"Brown",           cost:25, body:"#553322", belly:"#ddbbaa" },

    axolotl:  { label:"Axolotl 🫧",   emoji:"🫧", cost:90,
                skins:{ pink:     { label:"Pink (default)", cost:0,  body:"#f0a0b8", belly:"#ffd8e8" },
                        leucistic:{ label:"Leucistic",      cost:25, body:"#f8eedd", belly:"#ffffff" },

    pig:      { label:"Pig 🐷",       emoji:"🐷", cost:100,
                skins:{ pink:   { label:"Pink (default)",  cost:0,  body:"#f0a0b0", belly:"#ffd0dc" },
                        peach:  { label:"Peach",           cost:25, body:"#e8b890", belly:"#f8dcc0" },
                        spotted:{ label:"Spotted",         cost:25, body:"#e88898", belly:"#ffc8d0" },
                        black:  { label:"Black",           cost:40, body:"#333344", belly:"#665566" } } },
    moose:    { label:"Moose 🫎",     emoji:"🫎", cost:110,
                skins:{ brown:  { label:"Brown (default)", cost:0,  body:"#7a5030", belly:"#c09060" },
                        dark:   { label:"Dark",            cost:25, body:"#3a2010", belly:"#7a5030" },
                        tan:    { label:"Tan",             cost:25, body:"#b08050", belly:"#e0c090" },
                        white:  { label:"White",           cost:40, body:"#e8e0d0", belly:"#ffffff" } } },
    bear:     { label:"Bear 🐻",      emoji:"🐻", cost:120,
                skins:{ brown:  { label:"Brown (default)", cost:0,  body:"#8b5e3c", belly:"#d4a878" },
                        black:  { label:"Black",           cost:25, body:"#222222", belly:"#554444" },
                        grizzly:{ label:"Grizzly",         cost:25, body:"#b07840", belly:"#e0b870" },
                        polar:  { label:"Polar",           cost:40, body:"#f0f0ee", belly:"#ffffff" } } },
  };
  const CHAR_KEYS = Object.keys(CHARACTERS);

  // ── Persistence ───────────────────────────────────────────────────────────────
  const SAVE_KEY = "cartoon_animal_runner_v1";
  function loadSave() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      s.wallet       ??= 0;
      s.best         ??= 0;
      s.leaderboard  ??= [];
      s.character    ??= "frog";
      s.charSkin     ??= {};
      s.ownedChars   ??= ["frog"];
      s.ownedSkins   ??= {};
      s.assist       ??= ASSIST_ON;
      if (!CHARACTERS[s.character]) s.character = "frog";
      if (!s.ownedChars.includes("frog")) s.ownedChars.push("frog");
      for (const ck of CHAR_KEYS) {
        s.ownedSkins[ck] ??= [Object.keys(CHARACTERS[ck].skins)[0]];
      }
      return s;
    } catch {
      return { wallet:0, best:0, leaderboard:[], character:"frog", charSkin:{},
               ownedChars:["frog"],
               ownedSkins:{ frog:["green"], dog:["tan"], cat:["orange"], monkey:["brown"] },
               assist:ASSIST_ON };
    }
  }
  function persist() { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  let save = loadSave();

  function activeSkinKey(ck) {
    const k = save.charSkin[ck];
    return (k && CHARACTERS[ck].skins[k]) ? k : Object.keys(CHARACTERS[ck].skins)[0];
  }
  function activeSkin(ck) { return CHARACTERS[ck].skins[activeSkinKey(ck)]; }

  // ── Audio & Music Engine ──────────────────────────────────────────────────────
  // iPhone-hardened audio system:
  // 1. A silent <audio> element is played first on every gesture — this moves
  //    WebAudio out of the "ringer" channel and past the silent mode switch.
  // 2. AudioContext is created AND resumed inside the same gesture call stack.
  // 3. We verify ctx.state === "running" before playing anything.
  // 4. unlockAudio() is idempotent and safe to call on every interaction.

  let audioCtx = null, muted = true;
  let musicGain = null;
  let musicNodes = [];
  let musicTrack = null;
  let musicVolume = 0.35;
  let audioUnlocked = false;

  // Create a tiny silent <audio> element — playing it tricks iOS into
  // routing subsequent WebAudio through the media (not ringer) channel.
  const _silentAudio = (() => {
    try {
      const a = document.createElement("audio");
      // Shortest valid MP3 — 64 bytes of silence
      a.src = "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAADhgCenp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6e////////////////////////////////////////////////////////////////AAAAAExhdmM1OC41AAAAAAAAAAAAAAAA//tQZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAACAAACcQCWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaW////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
      a.loop = false;
      a.volume = 0.001; // near-silent but not zero
      a.preload = "auto";
      return a;
    } catch(e) { return null; }
  })();

  function _playSilentAudio() {
    if (!_silentAudio) return;
    _silentAudio.play().catch(() => {}); // ignore errors — best-effort
  }

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = muted ? 0 : musicVolume * 0.5;
    musicGain.connect(audioCtx.destination);
  }

  // Must be called directly inside a user gesture event handler.
  // Safe to call many times — does nothing once unlocked.
  function unlockAudio() {
    if (audioUnlocked && audioCtx && audioCtx.state === "running") return;
    _playSilentAudio();
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") {
      audioCtx.resume().then(() => { audioUnlocked = true; });
    } else if (audioCtx.state === "running") {
      audioUnlocked = true;
    }
  }

  function beep(freq=440, dur=0.06, gain=0.05) {
    if (muted || !audioCtx || audioCtx.state !== "running") return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type="square"; o.frequency.value=freq; g.gain.value=gain;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }

  // ── Note helpers ──────────────────────────────────────────────────────────────
  // Equal-tempered frequency from MIDI note number (A4 = 69 = 440 Hz)
  const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);

  // Schedule a single note on a pre-connected oscillator+gain
  function schedNote(type, freq, startT, dur, peakGain, bus) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, startT);
    g.gain.linearRampToValueAtTime(peakGain, startT + 0.01);
    g.gain.setValueAtTime(peakGain, startT + dur * 0.7);
    g.gain.linearRampToValueAtTime(0, startT + dur);
    o.connect(g); g.connect(bus);
    o.start(startT); o.stop(startT + dur + 0.02);
    musicNodes.push(o, g);
  }

  // Stop all running music nodes immediately
  function stopMusic() {
    for (const n of musicNodes) {
      try { if (n.stop) n.stop(); } catch(_) {}
      try { n.disconnect(); } catch(_) {}
    }
    musicNodes = [];
    musicTrack = null;
  }

  // ── Tracks ────────────────────────────────────────────────────────────────────
  // Notes are MIDI numbers. Each track is a looping sequence of { note, dur, rest? }
  // Sequences are pre-calculated and then looped via recursive scheduling.

  // Upbeat run track — C major pentatonic bounce
  // Melody: bouncy 8th-note riff
  const RUN_MELODY = [
    // bar 1
    72,72,74,76, 79,76,74,72,
    // bar 2
    74,74,76,79, 81,79,76,74,
    // bar 3
    76,79,81,83, 84,83,81,79,
    // bar 4 — descend back
    79,76,74,72, 71,72,74,72,
  ].map(n=>({ n, dur:0.125 }));

  // Bass line — root + fifth pump
  const RUN_BASS = [
    60,60,67,60, 60,60,67,60,
    62,62,69,62, 62,62,69,62,
    64,64,71,64, 64,64,71,64,

  ].map((n,i)=>({ n, dur:0.125 }));

  // Calm title screen — slower arpeggios in Am
  const TITLE_MELODY = [

    67,71,74,79, 77,74,71,67,

  ].map(n=>({ n, dur:0.22 }));

  const TITLE_BASS = [
    57,57,64,57, 57,57,64,57,
    55,55,62,55, 55,55,62,55,
    53,53,60,53, 53,53,60,53,
    55,55,62,55, 57,57,64,57,
  ].map(n=>({ n, dur:0.22 }));

  // Schedule a full looping sequence starting at `startT`
  // Returns total bar duration so caller can reschedule
  function schedSequence(notes, type, gainPeak, bus, startT) {
    let t = startT;
    for (const note of notes) {
      schedNote(type, midiHz(note.n), t, note.dur * 0.85, gainPeak, bus);
      t += note.dur;
    }
    return t - startT; // total duration of one loop
  }

  // Self-scheduling looper — calls itself recursively ~1 bar before loop ends
  function startLooper(melNotes, bassNotes, lookahead=0.1) {
    if (!audioCtx || muted) return;
    const melBus  = audioCtx.createGain(); melBus.gain.value  = 1.0; melBus.connect(musicGain);
    const bassBus = audioCtx.createGain(); bassBus.gain.value = 0.55; bassBus.connect(musicGain);
    musicNodes.push(melBus, bassBus);

    function loop(startT) {
      const melDur  = schedSequence(melNotes,  "square",   0.22, melBus,  startT);
      const bassDur = schedSequence(bassNotes, "triangle", 0.30, bassBus, startT);
      const barDur  = Math.max(melDur, bassDur);
      // Schedule next loop slightly before this one ends
      const schedDelay = (startT + barDur - lookahead - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        if (!muted && musicNodes.includes(melBus)) loop(startT + barDur);
      }, Math.max(0, schedDelay));
    }
    loop(audioCtx.currentTime + 0.05);
  }

  function playMusic(track) {
    if (musicTrack === track) return; // already playing this track
    stopMusic();
    if (!audioCtx || muted) return;
    musicTrack = track;
    if (track === "play")  startLooper(RUN_MELODY,   RUN_BASS);
    if (track === "start") startLooper(TITLE_MELODY, TITLE_BASS);
  }

  function applyMusicVolume() {
    if (musicGain) musicGain.gain.value = muted ? 0 : musicVolume * 0.5;
  }

  function setMuted(v) {
    muted = v;
    if (!muted) {
      ensureAudio();
      _playSilentAudio(); // iOS silent-switch bypass
      // resume() MUST be called in the same call stack as the gesture
      const doPlay = () => {
        if (audioCtx.state !== "running") return; // give up — not unlocked yet
        audioUnlocked = true;
        applyMusicVolume();
        const track = (state === "play") ? "play" : "start";
        musicTrack = null; // force restart
        playMusic(track);
        beep(330, 0.05, 0.05);
        setTimeout(() => beep(440, 0.05, 0.05), 80);
      };
      if (audioCtx.state === "running") {
        doPlay();
      } else {
        audioCtx.resume().then(doPlay);
      }
    } else {
      applyMusicVolume();
      stopMusic();
    }
    hudAudio.textContent = `Audio: ${muted ? "Muted" : "On"}`;
    updateVolSlider();
  }

  function setMusicVolume(v) {
    musicVolume = Math.max(0, Math.min(1, v));
    applyMusicVolume();
    updateVolSlider();
  }

  function updateVolSlider() {
    const sl = document.getElementById("volSlider");
    if (sl) sl.value = muted ? 0 : musicVolume;
  }

  // ── Assist ────────────────────────────────────────────────────────────────────
  let assist = !!save.assist, assistShieldGiven = false;
  function setAssist(v) { assist=!!v; save.assist=assist; persist(); refreshAssistUI(); }
  function refreshAssistUI() {
    btnAssist.textContent = `ASSIST: ${assist?"ON":"OFF"} (A)`;
    hudAssist.textContent = `Assist: ${assist?"ON":"OFF"}`;
  }
  refreshAssistUI();

  // ── Game state ────────────────────────────────────────────────────────────────
  let state = "start";
  let runTime=0, dist=0, score=0, coinsRun=0, speed=SPEED_EASY, nextSpawn=W+200;
  let obstacles=[], coinList=[], orbList=[];

  // ── Biome / environment state ─────────────────────────────────────────────
  let biomeIdx   = 0;      // current biome (0-3)
  let biomeFade  = 1.0;    // 0=fully prev biome, 1=fully current biome
  let prevBiome  = 0;      // biome we're fading from
  let stars      = Array.from({length:80}, () => ({
    x: Math.random()*960, y: Math.random()*350,
    r: 0.8+Math.random()*1.8, twink: Math.random()*Math.PI*2
  }));
  let rainDrops  = Array.from({length:120}, () => ({
    x: Math.random()*1100-70, y: Math.random()*H,
    vy: 600+Math.random()*300, vx: -80-Math.random()*60,
  }));
  let lightningT = 0;      // countdown to next lightning flash
  let lightningFlash = 0;  // current flash brightness 0-1
  let stormClouds = Array.from({length:6}, (_,i) => ({
    x: i*180+Math.random()*80, y: 20+Math.random()*70,
    w: 180+Math.random()*120,
    v: 28+Math.random()*18,
  }));
  let shimmerOff = 0;      // horizontal scroll offset for heat shimmer

  function currentBiome() { return BIOMES[biomeIdx]; }
  function lerpRGB(a,b,t) { return [
    Math.round(a[0]+(b[0]-a[0])*t),
    Math.round(a[1]+(b[1]-a[1])*t),
    Math.round(a[2]+(b[2]-a[2])*t),
  ]; }
  function lerpHex(ha, hb, t) {
    // parse "#rrggbb" → lerp → "#rrggbb"
    const pr=c=>parseInt(c.slice(1,3),16), pg=c=>parseInt(c.slice(3,5),16), pb=c=>parseInt(c.slice(5,7),16);
    const r=Math.round(pr(ha)+(pr(hb)-pr(ha))*t);
    const g=Math.round(pg(ha)+(pg(hb)-pg(ha))*t);
    const b=Math.round(pb(ha)+(pb(hb)-pb(ha))*t);
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  }
  function getBiomeSky1() { return lerpRGB(BIOMES[prevBiome].sky1, BIOMES[biomeIdx].sky1, biomeFade); }
  function getBiomeSky2() { return lerpRGB(BIOMES[prevBiome].sky2, BIOMES[biomeIdx].sky2, biomeFade); }
  function getBiomeGround()     { return lerpHex(BIOMES[prevBiome].ground,     BIOMES[biomeIdx].ground,     biomeFade); }
  function getBiomeGroundDark() { return lerpHex(BIOMES[prevBiome].groundDark, BIOMES[biomeIdx].groundDark, biomeFade); }

  const player = {
    x:160, y:0, w:56, h:72,
    vy:0, on:true, tt:0,
    shieldT:0, magnetT:0, doubleT:0, doubleUsed:false,
    coyoteT:0, chargeT:0, charging:false, jumpHeld:false, ducking:false,
  };
  let duckHeld = false; // tracks whether duck input is physically held

  const clouds = Array.from({length:7}, () => randomCloud(true));
  function randomCloud(init=false) {
    return { x:init?Math.random()*W:W+40+Math.random()*160,
             y:40+Math.random()*170, s:0.8+Math.random()*0.9, v:18+Math.random()*20 };
  }

  // Shop state — two tabs: characters and skins
  let shopTab = "chars";
  let shopCharIdx = CHAR_KEYS.indexOf(save.character);
  let shopSkinIdx = 0;
  let shopCharScrollOffset = 0;
  function currentShopChar()  { return CHAR_KEYS[shopCharIdx]; }
  function currentShopSkins() { return Object.keys(CHARACTERS[currentShopChar()].skins); }

  function resetRun() {
    runTime=0; dist=0; score=0; coinsRun=0; speed=SPEED_EASY; nextSpawn=W+200;
    obstacles=[]; coinList=[]; orbList=[];
    player.y=GROUND_Y-player.h; player.vy=0; player.on=true; player.tt=0;
    player.shieldT=0; player.magnetT=0; player.doubleT=0;
    player.doubleUsed=false; player.coyoteT=0;
    player.chargeT=0; player.charging=false; player.jumpHeld=false; player.ducking=false;
    assistShieldGiven=false; duckHeld=false;
    biomeIdx=0; prevBiome=0; biomeFade=1.0;
    lightningT=2+Math.random()*3; lightningFlash=0;
    shimmerOff=0;
    playMusic("play"); // switch to run track
  }

  // ── Helpers ───────────────────────────────────────────────────────────────────
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const rint  = (a,b)   => Math.floor(a+Math.random()*(b-a+1));
  const rects = (a,b)   => a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

  function speedForTime(rt) {
    const cap = assist?SPEED_CAP_ASS:SPEED_CAP_NORM;
    if (rt<EASY_END)   return SPEED_EASY;
    if (rt<MEDIUM_END) return SPEED_EASY+(rt-EASY_END)*((SPEED_MEDIUM-SPEED_EASY)/(MEDIUM_END-EASY_END));
    return Math.min(cap, SPEED_MEDIUM+(rt-MEDIUM_END)*1.0);
  }
  function rateIndex(rt) { return rt<EASY_END?0:rt<MEDIUM_END?1:2; }
  function gapRange(s) {
    const bonus = Math.floor(Math.max(0,(s-SPEED_EASY)*GAP_FACTOR));
    return { min:GAP_MIN_BASE+bonus, max:GAP_MAX_BASE+bonus };
  }

  // ── Spawning ──────────────────────────────────────────────────────────────────
  function pickWeighted(weights) {
    let r=Math.random(), sum=0;
    for (let i=0;i<weights.length;i++) { sum+=weights[i]; if (r<sum) return i; }
    return weights.length-1;
  }
  function spawnPack() {
    const ri=rateIndex(runTime);
    const bi=biomeIdx;
    // Decide ground vs air
    const isAir = Math.random() < BIRD_RATES[ri];
    let kind, x=nextSpawn, y, w, h;
    if (isAir) {
      const aw=AIR_WEIGHTS[bi];
      const ak=pickWeighted(aw);
      kind = ["bird","eagle","bat"][ak];
      w=rint(60,88); h=rint(36,52); y=BIRD_FLY_Y;
    } else {
      const gw=GROUND_WEIGHTS[bi];
      const gk=pickWeighted(gw);
      kind = ["snake","rock","cactus","log"][gk];
      w=rint(52,80); h=rint(36,52); y=GROUND_Y-h;
      if (kind==="cactus") { w=rint(30,48); h=rint(50,72); y=GROUND_Y-h; }
      if (kind==="log")    { w=rint(58,82); h=rint(28,40); y=GROUND_Y-h; }
      if (kind==="rock")   { w=rint(44,68); h=rint(30,46); y=GROUND_Y-h; }
    }
    obstacles.push({x,y,w,h,kind,phase:Math.random()*Math.PI*2});

    if (Math.random()<COIN_CHANCE) {
      const cy = kind==="snake"
        ? clamp(y-rint(30,80),100,GROUND_Y-40)
        : clamp(BIRD_GAP_BOTTOM-rint(20,50),200,GROUND_Y-40);
      coinList.push({x:x+w/2+rint(-20,20), y:cy, r:12, got:false, popT:0});
    }
    if (Math.random()<ORB_RATES[ri]) {
      const orbKind=["shield","magnet","double"][rint(0,2)];
      orbList.push({x:x+w/2, y:clamp(y-rint(60,120),100,GROUND_Y-70), r:14, kind:orbKind, got:false});
    }
    const gr=gapRange(speed);
    nextSpawn = x+rint(gr.min,gr.max)+rint(0,GAP_TAIL_EXTRA);
  }

  // ── Jump / Duck ───────────────────────────────────────────────────────────────
  let lastTapTime = 0;
  const DOUBLE_TAP_MS = 300;

  function jumpPressed() {
    if (state!=="play") return;
    const now = performance.now();
    const isDoubleTap = (now - lastTapTime) < DOUBLE_TAP_MS;
    lastTapTime = now;

    player.jumpHeld = true;

    // Double-tap while on ground = instant quick jump (no charge)
    if (isDoubleTap && (player.on || player.coyoteT > 0)) {
      player.charging = false; player.chargeT = 0;
      const jumpV = assist ? JUMP_V_ASS : JUMP_V_NORM;
      player.vy = -Math.floor(jumpV * 0.78); // quick mid-height jump
      player.on = false; player.coyoteT = 0;
      beep(520, 0.05, 0.05);
      return;
    }

    if (player.on || player.coyoteT > 0) { player.charging = true; player.chargeT = 0; }
    else if (player.doubleT > 0 && !player.doubleUsed) {
      player.doubleUsed = true;
      player.vy = -Math.floor((assist ? JUMP_V_ASS : JUMP_V_NORM) * 0.92);
      beep(620, 0.05, 0.05);
    }
  }
  function jumpReleased() {
    player.jumpHeld = false;
    if (player.charging) {
      player.charging = false;
      const jumpV = assist ? JUMP_V_ASS : JUMP_V_NORM;
      const ratio = clamp(player.chargeT / CHARGE_TIME, 0, 1);
      player.vy = -Math.floor(jumpV * (JUMP_MIN_RATIO + (JUMP_MAX_RATIO - JUMP_MIN_RATIO) * ratio));
      player.on = false; player.coyoteT = 0; player.chargeT = 0;
      beep(380 + ratio * 260, 0.06, 0.05);
    }
  }

  // ── Power & shop purchases ────────────────────────────────────────────────────
  function buyPower(kind) {
    if (state!=="play") return;
    if (save.wallet<POWER_COST[kind]) { beep(180,0.08,0.06); return; }
    save.wallet-=POWER_COST[kind]; persist();
    if (kind==="shield") player.shieldT=POWER_DUR.shield;
    if (kind==="magnet") player.magnetT=POWER_DUR.magnet;
    if (kind==="double") player.doubleT=POWER_DUR.double;
    beep(880,0.05,0.05); beep(1040,0.05,0.05);
  }

  function buyOrEquipChar(ck) {
    const ch=CHARACTERS[ck]; if (!ch) return;
    if (save.ownedChars.includes(ck)) {
      save.character=ck; shopCharIdx=CHAR_KEYS.indexOf(ck); shopSkinIdx=0; persist(); beep(440,0.05,0.04);
    } else if (save.wallet>=ch.cost) {
      save.wallet-=ch.cost; save.ownedChars.push(ck); save.character=ck;
      shopCharIdx=CHAR_KEYS.indexOf(ck); shopSkinIdx=0; persist();
      beep(660,0.05,0.05); beep(880,0.05,0.05);
    } else { beep(180,0.08,0.06); }
  }

  function buyOrEquipSkin(ck, sk) {
    const skins=CHARACTERS[ck]?.skins; if (!skins||!skins[sk]) return;
    save.ownedSkins[ck]??=[];
    if (save.ownedSkins[ck].includes(sk)) {
      save.charSkin[ck]=sk; persist(); beep(440,0.05,0.04);
    } else if (save.wallet>=skins[sk].cost) {
      save.wallet-=skins[sk].cost; save.ownedSkins[ck].push(sk);
      save.charSkin[ck]=sk; persist();
      beep(660,0.05,0.05); beep(880,0.05,0.05);
    } else { beep(180,0.08,0.06); }
  }

  // ── Input ─────────────────────────────────────────────────────────────────────
  // iPhone: capture the very first touch at document level to unlock audio
  // before any game button handlers fire. Use "once" so it only runs once.
  document.addEventListener("touchstart", function _iosFirstTouch() {
    ensureAudio();
    unlockAudio();
    document.removeEventListener("touchstart", _iosFirstTouch);
  }, { passive: true, capture: true });
  document.addEventListener("pointerdown", function _iosFirstPointer() {
    ensureAudio();
    unlockAudio();
    document.removeEventListener("pointerdown", _iosFirstPointer, true);
  }, { passive: true, capture: true });

  window.addEventListener("keydown", e => {
    ensureAudio(); unlockAudio();
    const code=e.code;
    if (code==="Space"||code==="ArrowUp") {
      if (state==="start"||state==="over") { state="play"; resetRun(); }
      if (!e.repeat) jumpPressed();
      e.preventDefault();
    }
    if (code==="KeyR"&&state!=="play") { state="play"; resetRun(); }
    if (code==="KeyM") setMuted(!muted);
    if (code==="KeyS"&&state!=="play") { state=(state==="shop")?"start":"shop"; if (state==="start"||state==="shop") playMusic("start"); }
    if (code==="KeyL") { state=(state==="leaderboard")?"start":"leaderboard"; playMusic("start"); }
    if (code==="KeyS"&&state==="play") { player.ducking=true; duckHeld=true; e.preventDefault(); }
    if (code==="ArrowDown"&&state==="play") { player.ducking=true; duckHeld=true; e.preventDefault(); }
    if (code==="KeyA") setAssist(!assist);
    if (code==="Digit1") buyPower("shield");
    if (code==="Digit2") buyPower("magnet");
    if (code==="Digit3") buyPower("double");

    if (state==="shop") {
      const VISIBLE_ROWS=5;
      const skinKeys=currentShopSkins();
      if (code==="Tab") { shopTab=shopTab==="chars"?"skins":"chars"; shopSkinIdx=0; e.preventDefault(); }
      if (shopTab==="chars") {
        if (code==="ArrowDown"||code==="ArrowUp") {
          if (code==="ArrowDown") shopCharIdx=(shopCharIdx+1)%CHAR_KEYS.length;
          else shopCharIdx=(shopCharIdx-1+CHAR_KEYS.length)%CHAR_KEYS.length;
          // Keep selection in view
          if (shopCharIdx < shopCharScrollOffset) shopCharScrollOffset=shopCharIdx;
          if (shopCharIdx >= shopCharScrollOffset+VISIBLE_ROWS) shopCharScrollOffset=shopCharIdx-VISIBLE_ROWS+1;
          e.preventDefault();
        }
        if (code==="Enter") buyOrEquipChar(CHAR_KEYS[shopCharIdx]);
      } else {
        if (code==="ArrowDown") { shopSkinIdx=(shopSkinIdx+1)%skinKeys.length; e.preventDefault(); }
        if (code==="ArrowUp")   { shopSkinIdx=(shopSkinIdx-1+skinKeys.length)%skinKeys.length; e.preventDefault(); }
        if (code==="Enter") buyOrEquipSkin(currentShopChar(), skinKeys[shopSkinIdx]);
      }
      if (code==="Escape") state="start";
    }
  });

  window.addEventListener("keyup", e => {
    if (e.code==="Space"||e.code==="ArrowUp") jumpReleased();
    if (e.code==="ArrowDown"||e.code==="KeyS") { player.ducking=false; duckHeld=false; }
  });

  const activePointers=new Set();
  function onPointerDown(e) {
    ensureAudio(); unlockAudio();
    if (state==="shop") return;
    if (state==="start"||state==="over") { state="play"; resetRun(); }
    if (!activePointers.has(e.pointerId)) { activePointers.add(e.pointerId); jumpPressed(); }
    e.preventDefault?.();
  }
  function onPointerUp(e) { if (activePointers.delete(e.pointerId)) jumpReleased(); }
  canvas.addEventListener("pointerdown",  onPointerDown);
  canvas.addEventListener("pointerup",    onPointerUp);
  canvas.addEventListener("pointercancel",onPointerUp);

  document.getElementById("btnJump").addEventListener("pointerdown", e => {
    ensureAudio(); unlockAudio();
    if (state==="start"||state==="over") { state="play"; resetRun(); }
    if (!activePointers.has("btn")) { activePointers.add("btn"); jumpPressed(); }
    e.preventDefault();
  });
  document.getElementById("btnJump").addEventListener("pointerup",     ()=>{ activePointers.delete("btn"); jumpReleased(); });
  document.getElementById("btnJump").addEventListener("pointercancel", ()=>{ activePointers.delete("btn"); jumpReleased(); });

  const btnDuck=document.getElementById("btnDuck");
  btnDuck.addEventListener("pointerdown",  e=>{ player.ducking=true; duckHeld=true; e.preventDefault(); });
  btnDuck.addEventListener("pointerup",    ()=>{ player.ducking=false; duckHeld=false; });
  btnDuck.addEventListener("pointercancel",()=>{ player.ducking=false; duckHeld=false; });
  btnDuck.addEventListener("mouseleave",   ()=>{ player.ducking=false; duckHeld=false; });

  document.getElementById("btnShop").addEventListener("click", ()=>{ state=(state==="shop"?"start":"shop"); playMusic("start"); });
  document.getElementById("btnLeaderboard").addEventListener("click", ()=>{ state=(state==="leaderboard"?"start":"leaderboard"); playMusic("start"); });
  btnAssist.addEventListener("click", ()=>setAssist(!assist));
  btnAudio.addEventListener("click",  ()=>setMuted(!muted));
  const volSlider = document.getElementById("volSlider");
  // Slider "change" fires on lift — which IS a gesture on iOS
  // "input" fires while dragging — not always a gesture
  // We handle both but only unlock on "change" (finger-lift)
  volSlider.addEventListener("input", e => {
    const v = parseFloat(e.target.value);
    if (v === 0) { if (!muted) setMuted(true); return; }
    // If already unlocked, just adjust volume live
    if (!muted && audioCtx && audioCtx.state === "running") {
      setMusicVolume(v);
    }
    // If muted but unlocked, unmute silently
    else if (muted && audioCtx && audioCtx.state === "running") {
      muted = false;
      setMusicVolume(v);
      musicTrack = null;
      playMusic((state === "play") ? "play" : "start");
      hudAudio.textContent = "Audio: On";
    }
    // If not yet unlocked — do nothing; user must tap AUDIO button first
  });
  volSlider.addEventListener("change", e => {
    // "change" fires on finger-lift = valid gesture on iOS
    const v = parseFloat(e.target.value);
    if (v > 0 && muted) setMuted(false); // this will call resume() in a gesture
    if (v > 0) setMusicVolume(v);
    if (v === 0 && !muted) setMuted(true);
  });
  document.getElementById("btnShield").addEventListener("click", ()=>buyPower("shield"));
  document.getElementById("btnMagnet").addEventListener("click", ()=>buyPower("magnet"));
  document.getElementById("btnDouble").addEventListener("click", ()=>buyPower("double"));

  // ── Shop scroll: mouse wheel ─────────────────────────────────────────────────
  canvas.addEventListener("wheel", e => {
    if (state!=="shop") return;
    e.preventDefault();
    const VISIBLE_ROWS=5;
    if (shopTab==="chars") {
      if (e.deltaY>0) shopCharIdx=Math.min(shopCharIdx+1,CHAR_KEYS.length-1);
      else            shopCharIdx=Math.max(shopCharIdx-1,0);
      if (shopCharIdx < shopCharScrollOffset) shopCharScrollOffset=shopCharIdx;
      if (shopCharIdx >= shopCharScrollOffset+VISIBLE_ROWS) shopCharScrollOffset=shopCharIdx-VISIBLE_ROWS+1;
    } else {
      const sk=currentShopSkins();
      if (e.deltaY>0) shopSkinIdx=Math.min(shopSkinIdx+1,sk.length-1);
      else            shopSkinIdx=Math.max(shopSkinIdx-1,0);
    }
  }, {passive:false});

  // ── Shop scroll: touch swipe ──────────────────────────────────────────────────
  let shopTouchStartY=0;
  canvas.addEventListener("touchstart", e => {
    if (state==="shop") shopTouchStartY=e.touches[0].clientY;
  }, {passive:true});
  canvas.addEventListener("touchend", e => {
    if (state!=="shop") return;
    const dy=shopTouchStartY - e.changedTouches[0].clientY;
    if (Math.abs(dy)<20) return; // ignore taps
    const VISIBLE_ROWS=5;
    const steps=Math.round(dy/50);
    if (shopTab==="chars") {
      shopCharIdx=Math.max(0,Math.min(CHAR_KEYS.length-1, shopCharIdx+steps));
      if (shopCharIdx < shopCharScrollOffset) shopCharScrollOffset=shopCharIdx;
      if (shopCharIdx >= shopCharScrollOffset+VISIBLE_ROWS) shopCharScrollOffset=shopCharIdx-VISIBLE_ROWS+1;
    } else {
      const sk=currentShopSkins();
      shopSkinIdx=Math.max(0,Math.min(sk.length-1, shopSkinIdx+steps));
    }
  }, {passive:true});

  // ── Shop UP/DOWN buttons (shown only in shop) ─────────────────────────────────
  // We'll draw scroll arrows in the shop itself and handle via canvas click below

  canvas.addEventListener("click", e => {
    if (state!=="shop") return;
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    const my=(e.clientY-rect.top)*(H/rect.height);
    // Tab clicks
    if (my>=155&&my<=195) {
      if (mx>=80&&mx<=340)   { shopTab="chars"; }
      if (mx>=360&&mx<=620)  { shopTab="skins"; shopSkinIdx=0; }
    }
    const rowH=54, startY=218;

      }
      if (my>=startY+VISIBLE_ROWS*rowH+6&&my<=startY+VISIBLE_ROWS*rowH+34) { // down arrow

  // ── Arctic snow particles ──────────────────────────────────────────────────────
  const snowflakes = Array.from({length:90}, () => ({
    x: Math.random()*960, y: Math.random()*540,
    r: 1+Math.random()*3, vy: 40+Math.random()*60, vx: -20+Math.random()*40,
    twink: Math.random()*Math.PI*2
  }));
  function drawArcticSnow(now) {
    const vis = biomeIdx===4 ? biomeFade : prevBiome===4 ? 1-biomeFade : 0;
    if (vis<0.01) return;
    ctx.save(); ctx.globalAlpha=vis*0.82;
    ctx.fillStyle="white";
    for (const sf of snowflakes) {
      const sz=sf.r*(0.8+0.2*Math.sin(now/600+sf.twink));
      ctx.beginPath(); ctx.arc(sf.x,sf.y,sz,0,Math.PI*2); ctx.fill();
    }
    // Aurora strips at top
    ctx.globalAlpha=vis*0.22;
    const aColors=["#80ffcc","#60ddff","#aa88ff"];
    for (let ai=0;ai<3;ai++) {
      const wave=Math.sin(now/1800+ai*1.4)*18;
      const grd=ctx.createLinearGradient(0,40+ai*28+wave,0,90+ai*28+wave);
      grd.addColorStop(0,"transparent"); grd.addColorStop(0.5,aColors[ai]); grd.addColorStop(1,"transparent");
      ctx.fillStyle=grd; ctx.fillRect(0,40+ai*28+wave,W,50);
    }
    ctx.restore();
    // Advance snowflakes
    const dt=0.016;
    for (const sf of snowflakes) {
      sf.x+=sf.vx*dt; sf.y+=sf.vy*dt;
      if (sf.y>H+10) { sf.y=-10; sf.x=Math.random()*W; }
      if (sf.x<-10)  sf.x=W+10;
      if (sf.x>W+10) sf.x=-10;
    }
  }

  const bubbles = Array.from({length:55}, () => ({

    r: 3+Math.random()*8, vy: -(30+Math.random()*50), vx: -8+Math.random()*16,

  function drawUnderwaterBubbles(now) {
    const vis = biomeIdx===5 ? biomeFade : prevBiome===5 ? 1-biomeFade : 0;
    if (vis<0.01) return;
    // Caustic shimmer overlay
    ctx.save(); ctx.globalAlpha=vis*0.10;
    ctx.strokeStyle="#60d8ff"; ctx.lineWidth=2;
    for (let ci=0;ci<8;ci++) {
      const cx2=(ci*130+(now/40)%130)%W;

      ctx.beginPath(); ctx.ellipse(cx2,cy2,30+Math.sin(now/600+ci)*10,14,0.3,0,Math.PI*2); ctx.stroke();
    }
    // Bubbles
    ctx.globalAlpha=vis;
    for (const b of bubbles) {
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(150,220,255,${b.alpha})`; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle=`rgba(200,240,255,${b.alpha*0.25})`; ctx.fill();

    ctx.restore();

  // ── Drawing helpers ───────────────────────────────────────────────────────────
  function drawRoundRect(x,y,w,h,r) {
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  // ── Biome rendering helpers ───────────────────────────────────────────────────
  function drawSky() {
    const s1=getBiomeSky1(), s2=getBiomeSky2();
    for (let i=0;i<12;i++) {
      const u=i/11;
      const r=Math.round(s1[0]+(s2[0]-s1[0])*u);
      const g=Math.round(s1[1]+(s2[1]-s1[1])*u);
      const b=Math.round(s1[2]+(s2[2]-s1[2])*u);
      ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,i*(H/12),W,H/12+1);
    }
  }

  function drawStars(now) {
    const vis = biomeIdx>=2 ? biomeFade : (biomeIdx===1?0:0);
    if (vis<=0 && biomeIdx!==4 && prevBiome!==4) return;
    ctx.save(); ctx.globalAlpha=vis;
    for (const s of stars) {
      const tw=0.5+0.5*Math.sin(now/700+s.twink);
      ctx.fillStyle=`rgba(255,255,220,${tw})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*tw,0,Math.PI*2); ctx.fill();
    }
    // Crescent moon (night desert, biome 2)
    if (biomeIdx===2||prevBiome===2) {
      const moonVis=biomeIdx===2?biomeFade:(prevBiome===2?1-biomeFade:0);
      if (moonVis>0.01) {
        ctx.globalAlpha=moonVis;
        ctx.fillStyle="#fffacc"; ctx.strokeStyle="#e0d060"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(820,70,36,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`rgb(${Math.round(20+(40-20)*biomeFade)},${Math.round(10+(20-10)*biomeFade)},${Math.round(55+(80-55)*biomeFade)})`;
        ctx.beginPath(); ctx.arc(836,64,30,0,Math.PI*2); ctx.fill();

  function drawCloud(cl) {
