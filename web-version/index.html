      ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(0,8,18,14,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,12,9,6,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(-2,-14,13,0,Math.PI*2); ctx.fill(); ctx.stroke();
      for (const ex of [-1,1]) { ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(ex*17,-12,7,10,ex*0.3,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(ex*17,-12,4,6,ex*0.3,0,Math.PI*2); ctx.fill(); }
      // Trunk
      ctx.strokeStyle=b; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-2,-4); ctx.quadraticCurveTo(8,4,6,14); ctx.stroke();
      ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-2,-4); ctx.quadraticCurveTo(8,4,6,14); ctx.stroke();
      drawEye(-7,-17,4); drawEye(5,-17,4);
    } else if (ck==="puffin") {
      ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(0,8,14,16,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(2,10,9,11,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(0,-16,11,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="white"; ctx.beginPath(); ctx.ellipse(4,-15,7,5,0.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ff8800"; ctx.beginPath(); ctx.moveTo(9,-18); ctx.lineTo(18,-14); ctx.lineTo(9,-10); ctx.closePath(); ctx.fill(); ctx.stroke();
      drawEye(4,-18,4);
    } else if (ck==="axolotl") {
      const gc=b==="#f0a0b8"?"#e06080":b==="#f8eedd"?"#e8c8a8":b==="#f0c840"?"#e09020":"#446633";
      ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(0,8,15,13,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,12,9,7,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(-2,-16,13,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(-2,-10,8,5,0,0,Math.PI*2); ctx.fill();
      for (const ex of [-1,1]) {
        for (let g=0;g<3;g++) {
          ctx.strokeStyle=gc; ctx.lineWidth=2.5;
          ctx.beginPath(); ctx.moveTo(ex*(12+g*4),-16+g*3); ctx.lineTo(ex*(16+g*4),-28+g*2); ctx.stroke();
          ctx.fillStyle=gc; ctx.beginPath(); ctx.ellipse(ex*(16+g*4),-28+g*2,3,5,ex*0.4,0,Math.PI*2); ctx.fill();
        }
      }
      drawEye(-7,-19,4); drawEye(5,-19,4);
    } else if (ck==="pig") {
      ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(0,8,16,13,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,12,9,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(-2,-17,12,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // Snout
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(6,-11,7,5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="#cc7788"; ctx.beginPath(); ctx.arc(3,-11,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(9,-11,2.5,0,Math.PI*2); ctx.fill();
      // Ears
      for (const ex of [-1,1]) {
        ctx.fillStyle=b; ctx.beginPath(); ctx.moveTo(ex*4,-26); ctx.lineTo(ex*14,-40); ctx.lineTo(ex*14,-22); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle=v; ctx.beginPath(); ctx.moveTo(ex*5,-27); ctx.lineTo(ex*12,-37); ctx.lineTo(ex*12,-24); ctx.closePath(); ctx.fill();
      }
      drawEye(-6,-19,4); drawEye(4,-19,4);
    } else if (ck==="moose") {
      ctx.fillStyle=b; drawRoundRect(-12,-10,24,26,5); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,8,7,5,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(-2,-20,10,8,0.15,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(5,-18,5,3.5,0.2,0,Math.PI*2); ctx.fill();
      // Antlers
      ctx.strokeStyle=b; ctx.lineWidth=4;
      for (const ex of [-1,1]) {
        ctx.beginPath(); ctx.moveTo(ex*5,-26); ctx.lineTo(ex*8,-40); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex*7,-34); ctx.lineTo(ex*14,-36); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex*8,-40); ctx.lineTo(ex*14,-38); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex*8,-40); ctx.lineTo(ex*12,-46); ctx.stroke();
      }
      ctx.strokeStyle=INK; ctx.lineWidth=2;
      for (const ex of [-1,1]) {
        ctx.beginPath(); ctx.moveTo(ex*5,-26); ctx.lineTo(ex*8,-40); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex*7,-34); ctx.lineTo(ex*14,-36); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex*8,-40); ctx.lineTo(ex*14,-38); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex*8,-40); ctx.lineTo(ex*12,-46); ctx.stroke();
      }
      drawEye(3,-22,4);
      for (const ex of [-1,1]) { ctx.fillStyle=b; ctx.beginPath(); ctx.arc(ex*12,-22,4,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=v; ctx.beginPath(); ctx.arc(ex*12,-22,2.5,0,Math.PI*2); ctx.fill(); }
    } else if (ck==="bear") {
      ctx.fillStyle=b; ctx.beginPath(); ctx.ellipse(0,8,17,14,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(0,12,9,7,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(-2,-17,13,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=v; ctx.beginPath(); ctx.ellipse(5,-11,7,5,0.1,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="#331111"; ctx.beginPath(); ctx.ellipse(7,-13,4,2.5,0,0,Math.PI*2); ctx.fill();
      for (const ex of [-1,1]) {
        ctx.fillStyle=b; ctx.beginPath(); ctx.arc(ex*13,-24,5,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle=v; ctx.beginPath(); ctx.arc(ex*13,-24,3,0,Math.PI*2); ctx.fill();
      }
      drawEye(-7,-20,5); drawEye(4,-20,5);
    }
    ctx.restore();
  }

  // ── Shop drawing ──────────────────────────────────────────────────────────────
  function drawShop() {
    drawSky(); clouds.forEach(drawCloud);

    // Panel
    ctx.fillStyle="rgba(255,255,255,0.93)"; drawRoundRect(36,44,W-72,H-88,20); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=3; drawRoundRect(36,44,W-72,H-88,20); ctx.stroke();

    // Header
    ctx.fillStyle=INK; ctx.font="bold 48px system-ui";
    ctx.fillText("SHOP",(W-ctx.measureText("SHOP").width)/2,104);
    ctx.font="17px system-ui";
    ctx.fillText(`💰 ${save.wallet} coins   🏆 Best: ${save.best}   Assist: ${assist?"ON":"OFF"} (A key)`,90,136);

    // Tabs
    const tabDefs=[["chars","🐾 Characters"],["skins","🎨 Skins"]];
    tabDefs.forEach(([tab,label],ti) => {
      const tx=80+ti*290, tw=270, ty=155, th=38;
      ctx.fillStyle = shopTab===tab ? INK : "rgba(0,0,0,0.06)";
      drawRoundRect(tx,ty,tw,th,10); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=2; drawRoundRect(tx,ty,tw,th,10); ctx.stroke();
      ctx.fillStyle=shopTab===tab?"white":INK; ctx.font="bold 17px system-ui";
      ctx.fillText(label, tx+(tw-ctx.measureText(label).width)/2, ty+25);
    });

    ctx.font="14px system-ui"; ctx.fillStyle="rgba(35,35,35,0.45)";
    ctx.fillText("Tab=switch tabs  •  ↑/↓ navigate  •  Enter select  •  Esc close  •  click rows",90,208);

    const rowH=54, startY=218;
    // Characters tab uses scrolling since we have 9 characters
    const VISIBLE_ROWS = 5;

    if (shopTab==="chars") {
      // Clip to list area
      ctx.save();
      ctx.beginPath(); ctx.rect(60, startY-10, W-120, VISIBLE_ROWS*rowH+10); ctx.clip();

      CHAR_KEYS.forEach((ck,i) => {
        const ch=CHARACTERS[ck];
        const owned=save.ownedChars.includes(ck);
        const equipped=save.character===ck;
        const isSel=i===shopCharIdx;
        const y=startY+(i-shopCharScrollOffset)*rowH;

        // Row background
        ctx.fillStyle=equipped?"rgba(50,210,90,0.13)":isSel?"rgba(35,35,35,0.07)":"rgba(0,0,0,0.02)";
        drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.fill();
        if (isSel||equipped) {
          ctx.strokeStyle=equipped?"#30b060":INK; ctx.lineWidth=2;
          drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.stroke();
        }

        // Mini character preview
        const sk=activeSkinKey(ck);
        drawMiniChar(ck, sk, 128, y+rowH/2-8, 0.72);

        ctx.fillStyle=INK; ctx.font="bold 20px system-ui";
        const arrow=isSel?"▶ ":"   ";
        let badge="";
        if (equipped) badge=" ✓ PLAYING";
        else if (owned) badge=" (owned)";
        else badge=` — ${ch.cost} coins`;
        ctx.fillText(arrow+ch.label+badge, 168, y+18);

        // Equipped skin name
        const skinLabel=CHARACTERS[ck].skins[sk].label;
        ctx.font="13px system-ui"; ctx.fillStyle="rgba(35,35,35,0.5)";
        ctx.fillText(`Skin: ${skinLabel}`, 172, y+38);
      });
      ctx.restore();

      // Scroll indicator + arrow buttons
      if (CHAR_KEYS.length > VISIBLE_ROWS) {
        const scrollH = VISIBLE_ROWS*rowH;
        const thumbH = Math.max(30, scrollH * VISIBLE_ROWS / CHAR_KEYS.length);
        const thumbY = startY-6 + (shopCharScrollOffset/(CHAR_KEYS.length-VISIBLE_ROWS))*(scrollH-thumbH);
        ctx.fillStyle="rgba(0,0,0,0.10)"; drawRoundRect(W-68,startY-6,8,scrollH,4); ctx.fill();
        ctx.fillStyle="rgba(0,0,0,0.32)"; drawRoundRect(W-68,thumbY,8,thumbH,4); ctx.fill();
        // Up arrow button
        const arrowX=W-58, upY=startY-34, dnY=startY+scrollH+6;
        ctx.fillStyle=shopCharScrollOffset>0?"rgba(35,35,35,0.85)":"rgba(35,35,35,0.2)";
        drawRoundRect(arrowX-16,upY-16,32,28,8); ctx.fill();
        ctx.fillStyle="white"; ctx.font="bold 16px system-ui";
        ctx.fillText("▲", arrowX-(ctx.measureText("▲").width/2), upY+5);
        // Down arrow button
        ctx.fillStyle=shopCharScrollOffset<CHAR_KEYS.length-VISIBLE_ROWS?"rgba(35,35,35,0.85)":"rgba(35,35,35,0.2)";
        drawRoundRect(arrowX-16,dnY,32,28,8); ctx.fill();
        ctx.fillStyle="white";
        ctx.fillText("▼", arrowX-(ctx.measureText("▼").width/2), dnY+18);
        // hint text
        ctx.fillStyle="rgba(35,35,35,0.4)"; ctx.font="12px system-ui";
        ctx.fillText("scroll or swipe", arrowX-40, dnY+40);
      }

    } else {
      // Skins tab
      const ck=currentShopChar();
      const ch=CHARACTERS[ck];
      const charOwned=save.ownedChars.includes(ck);

      ctx.fillStyle=INK; ctx.font="bold 18px system-ui";
      ctx.fillText(`Skins for: ${ch.label}`, 90, 220);
      if (!charOwned) {
        ctx.fillStyle="#cc3333"; ctx.font="15px system-ui";
        ctx.fillText(`⚠ Unlock ${ch.label} first (${ch.cost} coins) to use these skins`, 90, 238);
      }
      const sy=charOwned?startY:startY+20;
      currentShopSkins().forEach((sk,i) => {
        const skin=ch.skins[sk];
        const ownedSk=(save.ownedSkins[ck]??[]).includes(sk);
        const equipped=activeSkinKey(ck)===sk && save.character===ck;
        const isSel=i===shopSkinIdx;
        const y=sy+i*rowH;

        ctx.fillStyle=equipped?"rgba(50,210,90,0.13)":isSel?"rgba(35,35,35,0.07)":"rgba(0,0,0,0.02)";
        drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.fill();
        if (isSel||equipped) {
          ctx.strokeStyle=equipped?"#30b060":INK; ctx.lineWidth=2;
          drawRoundRect(80,y-6,W-160,rowH-6,12); ctx.stroke();
        }

        drawMiniChar(ck, sk, 128, y+rowH/2-10, 0.80);

        ctx.fillStyle=INK; ctx.font="bold 22px system-ui";
        const arrow=isSel?"▶ ":"   ";
        let badge="";
        if (equipped)  badge=" ✓ EQUIPPED";
        else if (ownedSk) badge=" (owned — click to equip)";
        else badge=` — ${skin.cost} coins`;
        ctx.fillText(arrow+skin.label+badge, 168, y+28);
      });
    }

    ctx.font="15px system-ui"; ctx.fillStyle="rgba(35,35,35,0.4)";
    ctx.fillText("Power-ups available via 1/2/3 buttons during a run", 90, H-52);
  }

  // ── Character draw functions ───────────────────────────────────────────────────
  // Each receives (px, py, pw, ph, bodyCol, bellyCol, tt, ducking, now)
  // px/py = top-left corner, pw/ph = visual (squashed/stretched) size

  function drawFrog(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.fillStyle=body; drawRoundRect(px,py,pw,ph,16); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.70,pw*0.32,ph*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.lineWidth=2;
    if (!ducking) {
      // Bulging eyes sit on top of head
      for (const ex of [-1,1]) {
        const ox=cx+ex*pw*0.22, oy=py-ph*0.07;
        ctx.fillStyle="#78eb91"; ctx.beginPath(); ctx.arc(ox,oy,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
        drawEye(ox,oy,6);
      }
    } else {
      for (const ex of [-1,1]) {
        const ox=cx+ex*pw*0.22, oy=py+ph*0.25;
        ctx.fillStyle="#78eb91"; ctx.beginPath(); ctx.arc(ox,oy,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
        drawEye(ox,oy,4);
      }
    }
    ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx,py+ph*0.58,pw*0.18,0.1,Math.PI-0.1); ctx.stroke();
  }

  function drawDog(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Body
    ctx.fillStyle=body; drawRoundRect(px,py+ph*0.22,pw,ph*0.78,14); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.76,pw*0.28,ph*0.17,0,0,Math.PI*2); ctx.fill();
    // Head circle
    const hcx=cx, hcy=py+ph*0.18;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.38,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Floppy ears
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(hcx-pw*0.40,hcy+ph*0.04,pw*0.13,ph*0.21,-0.35,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.40,hcy+ph*0.04,pw*0.13,ph*0.21, 0.35,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Inner ear tone
    ctx.fillStyle=belly; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(hcx-pw*0.40,hcy+ph*0.04,pw*0.07,ph*0.12,-0.35,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.40,hcy+ph*0.04,pw*0.07,ph*0.12, 0.35,0,Math.PI*2); ctx.fill();
    // Eyes & nose
    drawEye(hcx-pw*0.16,hcy-ph*0.02,6);
    drawEye(hcx+pw*0.16,hcy-ph*0.02,6);
    ctx.fillStyle="#cc6644"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx,hcy+ph*0.10,pw*0.10,ph*0.065,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Waggling tongue
    if (!ducking) {
      const wag=Math.sin(tt*12)*0.15;
      ctx.fillStyle="#ff7799"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(hcx+wag*pw*0.3,hcy+ph*0.20,pw*0.09,ph*0.08,wag,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    // Wagging tail
    const tw=Math.sin(tt*10)*0.5;
    ctx.strokeStyle=body; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.38); ctx.quadraticCurveTo(px+pw+pw*0.35,py+ph*0.18+tw*ph*0.15,px+pw+pw*0.28,py+ph*0.06); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.38); ctx.quadraticCurveTo(px+pw+pw*0.35,py+ph*0.18+tw*ph*0.15,px+pw+pw*0.28,py+ph*0.06); ctx.stroke();
  }

  function drawCat(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.fillStyle=body; drawRoundRect(px,py+ph*0.22,pw,ph*0.78,12); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.73,pw*0.25,ph*0.17,0,0,Math.PI*2); ctx.fill();
    const hcx=cx, hcy=py+ph*0.16;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.36,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Pointy ears
    for (const ex of [-1,1]) {
      ctx.fillStyle=body;
      ctx.beginPath();
      ctx.moveTo(hcx+ex*pw*0.18,hcy-pw*0.24);
      ctx.lineTo(hcx+ex*pw*0.43,hcy-pw*0.52);
      ctx.lineTo(hcx+ex*pw*0.43,hcy-pw*0.17);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle="#ffaaaa"; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(hcx+ex*pw*0.21,hcy-pw*0.25);
      ctx.lineTo(hcx+ex*pw*0.38,hcy-pw*0.45);
      ctx.lineTo(hcx+ex*pw*0.38,hcy-pw*0.20);
      ctx.closePath(); ctx.fill();
    }
    drawEye(hcx-pw*0.16,hcy-ph*0.02,6,"#1a6600");
    drawEye(hcx+pw*0.16,hcy-ph*0.02,6,"#1a6600");
    // Tiny nose
    ctx.fillStyle="#cc9988"; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(hcx,hcy+ph*0.08); ctx.lineTo(hcx-3,hcy+ph*0.115); ctx.lineTo(hcx+3,hcy+ph*0.115); ctx.closePath(); ctx.fill(); ctx.stroke();
    // Whiskers
    ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    for (const [sx,sy,ex2,ey] of [
      [-pw*0.13,ph*0.10,-pw*0.50,ph*0.08],[-pw*0.13,ph*0.13,-pw*0.50,ph*0.17],
      [ pw*0.13,ph*0.10, pw*0.50,ph*0.08],[ pw*0.13,ph*0.13, pw*0.50,ph*0.17],
    ]) { ctx.beginPath(); ctx.moveTo(hcx+sx,hcy+sy); ctx.lineTo(hcx+ex2,hcy+ey); ctx.stroke(); }
    // Swishing tail
    const tc=Math.sin(tt*6)*0.4;
    ctx.strokeStyle=body; ctx.lineWidth=7;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.65); ctx.quadraticCurveTo(px+pw+pw*0.5,py+ph*0.30+tc*ph*0.2,px+pw+pw*0.35,py+ph*0.05); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.65); ctx.quadraticCurveTo(px+pw+pw*0.5,py+ph*0.30+tc*ph*0.2,px+pw+pw*0.35,py+ph*0.05); ctx.stroke();
  }

  function drawMonkey(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.fillStyle=body; drawRoundRect(px,py+ph*0.18,pw,ph*0.82,12); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.68,pw*0.30,ph*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Little arms
    ctx.strokeStyle=body; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(px+pw*0.1,py+ph*0.45); ctx.lineTo(px-pw*0.18,py+ph*0.60); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw*0.1,py+ph*0.45); ctx.lineTo(px-pw*0.18,py+ph*0.60); ctx.stroke();
    const hcx=cx, hcy=py+ph*0.14;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.40,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Big round ears
    for (const ex of [-1,1]) {
      ctx.fillStyle=body; ctx.beginPath(); ctx.arc(hcx+ex*pw*0.43,hcy,pw*0.18,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=belly; ctx.beginPath(); ctx.arc(hcx+ex*pw*0.43,hcy,pw*0.10,0,Math.PI*2); ctx.fill();
    }
    // Muzzle
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx,hcy+ph*0.11,pw*0.22,ph*0.10,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(hcx,hcy+ph*0.10,pw*0.06,ph*0.04,0,0,Math.PI*2); ctx.fill();
    drawEye(hcx-pw*0.16,hcy-ph*0.03,6);
    drawEye(hcx+pw*0.16,hcy-ph*0.03,6);
    // Curly tail
    const tc=Math.sin(tt*5)*0.5;
    ctx.strokeStyle=body; ctx.lineWidth=8;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.50); ctx.bezierCurveTo(px+pw+pw*0.5,py+ph*0.2+tc*ph*0.3,px+pw+pw*0.5,py-ph*0.1,px+pw+pw*0.25,py-ph*0.15); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.50); ctx.bezierCurveTo(px+pw+pw*0.5,py+ph*0.2+tc*ph*0.3,px+pw+pw*0.5,py-ph*0.1,px+pw+pw*0.25,py-ph*0.15); ctx.stroke();
  }


  // ── Capybara ──────────────────────────────────────────────────────────────────
  function drawCapybara(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Long boxy body
    ctx.fillStyle=body; drawRoundRect(px,py+ph*0.25,pw,ph*0.75,10); ctx.fill(); ctx.stroke();
    // Belly
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.78,pw*0.32,ph*0.14,0,0,Math.PI*2); ctx.fill();
    // Square snout head
    const hcx=cx-pw*0.05, hcy=py+ph*0.20;
    ctx.fillStyle=body; ctx.lineWidth=3;
    drawRoundRect(hcx-pw*0.34,hcy-ph*0.12,pw*0.68,ph*0.30,8); ctx.fill(); ctx.stroke();
    // Big boxy snout
    ctx.fillStyle=body;
    drawRoundRect(hcx-pw*0.22,hcy+ph*0.08,pw*0.44,ph*0.18,6); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly;
    drawRoundRect(hcx-pw*0.16,hcy+ph*0.10,pw*0.32,ph*0.12,4); ctx.fill();
    // Nostrils
    ctx.fillStyle=INK;
    ctx.beginPath(); ctx.arc(hcx-pw*0.07,hcy+ph*0.14,2.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hcx+pw*0.07,hcy+ph*0.14,2.5,0,Math.PI*2); ctx.fill();
    // Small round ears
    for (const ex of [-1,1]) {
      ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(hcx+ex*pw*0.28,hcy-ph*0.10,pw*0.10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    // Eyes
    drawEye(hcx-pw*0.16,hcy-ph*0.04,5);
    drawEye(hcx+pw*0.16,hcy-ph*0.04,5);
    // Tiny tail
    ctx.strokeStyle=body; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.40); ctx.lineTo(px+pw+pw*0.12,py+ph*0.34); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(px+pw,py+ph*0.40); ctx.lineTo(px+pw+pw*0.12,py+ph*0.34); ctx.stroke();
  }

  // ── Hippo ─────────────────────────────────────────────────────────────────────
  function drawHippo(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Chunky barrel body
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.65,pw*0.52,ph*0.38,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Belly
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.72,pw*0.34,ph*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Huge wide head
    const hcx=cx, hcy=py+ph*0.22;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(hcx,hcy,pw*0.46,ph*0.24,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Massive snout / muzzle
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx,hcy+ph*0.14,pw*0.36,ph*0.14,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Nostrils
    ctx.fillStyle=INK;
    ctx.beginPath(); ctx.arc(hcx-pw*0.10,hcy+ph*0.16,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hcx+pw*0.10,hcy+ph*0.16,3.5,0,Math.PI*2); ctx.fill();
    // Perky ears on top
    for (const ex of [-1,1]) {
      ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(hcx+ex*pw*0.38,hcy-ph*0.18,pw*0.11,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=belly; ctx.beginPath(); ctx.arc(hcx+ex*pw*0.38,hcy-ph*0.18,pw*0.06,0,Math.PI*2); ctx.fill();
    }
    // Eyes on top of head (hippos have eyes up high)
    drawEye(hcx-pw*0.18,hcy-ph*0.08,6);
    drawEye(hcx+pw*0.18,hcy-ph*0.08,6);
    // Tusk nubs
    ctx.fillStyle="#fffacc"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    for (const ex of [-1,1]) {
      ctx.beginPath(); ctx.ellipse(hcx+ex*pw*0.18,hcy+ph*0.24,4,7,ex*0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    // Stubby tail
    const tw=Math.sin(tt*8)*0.3;
    ctx.strokeStyle=body; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(px+pw*0.9,py+ph*0.55); ctx.quadraticCurveTo(px+pw+pw*0.2,py+ph*0.45+tw*ph*0.1,px+pw+pw*0.18,py+ph*0.38); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(px+pw*0.9,py+ph*0.55); ctx.quadraticCurveTo(px+pw+pw*0.2,py+ph*0.45+tw*ph*0.1,px+pw+pw*0.18,py+ph*0.38); ctx.stroke();
  }

  // ── Elephant ──────────────────────────────────────────────────────────────────
  function drawElephant(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Body
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.65,pw*0.50,ph*0.36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.72,pw*0.28,ph*0.18,0,0,Math.PI*2); ctx.fill();
    // Head
    const hcx=cx-pw*0.05, hcy=py+ph*0.22;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.38,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Big floppy ears
    for (const ex of [-1,1]) {
      ctx.fillStyle=body;
      ctx.beginPath(); ctx.ellipse(hcx+ex*pw*0.50,hcy+ph*0.04,pw*0.20,ph*0.28,ex*0.25,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=belly; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.ellipse(hcx+ex*pw*0.50,hcy+ph*0.06,pw*0.12,ph*0.18,ex*0.25,0,Math.PI*2); ctx.fill();
    }
    // Trunk — swings gently
    const trunkSwing=Math.sin(tt*4)*0.18;
    ctx.strokeStyle=body; ctx.lineWidth=10;
    ctx.beginPath();
    ctx.moveTo(hcx,hcy+ph*0.20);
    ctx.quadraticCurveTo(hcx+trunkSwing*pw*0.8, hcy+ph*0.44, hcx-pw*0.10+trunkSwing*pw*0.5, hcy+ph*0.52);
    ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(hcx,hcy+ph*0.20);
    ctx.quadraticCurveTo(hcx+trunkSwing*pw*0.8, hcy+ph*0.44, hcx-pw*0.10+trunkSwing*pw*0.5, hcy+ph*0.52);
    ctx.stroke();
    // Eyes
    drawEye(hcx-pw*0.14,hcy-ph*0.06,5);
    drawEye(hcx+pw*0.14,hcy-ph*0.06,5);
    // Tusk
    ctx.fillStyle="#fffacc"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.12,hcy+ph*0.16,5,10,0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Tail
    const etw=Math.sin(tt*7)*0.3;
    ctx.strokeStyle=body; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(px+pw*0.88,py+ph*0.52); ctx.quadraticCurveTo(px+pw+pw*0.15,py+ph*0.40+etw*ph*0.15,px+pw+pw*0.12,py+ph*0.30); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px+pw*0.88,py+ph*0.52); ctx.quadraticCurveTo(px+pw+pw*0.15,py+ph*0.40+etw*ph*0.15,px+pw+pw*0.12,py+ph*0.30); ctx.stroke();
  }

  // ── Puffin ────────────────────────────────────────────────────────────────────
  function drawPuffin(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    const isRainbow = (belly === "#ffffff" && body === "#111111" && activeSkinKey("puffin")==="rainbow");
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Round egg-shaped body
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.62,pw*0.44,ph*0.40,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // White belly
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx+pw*0.04,py+ph*0.65,pw*0.28,ph*0.28,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Round black head
    const hcx=cx, hcy=py+ph*0.20;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.34,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // White face patch
    ctx.fillStyle="white"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.08,hcy+ph*0.02,pw*0.20,ph*0.14,0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Colourful beak — triangle
    const beakCol = isRainbow ? null : "#ff8800";
    if (isRainbow) {
      // Striped rainbow beak
      const bx=hcx+pw*0.28, by=hcy+ph*0.02;
      const cols=["#ff2200","#ff8800","#ffee00"];
      cols.forEach((c,i)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(bx,by-5+i*4); ctx.lineTo(bx+pw*0.22,by+2); ctx.lineTo(bx,by+3+i*4); ctx.closePath(); ctx.fill(); });
      ctx.strokeStyle=INK; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(bx,by-5); ctx.lineTo(bx+pw*0.22,by+2); ctx.lineTo(bx,by+11); ctx.closePath(); ctx.stroke();
    } else {
      ctx.fillStyle=beakCol; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(hcx+pw*0.26,hcy-ph*0.04); ctx.lineTo(hcx+pw*0.50,hcy+ph*0.02); ctx.lineTo(hcx+pw*0.26,hcy+ph*0.10); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // Eye
    drawEye(hcx+pw*0.14,hcy-ph*0.04,5);
    // Wings — flap gently while running
    const flap=Math.sin(tt*14)*0.3;
    for (const ex of [-1,1]) {
      ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(cx,py+ph*0.50);
      ctx.quadraticCurveTo(cx+ex*pw*0.62, py+ph*0.38+flap*ex*ph*0.18, cx+ex*pw*0.58, py+ph*0.64+flap*ex*ph*0.08);
      ctx.quadraticCurveTo(cx+ex*pw*0.34, py+ph*0.72, cx, py+ph*0.60);
      ctx.fill(); ctx.stroke();
    }
    // Orange feet
    ctx.strokeStyle="#ff8800"; ctx.lineWidth=3.5;
    for (const fx of [cx-pw*0.10, cx+pw*0.10]) {
      ctx.beginPath(); ctx.moveTo(fx,py+ph*0.98); ctx.lineTo(fx,py+ph+8); ctx.stroke();
      ctx.lineWidth=2.5;
      for (const dx of [-8,0,8]) { ctx.beginPath(); ctx.moveTo(fx,py+ph+8); ctx.lineTo(fx+dx,py+ph+16); ctx.stroke(); }
      ctx.lineWidth=3.5;
    }
  }

  // ── Axolotl ───────────────────────────────────────────────────────────────────
  function drawAxolotl(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    // Gill colour — slightly darker/redder than body
    const gillCol = body==="#f0a0b8"?"#e06080":body==="#f8eedd"?"#e8c8a8":body==="#f0c840"?"#e09020":"#446633";
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Salamander body — long oval
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.65,pw*0.48,ph*0.35,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Belly
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.70,pw*0.30,ph*0.20,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Tail — wavy
    const tw=Math.sin(tt*8)*0.4;
    ctx.strokeStyle=body; ctx.lineWidth=10;
    ctx.beginPath(); ctx.moveTo(px+pw*0.88,py+ph*0.60); ctx.quadraticCurveTo(px+pw+pw*0.28,py+ph*0.50+tw*ph*0.20,px+pw+pw*0.38,py+ph*0.40+tw*ph*0.15); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw*0.88,py+ph*0.60); ctx.quadraticCurveTo(px+pw+pw*0.28,py+ph*0.50+tw*ph*0.20,px+pw+pw*0.38,py+ph*0.40+tw*ph*0.15); ctx.stroke();
    // Head — cute wide round face
    const hcx=cx-pw*0.06, hcy=py+ph*0.22;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.38,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Face belly patch
    ctx.fillStyle=belly; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(hcx,hcy+ph*0.06,pw*0.22,ph*0.12,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // External feathery gills — 3 stalks each side, wave gently
    for (const ex of [-1,1]) {
      for (let g=0; g<3; g++) {
        const gx=hcx+ex*pw*(0.28+g*0.06);
        const gy=hcy-ph*(0.12+g*0.06);
        const wave=Math.sin(tt*6+g*1.2)*0.12;
        ctx.strokeStyle=gillCol; ctx.lineWidth=3.5;
        ctx.beginPath(); ctx.moveTo(gx,gy+8); ctx.quadraticCurveTo(gx+ex*pw*0.08+wave*pw*0.15,gy-ph*0.12,gx+ex*pw*0.04,gy-ph*0.22); ctx.stroke();
        // Gill fronds
        ctx.fillStyle=gillCol; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(gx+ex*pw*0.04,gy-ph*0.22,4,7,ex*0.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
      }
    }
    // Cute wide eyes
    drawEye(hcx-pw*0.16,hcy-ph*0.04,6);
    drawEye(hcx+pw*0.16,hcy-ph*0.04,6);
    // Tiny smile
    ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(hcx,hcy+ph*0.08,pw*0.10,0.15,Math.PI-0.15); ctx.stroke();
    // Little limbs
    ctx.strokeStyle=body; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(px+pw*0.22,py+ph*0.85); ctx.lineTo(px+pw*0.10,py+ph+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px+pw*0.72,py+ph*0.85); ctx.lineTo(px+pw*0.85,py+ph+10); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(px+pw*0.22,py+ph*0.85); ctx.lineTo(px+pw*0.10,py+ph+10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px+pw*0.72,py+ph*0.85); ctx.lineTo(px+pw*0.85,py+ph+10); ctx.stroke();
  }


  // ── Pig ───────────────────────────────────────────────────────────────────────
  function drawPig(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Chunky round body
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.65,pw*0.48,ph*0.36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.72,pw*0.28,ph*0.18,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Round head
    const hcx=cx-pw*0.04, hcy=py+ph*0.20;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.36,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Snout — big round disc
    ctx.fillStyle=belly; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.14,hcy+ph*0.08,pw*0.18,ph*0.12,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Nostrils
    ctx.fillStyle="#cc7788";
    ctx.beginPath(); ctx.arc(hcx+pw*0.08,hcy+ph*0.09,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hcx+pw*0.20,hcy+ph*0.09,3.5,0,Math.PI*2); ctx.fill();
    // Perky ears
    for (const ex of [-1,1]) {
      ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(hcx+ex*pw*0.22,hcy-ph*0.16);
      ctx.lineTo(hcx+ex*pw*0.36,hcy-ph*0.42);
      ctx.lineTo(hcx+ex*pw*0.42,hcy-ph*0.14);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle=belly; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(hcx+ex*pw*0.24,hcy-ph*0.17);
      ctx.lineTo(hcx+ex*pw*0.34,hcy-ph*0.36);
      ctx.lineTo(hcx+ex*pw*0.38,hcy-ph*0.17);
      ctx.closePath(); ctx.fill();
    }
    drawEye(hcx-pw*0.12,hcy-ph*0.04,5);
    drawEye(hcx+pw*0.12,hcy-ph*0.04,5);
    // Curly tail (tight spiral)
    const tc=Math.sin(tt*8)*0.2;
    ctx.strokeStyle=body; ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(px+pw*0.88,py+ph*0.55);
    ctx.bezierCurveTo(px+pw+pw*0.20,py+ph*0.40,px+pw+pw*0.28,py+ph*0.28+tc*ph*0.15,px+pw+pw*0.18,py+ph*0.20);
    ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(px+pw*0.88,py+ph*0.55);
    ctx.bezierCurveTo(px+pw+pw*0.20,py+ph*0.40,px+pw+pw*0.28,py+ph*0.28+tc*ph*0.15,px+pw+pw*0.18,py+ph*0.20);
    ctx.stroke();
    // Inner curl
    ctx.strokeStyle=body; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(px+pw+pw*0.20,py+ph*0.26,pw*0.08,0,Math.PI*1.7);
    ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(px+pw+pw*0.20,py+ph*0.26,pw*0.08,0,Math.PI*1.7);
    ctx.stroke();
  }

  // ── Moose ─────────────────────────────────────────────────────────────────────
  function drawMoose(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Tall lanky body
    ctx.fillStyle=body; drawRoundRect(px+pw*0.08,py+ph*0.28,pw*0.84,ph*0.72,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.75,pw*0.26,ph*0.16,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Long neck
    ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(cx-pw*0.12,py+ph*0.28);
    ctx.lineTo(cx-pw*0.18,py+ph*0.08);
    ctx.lineTo(cx+pw*0.06,py+ph*0.04);
    ctx.lineTo(cx+pw*0.10,py+ph*0.26);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Head — longish
    const hcx=cx-pw*0.08, hcy=py+ph*0.02;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(hcx,hcy,pw*0.28,ph*0.13,0.15,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Big bulbous moose nose/muzzle
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.22,hcy+ph*0.04,pw*0.16,ph*0.09,0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#8b6040";
    ctx.beginPath(); ctx.arc(hcx+pw*0.28,hcy+ph*0.02,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hcx+pw*0.28,hcy+ph*0.07,3,0,Math.PI*2); ctx.fill();
    // Ears
    for (const ex of [-1,1]) {
      ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(hcx+ex*pw*0.24,hcy-ph*0.10,pw*0.09,ph*0.10,ex*0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=belly; ctx.beginPath(); ctx.ellipse(hcx+ex*pw*0.24,hcy-ph*0.10,pw*0.05,ph*0.06,ex*0.3,0,Math.PI*2); ctx.fill();
    }
    drawEye(hcx+pw*0.08,hcy-ph*0.03,5);
    // Antlers — the star feature!
    const aw=Math.sin(tt*3)*0.04; // tiny sway
    ctx.strokeStyle=body; ctx.lineWidth=7;
    for (const ex of [-1,1]) {
      const ax=hcx+ex*pw*0.16, ay=hcy-ph*0.12;
      // Main beam going up
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+ex*pw*0.14,ay-ph*0.32+aw*ph); ctx.stroke();
      // Brow tine
      ctx.beginPath(); ctx.moveTo(ax+ex*pw*0.06,ay-ph*0.14); ctx.lineTo(ax+ex*pw*0.20,ay-ph*0.18); ctx.stroke();
      // Palm — flat wide section
      const palmX=ax+ex*pw*0.14, palmY=ay-ph*0.32;
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.18,palmY+ph*0.04); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.16,palmY-ph*0.12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX+ex*pw*0.10,palmY-ph*0.06); ctx.lineTo(palmX+ex*pw*0.22,palmY-ph*0.10); ctx.stroke();
    }
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    for (const ex of [-1,1]) {
      const ax=hcx+ex*pw*0.16, ay=hcy-ph*0.12;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+ex*pw*0.14,ay-ph*0.32+aw*ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax+ex*pw*0.06,ay-ph*0.14); ctx.lineTo(ax+ex*pw*0.20,ay-ph*0.18); ctx.stroke();
      const palmX=ax+ex*pw*0.14, palmY=ay-ph*0.32;
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.18,palmY+ph*0.04); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX,palmY); ctx.lineTo(palmX+ex*pw*0.16,palmY-ph*0.12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(palmX+ex*pw*0.10,palmY-ph*0.06); ctx.lineTo(palmX+ex*pw*0.22,palmY-ph*0.10); ctx.stroke();
    }
    // Dewlap (bell) under chin
    ctx.fillStyle=belly; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.10,hcy+ph*0.12,pw*0.06,ph*0.08,0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Stubby tail
    ctx.fillStyle="white"; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(px+pw*0.92,py+ph*0.38,pw*0.06,ph*0.06,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  // ── Bear ──────────────────────────────────────────────────────────────────────
  function drawBear(px,py,pw,ph,body,belly,tt,ducking,now) {
    const cx=px+pw/2;
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    // Big stocky body
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.65,pw*0.50,ph*0.36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,py+ph*0.70,pw*0.30,ph*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Round head
    const hcx=cx-pw*0.04, hcy=py+ph*0.18;
    ctx.fillStyle=body; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(hcx,hcy,pw*0.38,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Snout
    ctx.fillStyle=belly; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.12,hcy+ph*0.10,pw*0.20,ph*0.13,0.1,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#331111";
    ctx.beginPath(); ctx.ellipse(hcx+pw*0.16,hcy+ph*0.07,pw*0.08,ph*0.05,0,0,Math.PI*2); ctx.fill();
    // Round ears
    for (const ex of [-1,1]) {
      ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(hcx+ex*pw*0.32,hcy-ph*0.22,pw*0.13,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle=belly; ctx.beginPath(); ctx.arc(hcx+ex*pw*0.32,hcy-ph*0.22,pw*0.07,0,Math.PI*2); ctx.fill();
    }
    drawEye(hcx-pw*0.14,hcy-ph*0.04,6);
    drawEye(hcx+pw*0.10,hcy-ph*0.04,6);
    // Lumbering arm forward while running
    const armSwing=Math.sin(tt*7)*0.25;
    ctx.strokeStyle=body; ctx.lineWidth=12;
    ctx.beginPath(); ctx.moveTo(px+pw*0.15,py+ph*0.55); ctx.lineTo(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15); ctx.stroke();
    ctx.strokeStyle=INK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px+pw*0.15,py+ph*0.55); ctx.lineTo(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15); ctx.stroke();
    // Paw
    ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px-pw*0.12,py+ph*0.72+armSwing*ph*0.15,pw*0.10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Claws
    ctx.strokeStyle=INK; ctx.lineWidth=1.5;
    for (let c=-1;c<=1;c++) {
      ctx.beginPath(); ctx.moveTo(px-pw*0.12+c*pw*0.06,py+ph*0.72+armSwing*ph*0.15+pw*0.08);
      ctx.lineTo(px-pw*0.12+c*pw*0.08,py+ph*0.72+armSwing*ph*0.15+pw*0.14); ctx.stroke();
    }
    // Stubby tail
    ctx.fillStyle=body; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px+pw*0.90,py+ph*0.46,pw*0.07,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  const CHAR_DRAW = { frog:drawFrog, dog:drawDog, cat:drawCat, monkey:drawMonkey, capybara:drawCapybara, hippo:drawHippo, elephant:drawElephant, puffin:drawPuffin, axolotl:drawAxolotl, pig:drawPig, moose:drawMoose, bear:drawBear };

  // ── Player draw ───────────────────────────────────────────────────────────────
  function drawPlayer(now) {
    const ck=save.character, skin=activeSkin(ck);
    const stretch=player.ducking?0:clamp(Math.abs(player.vy)/1200,0,1);
    let sx,sy;
    if (player.ducking)  { sx=1.30; sy=DUCK_H_RATIO; }
    else if (!player.on) { sx=1-0.10*stretch; sy=1+0.20*stretch; }
    else { const bob=Math.sin(player.tt*18)*0.02; sx=1+bob; sy=1-bob; }

    const pw=player.w*sx, ph=player.h*sy;
    const px=player.x+(player.w-pw)/2;
    const py=(player.y+player.h)-ph;

    // Shield bubble
    if (player.shieldT>0) {
      ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle="#78beff";
      ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+player.h/2,player.w*0.82,player.h*0.82,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.strokeStyle="#3c78dc"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+player.h/2,player.w*0.82,player.h*0.82,0,0,Math.PI*2); ctx.stroke();
    }
    // Shadow
    ctx.fillStyle="rgba(0,0,0,0.12)";
    ctx.beginPath(); ctx.ellipse(player.x+player.w/2,GROUND_Y+14,player.w*0.70,7,0,0,Math.PI*2); ctx.fill();

    CHAR_DRAW[ck]?.(px,py,pw,ph,skin.body,skin.belly,player.tt,player.ducking,now);

    // Magnet pip
    if (player.magnetT>0) {
      ctx.fillStyle="#ff5a5a"; ctx.strokeStyle=INK; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(px+pw*0.18,py+ph*0.10,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    // Charge bar
    if (player.charging&&player.chargeT>0) {
      const ratio=clamp(player.chargeT/CHARGE_TIME,0,1);
      const bx=px-4, by=py-18, bw=pw+8, bh=8;
      ctx.fillStyle="rgba(0,0,0,0.18)"; drawRoundRect(bx,by,bw,bh,4); ctx.fill();
      ctx.fillStyle=`hsl(${Math.round(110-ratio*80)},90%,48%)`; drawRoundRect(bx,by,bw*ratio,bh,4); ctx.fill();
      ctx.strokeStyle=INK; ctx.lineWidth=1.5; drawRoundRect(bx,by,bw,bh,4); ctx.stroke();
    }
  }

  // ── Main draw ─────────────────────────────────────────────────────────────────
  function draw(now) {
    if (state==="shop") { drawShop(); return; }
    if (state==="leaderboard") { drawLeaderboard(); return; }

    drawSky();
    drawStars(now);
    drawDesertSun(now);
    drawDesertDunes(now);
    drawStormClouds(now);
    clouds.forEach(drawCloud);
    drawLightning(now);
    drawRain(now);
    drawHeatShimmer(now);
    drawArcticSnow(now);
    drawUnderwaterBubbles(now);

    const gc  = getBiomeGround();
    const gdc = getBiomeGroundDark();
    ctx.fillStyle=gc; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    ctx.fillStyle=gdc; ctx.fillRect(0,GROUND_Y,W,8);
    // Ground surface dots — tint based on biome
    const dotOff=(dist*0.6)%40;
    if (biomeIdx===4||prevBiome===4) {
      // Arctic: little ice crystal dots on snow
      ctx.fillStyle="rgba(180,220,255,0.70)";
      for (let x=-40;x<W+40;x+=40) { ctx.beginPath(); ctx.arc(x-dotOff,GROUND_Y+5,5,0,Math.PI*2); ctx.fill(); }
    } else if (biomeIdx===5||prevBiome===5) {
      // Underwater: wavy seaweed stubs
      ctx.strokeStyle="rgba(40,180,120,0.55)"; ctx.lineWidth=3;
      for (let x=0;x<W+60;x+=60) {
        const sx=(x-dotOff+W*2)%W;
        ctx.beginPath(); ctx.moveTo(sx,GROUND_Y); ctx.quadraticCurveTo(sx+12,GROUND_Y-22,sx+6,GROUND_Y-40); ctx.stroke();
      }
    } else {
      const dotCol = biomeIdx===0?"#5acb66":"rgba(0,0,0,0.10)";
      ctx.fillStyle=dotCol;
      for (let x=-40;x<W+40;x+=40) { ctx.beginPath(); ctx.arc(x-dotOff,GROUND_Y+40,4,0,Math.PI*2); ctx.fill(); }
    }

    // Coins
    for (const c of coinList) {
      const alpha=c.got?Math.max(0,1-c.popT/COIN_POP_DUR):1;
      if (alpha<=0) continue;
      const scale=c.got?1+c.popT/COIN_POP_DUR*0.6:1;
      const spin=0.35+0.65*Math.abs(Math.sin((now/1000)*8+c.x*0.01));
      ctx.save(); ctx.globalAlpha=alpha; ctx.translate(c.x,c.y); ctx.scale(scale,scale);
      ctx.fillStyle="#ffdc5a"; ctx.strokeStyle=INK; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(0,0,c.r*spin,c.r,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-c.r+4); ctx.lineTo(0,c.r-4); ctx.stroke();
      ctx.restore();
    }

    // Power orbs
    const orbColors={shield:"#78beff",magnet:"#ff5a5a",double:"#af78ff"};
    for (const o of orbList) {
      if (o.got) continue;
      const c=orbColors[o.kind];
      ctx.save(); ctx.globalAlpha=0.35; ctx.fillStyle=c; ctx.beginPath(); ctx.arc(o.x,o.y,o.r*2,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.fillStyle=c; ctx.strokeStyle=INK; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle="white";
      if (o.kind==="shield")      { ctx.beginPath(); ctx.arc(o.x,o.y,6,0,Math.PI*2); ctx.fill(); }
      else if (o.kind==="magnet") { drawRoundRect(o.x-6,o.y-6,12,12,3); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(o.x-6,o.y+5); ctx.lineTo(o.x,o.y-7); ctx.lineTo(o.x+6,o.y+5); ctx.closePath(); ctx.fill(); }
    }

    // Obstacles
    for (const o of obstacles) {
      ctx.strokeStyle=INK; ctx.lineWidth=3;
      if (o.kind==="snake") {
        // Draw a proper coiled snake with sinuous body, raised head, scales, tongue
        const t = now / 1000;
        const bx = o.x, by = o.y + o.h, bw = o.w, bh = o.h;
        const cx = bx + bw * 0.5;
        const scaleBody = "#3cb83c", scaleLight = "#55dd55", scaleBelly = "#c8f0a8", scalePattern = "#2a9a2a";

        // --- Coiled body: two overlapping sine-wave ovals sitting on the ground ---
        ctx.save();
        // Bottom coil (bigger)
        ctx.fillStyle = scaleBody; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx - bw*0.06, by - bh*0.28, bw*0.42, bh*0.28, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        // Belly highlight on bottom coil
        ctx.fillStyle = scaleBelly;
        ctx.beginPath();
        ctx.ellipse(cx - bw*0.06, by - bh*0.22, bw*0.24, bh*0.14, 0, 0, Math.PI*2);
        ctx.fill();
        // Scale pattern diamonds on body
        ctx.fillStyle = scalePattern;
        for (let si = 0; si < 3; si++) {
          const sx = cx - bw*0.28 + si*bw*0.22, sy = by - bh*0.30;
          ctx.beginPath();
          ctx.moveTo(sx, sy - bh*0.08); ctx.lineTo(sx + bw*0.08, sy);
          ctx.lineTo(sx, sy + bh*0.08); ctx.lineTo(sx - bw*0.08, sy);
          ctx.closePath(); ctx.fill();
        }
        // Top coil (smaller, sits on top of bottom)
        ctx.fillStyle = scaleBody; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(cx + bw*0.08, by - bh*0.60, bw*0.28, bh*0.20, 0.2, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = scaleBelly;
        ctx.beginPath();
        ctx.ellipse(cx + bw*0.08, by - bh*0.56, bw*0.14, bh*0.10, 0.2, 0, Math.PI*2);
        ctx.fill();

        // --- Raised head, angled up and to the right ---
        const headAngle = -0.55; // radians — head tilted up
        const headBaseX = cx + bw*0.28, headBaseY = by - bh*0.72;
        ctx.save();
        ctx.translate(headBaseX, headBaseY);
        ctx.rotate(headAngle);
        // Head shape: slightly flattened triangle-ish ellipse (viper style)
        ctx.fillStyle = scaleBody; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(bw*0.10, 0, bw*0.20, bh*0.14, 0, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        // Snout tip slightly pointed
        ctx.fillStyle = scaleBody;
        ctx.beginPath();
        ctx.moveTo(bw*0.26, -bh*0.06); ctx.lineTo(bw*0.34, 0); ctx.lineTo(bw*0.26, bh*0.06);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Top-of-head scale ridge
        ctx.fillStyle = scalePattern;
        ctx.beginPath();
        ctx.ellipse(bw*0.10, -bh*0.06, bw*0.10, bh*0.04, 0, 0, Math.PI*2);
        ctx.fill();
        // Eye — slit pupil for menace
        const ex = bw*0.18, ey = -bh*0.04;
        ctx.fillStyle = "#ffee00"; ctx.beginPath(); ctx.arc(ex, ey, bh*0.055, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#111"; ctx.beginPath();
        ctx.ellipse(ex, ey, bh*0.018, bh*0.048, 0, 0, Math.PI*2); ctx.fill();
        // Eye outline
        ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(ex, ey, bh*0.055, 0, Math.PI*2); ctx.stroke();
        // Nostril dots
        ctx.fillStyle = "#1a5a1a";
        ctx.beginPath(); ctx.arc(bw*0.28, -bh*0.03, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(bw*0.28,  bh*0.03, 2, 0, Math.PI*2); ctx.fill();
        // Forked tongue — flickers via sine wave
        const tongueFlick = Math.sin(t * 9 + o.phase) > 0;
        if (tongueFlick) {
          ctx.strokeStyle = "#ff1144"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(bw*0.32, 0); ctx.lineTo(bw*0.46, 0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(bw*0.46, 0); ctx.lineTo(bw*0.54, -bh*0.06); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(bw*0.46, 0); ctx.lineTo(bw*0.54,  bh*0.06); ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
      } else if (o.kind==="rock") {
        // Mossy/desert rock
        const cx=o.x+o.w/2, cy=o.y+o.h/2;
        const rc = biomeIdx>=2 ? "#5a5050" : "#8a8070";
        const rh = biomeIdx>=2 ? "#6a6060" : "#aaa090";
        ctx.fillStyle=rc; ctx.strokeStyle=INK; ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(o.x+o.w*0.10, o.y+o.h);
        ctx.lineTo(o.x, o.y+o.h*0.65);
        ctx.quadraticCurveTo(o.x+o.w*0.10, o.y, cx-o.w*0.08, o.y+o.h*0.05);
        ctx.quadraticCurveTo(cx+o.w*0.15, o.y-o.h*0.05, o.x+o.w*0.88, o.y+o.h*0.10);
        ctx.lineTo(o.x+o.w, o.y+o.h*0.60);
        ctx.lineTo(o.x+o.w*0.90, o.y+o.h);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        // Highlight
        ctx.fillStyle=rh;
        ctx.beginPath(); ctx.ellipse(cx-o.w*0.10, o.y+o.h*0.22, o.w*0.18, o.h*0.12, -0.4, 0, Math.PI*2); ctx.fill();
        // Crack
        ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(cx,o.y+o.h*0.15); ctx.lineTo(cx+o.w*0.08,o.y+o.h*0.55); ctx.stroke();
      } else if (o.kind==="cactus") {
        const cx=o.x+o.w/2;
        const cc="#3a8a3a", cd="#2a6a2a";
        // Main trunk
        ctx.fillStyle=cc; ctx.strokeStyle=INK; ctx.lineWidth=3;
        drawRoundRect(cx-o.w*0.28, o.y+o.h*0.15, o.w*0.56, o.h*0.85, 8); ctx.fill(); ctx.stroke();
        // Left arm
        ctx.fillStyle=cc;
        drawRoundRect(o.x, o.y+o.h*0.35, o.w*0.28, o.h*0.20, 6); ctx.fill(); ctx.stroke();
        drawRoundRect(o.x, o.y+o.h*0.15, o.w*0.20, o.h*0.22, 6); ctx.fill(); ctx.stroke();
        // Right arm
        drawRoundRect(o.x+o.w*0.72, o.y+o.h*0.40, o.w*0.28, o.h*0.18, 6); ctx.fill(); ctx.stroke();
        drawRoundRect(o.x+o.w*0.80, o.y+o.h*0.22, o.w*0.20, o.h*0.20, 6); ctx.fill(); ctx.stroke();
        // Ribs
        ctx.strokeStyle=cd; ctx.lineWidth=2;
        for (let ri=0;ri<4;ri++) {
          const ry=o.y+o.h*0.22+ri*o.h*0.18;
          ctx.beginPath(); ctx.moveTo(cx-o.w*0.22,ry); ctx.lineTo(cx+o.w*0.22,ry); ctx.stroke();
        }
        // Spine dots
        ctx.fillStyle="#ffffcc";
        for (let si=0;si<8;si++) {
          const sx=cx+(si%2===0?-1:1)*o.w*0.18, sy=o.y+o.h*0.20+si*o.h*0.10;
          ctx.beginPath(); ctx.arc(sx,sy,2,0,Math.PI*2); ctx.fill();
        }
      } else if (o.kind==="log") {
        const cx=o.x+o.w/2, cy=o.y+o.h/2;
        // Log body
        ctx.fillStyle="#7a4a20"; ctx.strokeStyle=INK; ctx.lineWidth=3;
        drawRoundRect(o.x, o.y+o.h*0.15, o.w, o.h*0.85, 10); ctx.fill(); ctx.stroke();
        // Dark stripe grain
        ctx.strokeStyle="#5a3010"; ctx.lineWidth=2;
        for (let gi=1;gi<4;gi++) {
          const gx=o.x+o.w*gi/4;
          ctx.beginPath(); ctx.moveTo(gx, o.y+o.h*0.20); ctx.lineTo(gx, o.y+o.h*0.98); ctx.stroke();
        }
        // End rings (left face)
        ctx.strokeStyle=INK; ctx.fillStyle="#a06030"; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(o.x+o.w*0.12, cy, o.w*0.12, o.h*0.38, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle="#7a4a20"; ctx.lineWidth=1.5;
        for (let ri=0;ri<3;ri++) {
          ctx.beginPath(); ctx.ellipse(o.x+o.w*0.12, cy, o.w*(0.04+ri*0.03), o.h*(0.10+ri*0.09), 0, 0, Math.PI*2); ctx.stroke();
        }
        // Knot
        ctx.fillStyle="#5a3010";
        ctx.beginPath(); ctx.ellipse(cx+o.w*0.10, cy-o.h*0.08, o.w*0.06, o.h*0.09, 0.3, 0, Math.PI*2); ctx.fill();
      } else if (o.kind==="bird") {
        const wb=Math.sin((now/1000)*7+o.phase)*18;
        const cx=o.x+o.w/2, cy=o.y+o.h/2, ws=o.w*0.75;
        ctx.save(); ctx.setLineDash([10,8]);
        ctx.strokeStyle="rgba(80,180,255,0.45)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(o.x-10,BIRD_GAP_BOTTOM); ctx.lineTo(o.x+o.w+10,BIRD_GAP_BOTTOM); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
        ctx.fillStyle="#ffbe46"; ctx.strokeStyle=INK; ctx.lineWidth=3;
        for (const ex of [-1,1]) {
          ctx.beginPath(); ctx.moveTo(cx,cy);
          ctx.quadraticCurveTo(cx+ex*ws*0.6,cy-28+wb,cx+ex*ws,cy+wb);
          ctx.quadraticCurveTo(cx+ex*ws*0.5,cy+10+wb*0.3,cx,cy);
          ctx.fill(); ctx.stroke();
        }
        ctx.fillStyle="#ff7a3c"; ctx.beginPath(); ctx.ellipse(cx,cy,o.w*0.32,o.h*0.44,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle="#ffd5a0"; ctx.beginPath(); ctx.ellipse(cx,cy+o.h*0.10,o.w*0.18,o.h*0.26,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#ffbe46"; ctx.beginPath(); ctx.moveTo(cx+o.w*0.28,cy-4); ctx.lineTo(cx+o.w*0.44,cy); ctx.lineTo(cx+o.w*0.28,cy+6); ctx.closePath(); ctx.fill(); ctx.stroke();
        drawEye(cx+o.w*0.14,cy-o.h*0.12,6);
        ctx.strokeStyle=INK; ctx.lineWidth=2.5;
        for (const fx of [cx-o.w*0.10,cx+o.w*0.10]) {
          ctx.beginPath(); ctx.moveTo(fx,cy+o.h*0.44); ctx.lineTo(fx,cy+o.h*0.44+14); ctx.stroke();
          for (const dx of [-8,0,8]) { ctx.beginPath(); ctx.moveTo(fx,cy+o.h*0.44+14); ctx.lineTo(fx+dx,cy+o.h*0.44+22); ctx.stroke(); }
        }
      } else if (o.kind==="eagle") {
        // Dark brown eagle — bigger, more menacing than bird
        const wb=Math.sin((now/1000)*5+o.phase)*22;
        const cx=o.x+o.w/2, cy=o.y+o.h/2, ws=o.w*0.90;
        ctx.save(); ctx.setLineDash([10,8]);
        ctx.strokeStyle="rgba(180,120,60,0.35)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(o.x-10,BIRD_GAP_BOTTOM); ctx.lineTo(o.x+o.w+10,BIRD_GAP_BOTTOM); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
        // Wings
        ctx.fillStyle="#6a3a10"; ctx.strokeStyle=INK; ctx.lineWidth=3;
        for (const ex of [-1,1]) {
          ctx.beginPath(); ctx.moveTo(cx,cy);
          ctx.quadraticCurveTo(cx+ex*ws*0.55,cy-32+wb,cx+ex*ws,cy+wb*1.1);
          ctx.quadraticCurveTo(cx+ex*ws*0.45,cy+12+wb*0.4,cx,cy);
          ctx.fill(); ctx.stroke();
        }
        // Wing feather tips
        ctx.strokeStyle="#3a1a00"; ctx.lineWidth=1.5;
        for (const ex of [-1,1]) {
          for (let fi=0;fi<4;fi++) {
            const ft=0.7+fi*0.08;
            const fx=cx+ex*ws*ft, fy=cy+wb*ft*1.1;
            ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+ex*12,fy+16); ctx.stroke();
          }
        }
        // Body — dark brown
        ctx.fillStyle="#5a2a08"; ctx.strokeStyle=INK; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(cx,cy,o.w*0.30,o.h*0.42,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        // White head
        ctx.fillStyle="#f0f0e8";
        ctx.beginPath(); ctx.arc(cx+o.w*0.18,cy-o.h*0.18,o.w*0.17,0,Math.PI*2); ctx.fill(); ctx.stroke();
        // Hooked yellow beak
        ctx.fillStyle="#e8c020"; ctx.strokeStyle=INK; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(cx+o.w*0.30,cy-o.h*0.14);
        ctx.quadraticCurveTo(cx+o.w*0.50,cy-o.h*0.10,cx+o.w*0.44,cy-o.h*0.02);
        ctx.lineTo(cx+o.w*0.30,cy-o.h*0.10); ctx.closePath(); ctx.fill(); ctx.stroke();
        drawEye(cx+o.w*0.22,cy-o.h*0.22,5,"#cc8800");
        // Talons
        ctx.strokeStyle="#3a2000"; ctx.lineWidth=2.5;
        for (const fx of [cx-o.w*0.08,cx+o.w*0.08]) {
          ctx.beginPath(); ctx.moveTo(fx,cy+o.h*0.40); ctx.lineTo(fx,cy+o.h*0.55); ctx.stroke();
          for (const tx of [-8,0,9]) { ctx.beginPath(); ctx.moveTo(fx,cy+o.h*0.55); ctx.lineTo(fx+tx,cy+o.h*0.65); ctx.stroke(); }
        }
      } else if (o.kind==="bat") {
        // Dark purple/black bat — night and storm only
        const wb=Math.sin((now/1000)*11+o.phase)*24;
        const cx=o.x+o.w/2, cy=o.y+o.h/2, ws=o.w*0.85;
        ctx.save(); ctx.setLineDash([10,8]);
        ctx.strokeStyle="rgba(120,80,180,0.30)"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(o.x-10,BIRD_GAP_BOTTOM); ctx.lineTo(o.x+o.w+10,BIRD_GAP_BOTTOM); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
        // Bat wings — membrane style
        ctx.fillStyle="#2a1a44"; ctx.strokeStyle="#110a22"; ctx.lineWidth=2;
        for (const ex of [-1,1]) {
          ctx.beginPath();
          ctx.moveTo(cx, cy-o.h*0.10);
          ctx.quadraticCurveTo(cx+ex*ws*0.40, cy-38+wb, cx+ex*ws, cy-8+wb);
          ctx.quadraticCurveTo(cx+ex*ws*0.65, cy+14+wb*0.5, cx+ex*ws*0.30, cy+8);
          ctx.quadraticCurveTo(cx+ex*ws*0.15, cy+4, cx, cy+2);
          ctx.fill(); ctx.stroke();
          // Wing finger veins
          ctx.strokeStyle="#3a2a60"; ctx.lineWidth=1;
          for (let vi=1;vi<=3;vi++) {
            const vx=cx+ex*ws*(0.18*vi), vy=cy-o.h*0.10;
            ctx.beginPath(); ctx.moveTo(cx,vy);
            ctx.quadraticCurveTo(cx+ex*ws*(0.20*vi),cy-22+wb*(vi*0.3),vx,cy-4+wb*(vi*0.25)); ctx.stroke();
          }
        }
        // Bat body
        ctx.fillStyle="#1a1030"; ctx.strokeStyle="#110a22"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.ellipse(cx,cy,o.w*0.18,o.h*0.34,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        // Head with pointy ears
        ctx.fillStyle="#1a1030"; ctx.strokeStyle="#110a22"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cx,cy-o.h*0.32,o.w*0.16,0,Math.PI*2); ctx.fill(); ctx.stroke();
        for (const ex of [-1,1]) {
          ctx.beginPath();
          ctx.moveTo(cx+ex*o.w*0.08, cy-o.h*0.38);
          ctx.lineTo(cx+ex*o.w*0.18, cy-o.h*0.60);
          ctx.lineTo(cx+ex*o.w*0.20, cy-o.h*0.36);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        // Eyes — glowing red
        ctx.fillStyle="#ff2200";
        ctx.beginPath(); ctx.arc(cx-o.w*0.07,cy-o.h*0.34,3,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+o.w*0.07,cy-o.h*0.34,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#ff8888";
        ctx.beginPath(); ctx.arc(cx-o.w*0.07,cy-o.h*0.34,1.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx+o.w*0.07,cy-o.h*0.34,1.2,0,Math.PI*2); ctx.fill();
      }
    }

    drawPlayer(now);

    if (state==="start") {
      drawCenteredPanel(`${CHARACTERS[save.character].label} Runner`,
        "Hold Space/↑ = charge jump  •  Hold ↓/S = duck",
        "Jump over snakes  •  Duck under birds  •  S = Shop  •  L = Leaderboard");
    }
    if (state==="over") {
      const rank=save.leaderboard.findIndex(e=>e.score===score)+1;
      const rankStr=rank>0?(rank<=3?["🥇 NEW RECORD!","🥈 2nd Place!","🥉 3rd Place!"][rank-1]:`Rank #${rank}`):"";
      drawCenteredPanel("GAME OVER",
        `Score: ${score}  •  Best: ${save.best}  •  Coins: ${coinsRun}${rankStr?" — "+rankStr:""}`,
        "Space/R to restart  •  S = Shop  •  L = Leaderboard");
    }
  }

  // ── Update loop ───────────────────────────────────────────────────────────────
  let last=performance.now();
  function loop(now) {
    const dt=Math.min(0.033,(now-last)/1000); last=now;
    for (const cl of clouds) { cl.x-=cl.v*dt; if (cl.x<-260) Object.assign(cl,randomCloud()); }

    if (state==="play") {
      runTime+=dt; player.tt+=dt;

      // ── Biome transitions ──────────────────────────────────────────────────
      {
        // Check if we should enter next biome
        let targetBiome = 0;
        for (let bi=BIOME_TIMES.length-1;bi>=0;bi--) {
          if (runTime>=BIOME_TIMES[bi]) { targetBiome=bi; break; }
        }
        if (targetBiome !== biomeIdx) {
          prevBiome  = biomeIdx;
          biomeIdx   = targetBiome;
          biomeFade  = 0;
        }
        if (biomeFade < 1) biomeFade = Math.min(1, biomeFade + dt / BIOME_FADE);
      }

      // ── Rain / lightning update ────────────────────────────────────────────
      if (biomeIdx===3) {
        for (const rd of rainDrops) {
          rd.x += rd.vx*dt; rd.y += rd.vy*dt;
          if (rd.y>H+20)  { rd.y=-10; rd.x=Math.random()*(W+140)-70; }
          if (rd.x<-80)   { rd.x=W+20; rd.y=Math.random()*H; }
        }
        lightningT-=dt;
        if (lightningT<=0) {
          lightningT=2.5+Math.random()*4;
          lightningFlash=1.0;
          lightningBoltX=W*0.3+Math.random()*W*0.5;
          beep(55,0.18,0.07);
        }
        if (lightningFlash>0) lightningFlash=Math.max(0,lightningFlash-dt*8);
        for (const sc of stormClouds) {
          sc.x-=sc.v*dt; if (sc.x+sc.w<0) sc.x=W+sc.w*0.5;
        }
      }

      // ── Heat shimmer scroll ────────────────────────────────────────────────
      shimmerOff=(shimmerOff+speed*dt*0.3)%W;
      player.shieldT=Math.max(0,player.shieldT-dt);
      player.magnetT=Math.max(0,player.magnetT-dt);
      player.doubleT=Math.max(0,player.doubleT-dt);
      if (player.doubleT===0) player.doubleUsed=false;
      player.coyoteT=Math.max(0,player.coyoteT-dt);

      if (player.charging&&player.on) player.chargeT=Math.min(CHARGE_TIME,player.chargeT+dt);
      if (player.charging&&!player.on&&player.coyoteT<=0) jumpReleased();

      speed=speedForTime(runTime); dist+=speed*dt; score=Math.floor(dist/12);

      const baseG=assist?GRAVITY_ASS:GRAVITY_NORM;
      const gm=(player.jumpHeld&&!player.charging&&player.vy<0)?JUMP_HOLD_GRAV_MULT:1.0;
      player.vy+=baseG*gm*dt; player.y+=player.vy*dt;

      if (player.y+player.h>=GROUND_Y) { player.y=GROUND_Y-player.h; player.vy=0; player.on=true; }
      else player.on=false;
      if (player.on) { player.coyoteT=COYOTE_TIME; player.doubleUsed=false; }
      if (!player.on) player.ducking=false;
      // Fix duck-stuck: if duck key is no longer held, always clear ducking on ground
      if (player.on && !duckHeld) player.ducking=false;

      if (assist&&!assistShieldGiven&&runTime>=ASSIST_SHIELD_TIME&&player.shieldT<=0) {
        orbList.push({x:W+260,y:Math.max(120,GROUND_Y-150),r:14,kind:"shield",got:false});
        assistShieldGiven=true;
      }

      if (nextSpawn<W+60) spawnPack();
      nextSpawn-=speed*dt;
      for (const o of obstacles) o.x-=speed*dt;
      for (const c of coinList)  c.x-=speed*dt;
      for (const o of orbList)   o.x-=speed*dt;
      for (const c of coinList) if (c.got) c.popT+=dt;
      obstacles=obstacles.filter(o=>o.x+o.w>-20);
      coinList =coinList.filter(c=>c.x+c.r>-20&&(!c.got||c.popT<COIN_POP_DUR));
      orbList  =orbList.filter(o=>o.x+o.r>-20&&!o.got);

      if (player.magnetT>0) {
        const mx=player.x+player.w/2, my=player.y+player.h/2;
        for (const c of coinList) {
          if (c.got) continue;
          const dx=mx-c.x, dy=my-c.y;
          if (Math.hypot(dx,dy)<170) { c.x+=dx*dt*3.3; c.y+=dy*dt*3.3; }
        }
      }

      const pr={
        x:player.x,
        y:player.ducking?player.y+player.h*(1-DUCK_H_RATIO):player.y,
        w:player.w,
        h:player.ducking?player.h*DUCK_H_RATIO:player.h,
      };

      for (const c of coinList) {
        if (c.got) continue;
        if (rects(pr,{x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2})) {
          c.got=true; coinsRun++; save.wallet++; persist(); beep(880,0.05,0.05);
        }
      }
      for (const o of orbList) {
        if (o.got) continue;
        if (rects(pr,{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2})) {
          o.got=true;
          if (o.kind==="shield") player.shieldT=POWER_DUR.shield;
          if (o.kind==="magnet") player.magnetT=POWER_DUR.magnet;
          if (o.kind==="double") player.doubleT=POWER_DUR.double;
          beep(660,0.05,0.05); beep(880,0.05,0.05);
        }
      }

      let dead=false;
      for (const o of obstacles) {
        if (!rects(pr,o)) continue;
        if (player.shieldT > 0) {
          // Shield absorbs the hit — knock obstacle back so it can't immediately re-collide
          player.shieldT = 0;
          o.x -= player.w + 20; // push past the player
          beep(220, 0.05, 0.06); beep(440, 0.05, 0.04);
          break;
        }
        dead = true; beep(120, 0.12, 0.08); break;
      }
      if (dead) {
        save.best=Math.max(save.best,score);
        // Leaderboard: push entry, keep top 10
        const entry={score, char:save.character, skin:activeSkinKey(save.character),
                     biome:biomeIdx, date:new Date().toLocaleDateString()};
        save.leaderboard.push(entry);
        save.leaderboard.sort((a,b)=>b.score-a.score);
        if (save.leaderboard.length>10) save.leaderboard.length=10;
        persist();
        state="over";
        stopMusic(); playMusic("start");
      }
    }

    // HUD
    hudScore.textContent  = `Score: ${score}`;
    hudCoins.textContent  = `Coins: ${coinsRun}`;
    hudWallet.textContent = `Wallet: ${save.wallet}`;
    hudChar.textContent   = `${CHARACTERS[save.character].label} · ${activeSkin(save.character).label}`;
    const powers=[];
    if (player.shieldT>0) powers.push(`Shield ${player.shieldT.toFixed(1)}s`);
    if (player.magnetT>0) powers.push(`Magnet ${player.magnetT.toFixed(1)}s`);
    if (player.doubleT>0) powers.push(`Double ${player.doubleT.toFixed(1)}s`);
    hudPowers.textContent=`Powers: ${powers.length?powers.join(" • "):"none"}`;

    draw(now);
    requestAnimationFrame(loop);
  }
  // Kick off the loop
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
